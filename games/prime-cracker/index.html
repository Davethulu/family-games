<title>Prime Cracker</title>
<style>

  .rcard .tx { flex:1; min-width:0; }

  .rcard small { display:block; color:var(--muted); font-size:13.5px; font-weight:700; line-height:1.25; }
  .rcard .sc { flex:none; text-align:right; font-size:13px; font-weight:800; color:var(--gold); white-space:nowrap; }
  .panel { background:rgba(0,0,0,.34); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:7px; }
  .panel h3 { font-size:15px; color:var(--gold); }
  .panel .row { display:flex; justify-content:space-between; gap:10px; font-size:17px; font-weight:800; }
  .panel .row sup { font-size:.66em; line-height:0; }
  .panel .row span:last-child { color:var(--bad); font-size:14px; white-space:nowrap; }
  .panel p { text-align:left; font-size:15px; }
  .stars { font-size:40px; text-align:center; letter-spacing:4px; line-height:1.1; }
  .stars i { font-style:normal; filter:grayscale(1) brightness(.45); }

  @media (max-height:620px) {

  }
  @media (prefers-reduced-motion: reduce) {
    .node.drop .face, .node.shake .face, .node.hit .face, .node.pop .face, #strike { animation-duration:.01s; }
  }
</style>
</head>
<body data-round="quarry">
<div id="app">
  <header id="hud">
    <div id="rName"><b></b><small></small></div>
    <button id="quit" class="icon" aria-label="Back to all rounds">🗺️</button>
    <button id="mute" class="icon" aria-label="Sound on or off">🔊</button>
  </header>
  <div id="stats"><span id="shields" aria-label="Shields"></span><span id="streak"></span><span id="gems"></span></div>
  <div id="fuse"><i></i></div>
  <main id="cave"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></main>
  <section id="status" aria-live="polite"></section>
  <section id="tray"></section>
</div>
<div id="screen"></div>

<script>
'use strict';
/* ---------- number helpers ---------- */
function factorize(n) {
  const out = [];
  for (let p = 2; p * p <= n; p++) while (n % p === 0) { out.push(p); n /= p; }
  if (n > 1) out.push(n);
  return out;
}
const isPrime = n => n > 1 && factorize(n).length === 1;
const smallest = n => factorize(n)[0];
function truePairs(n) {
  const out = [];
  for (let a = 2; a * a <= n; a++) if (n % a === 0) out.push([a, n / a]);
  return out;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const digitsOf = n => String(n).split('').map(Number);
const digitSum = n => digitsOf(n).reduce((x, y) => x + y, 0);
function range(lo, hi, test) {
  const out = [];
  for (let n = lo; n <= hi; n++) if (test(n)) out.push(n);
  return out;
}
const COUNT_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];

/* ---------- rounds ---------- */
const hasRepeat = n => { const f = factorize(n); return f.some((p, i) => p === f[i + 1]); };
const maxFactor = n => { const f = factorize(n); return f[f.length - 1]; };
const divisorCount = n => {
  const c = {}; factorize(n).forEach(p => { c[p] = (c[p] || 0) + 1; });
  return Object.values(c).reduce((x, e) => x * (e + 1), 1);
};
const ROUNDS = [
  {
    id: 'quarry', name: 'Quarry', emoji: '⛰️', blurb: 'Numbers 12 to 60. Crack them into primes.',
    mode: 'hammer', hammers: [2, 3, 5, 7], shields: 5, exp: false, regular: 6,
    pool: range(12, 60, n => !isPrime(n) && maxFactor(n) <= 7),
    primes: [23, 29, 31, 37, 41, 43, 47, 53, 59], tricky: [51, 57], bothTraps: true,
    intro: 'Tap a prime hammer that goes into the boulder. It cracks into two pieces. Keep going until every piece is a gem, because gems are prime.',
    demo: '84<br>→ 2 × 42<br>→ 2 × 2 × 21<br>→ 2 × 2 × 3 × 7',
    tip: 'Some boulders are already prime. Be careful: a wrong call cracks a shield.'
  },
  {
    id: 'deep', name: 'Deep Mine', emoji: '⛏️', blurb: 'Numbers 60 to 200, with exponents.',
    mode: 'hammer', hammers: [2, 3, 5, 7, 11, 13], shields: 5, exp: true, regular: 6,
    pool: range(60, 200, n => hasRepeat(n) && factorize(n).length >= 3 && maxFactor(n) <= 13),
    primes: [101, 103, 107, 109, 113, 127, 131, 137, 139, 149, 151, 157, 163, 167, 173, 179, 181, 191, 193, 197, 199],
    tricky: [91, 119, 133, 143, 161, 187], bothTraps: true,
    intro: 'Same cracking, but now the answer uses exponents. The exponent counts how many of that prime you found. Tap a prime once for each gem.',
    demo: '2 × 2 × 2 × 3 × 3 = 2<sup>3</sup> × 3<sup>2</sup>',
    tip: 'Watch for sneaky ones like 91. It looks prime, but it isn\'t.'
  },
  {
    id: 'fork', name: 'Fork in the Rock', emoji: '🔀', blurb: 'Split any way you like. Same primes every time.',
    mode: 'pair', hammers: [2, 3, 5, 7, 11, 13], shields: 5, exp: true, regular: 5,
    pool: range(36, 200, n => divisorCount(n) >= 8 && maxFactor(n) <= 7),
    primes: [101, 103, 107, 109, 113, 127, 131, 137, 139], tricky: [91, 119, 133, 143], bothTraps: false,
    intro: 'No hammers this time. Pick any factor pair to split a rock, and tap a rock to work on it next. One pair on each list is fake, so multiply to check.',
    demo: '36 → 4 × 9 or 36 → 6 × 6<br>Both end at 2<sup>2</sup> × 3<sup>2</sup>',
    tip: 'Every number has only one set of primes, no matter how you split it.'
  },
  {
    id: 'boss', name: 'Boss Boulders', emoji: '🔥', blurb: 'Huge numbers and a burning fuse.',
    mode: 'hammer', hammers: [2, 3, 5, 7, 11, 13], shields: 4, exp: true, regular: 3, timer: true,
    pool: range(200, 1200, n => factorize(n).length >= 5 && maxFactor(n) <= 13),
    finale: [1260, 1680, 2310, 2520],
    primes: [211, 223, 227, 229, 233, 239, 241, 251, 257, 263], tricky: [221, 247, 253, 287], bothTraps: false,
    intro: 'The boulders are big and the fuse is burning. If it runs out, you lose a shield and the boulder comes back later. Finish early for bonus gems.',
    demo: '2520 = 2<sup>3</sup> × 3<sup>2</sup> × 5 × 7',
    tip: 'Start with the small primes. Each crack makes the number easier.'
  }
];

function buildQueue(r) {
  const sorted = r.pool.slice().sort((a, b) => a - b);
  // One pick from each slice of the sorted pool, so boulders get harder as the round goes on.
  const items = [];
  for (let k = 0; k < r.regular; k++) {
    const a = Math.floor(k * sorted.length / r.regular), b = Math.floor((k + 1) * sorted.length / r.regular);
    items.push({ n: pick(sorted.slice(a, Math.max(b, a + 1))) });
  }
  const traps = r.bothTraps ? [pick(r.primes), pick(r.tricky)] : [pick(Math.random() < .5 ? r.primes : r.tricky)];
  traps.forEach(n => items.splice(1 + Math.floor(Math.random() * items.length), 0, { n }));
  // Numbers missed in an earlier round come back here, before any finale.
  shuffle([...session.pending]).slice(0, 2).forEach(n => {
    if (!items.some(it => it.n === n)) items.splice(1 + Math.floor(Math.random() * items.length), 0, { n, back: true });
  });
  if (r.finale) items.push({ n: pick(r.finale) });
  return items;
}

/* ---------- explanations ---------- */
function whyNot(n, p) {
  if (p > n) return `${p} is bigger than <b>${n}</b>, so it can't go in.`;
  if (p === 2) return `<b>${n}</b> ends in ${n % 10}, so it's odd. 2 can't go in.`;
  if (p === 5) return `<b>${n}</b> doesn't end in 0 or 5, so 5 can't go in.`;
  if (p === 3) return `${digitsOf(n).join(' + ')} = ${digitSum(n)}. That's not a multiple of 3, so 3 can't go in <b>${n}</b>.`;
  return `<b>${n}</b> ÷ ${p} = ${Math.floor(n / p)} remainder ${n % p}, so ${p} can't go in.`;
}
function nudge(n) {
  if (isPrime(n)) return 'Hint: if no prime goes in, it might already be prime.';
  const s = smallest(n);
  if (s === 2) return `Hint: ${n} is even, so 2 goes in.`;
  if (s === 3) return `Hint: the digits add up to ${digitSum(n)}, so try 3.`;
  if (s === 5) return `Hint: ${n} ends in ${n % 10}, so try 5.`;
  return `Hint: try dividing by ${s}.`;
}
function notPrimeWhy(n) {
  const s = smallest(n);
  if (s === 2) return `Not prime. <b>${n}</b> is even, so 2 goes in.`;
  if (s === 3) return `Not prime. The digits of <b>${n}</b> add up to ${digitSum(n)}, so 3 goes in.`;
  if (s === 5) return `Not prime. <b>${n}</b> ends in ${n % 10}, so 5 goes in.`;
  return `Not prime. <b>${n}</b> = ${s} × ${n / s}.`;
}
const ruleTag = p => p === 2 ? 'div2' : p === 3 ? 'div3' : p === 5 ? 'div5' : 'big';
const TROUBLE = {
  div2: ['The rule for 2', 'A number is divisible by 2 if it ends in 0, 2, 4, 6 or 8.'],
  div3: ['The rule for 3', 'Add up the digits. If the sum is a multiple of 3, then 3 goes in.'],
  div5: ['The rule for 5', 'A number is divisible by 5 if it ends in 0 or 5.'],
  big: ['Testing 7, 11 and 13', 'There is no quick rule to rely on here, so try the division.'],
  prime: ['Spotting primes', 'Before calling a number prime, test 2, 3, 5, 7, 11 and 13.'],
  pair: ['Checking factor pairs', 'Multiply the two numbers. They have to make the number exactly.'],
  count: ['Writing the answer', 'Count each prime in the tree. The exponent is how many you counted.'],
  time: ['Beating the fuse', 'Start with the small primes, and use the rules for 2, 3 and 5 to save time.']
};

/* ---------- saved progress ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('prime-cracker-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('prime-cracker-' + k, JSON.stringify(v)); } catch (e) {} }
};
let progress = store.get('progress', { unlocked: 0, rounds: {} });
if (!progress || typeof progress.unlocked !== 'number' || !progress.rounds) progress = { unlocked: 0, rounds: {} };
const session = { pending: new Set() };   // numbers missed and not yet cracked cleanly

/* ---------- sound ---------- */
let muted = store.get('muted', false), actx = null;
function audio() {
  if (muted) return null;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, dur, type, vol, delay) {
  const c = audio(); if (!c) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol || .14, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  crack() { tone(120, .13, 'square', .13); tone(70, .2, 'sine', .22); },
  gem(i) { tone(660 * Math.pow(1.122, i || 0), .22, 'triangle', .14); },
  miss() { tone(150, .24, 'sawtooth', .1); tone(96, .3, 'sawtooth', .1, .06); },
  tap() { tone(520, .05, 'triangle', .07); },

/* ---------- boulder flow ---------- */
function clearBoulder() {

function crackPrompt(item) {

    <button class="wide go big" data-begin="1">Start cracking ▸</button>
    <button class="wide" data-title="1" style="flex:none">All rounds</button>
  </div>`, r.id);
}
function endRound(cleared) {
  const g = G;
  if (!g) return;
  const r = g.r;
  let stars = 0, newBest = false;
  if (cleared) {
    stars = g.misses <= 1 ? 3 : g.misses <= 4 ? 2 : 1;
    const rec = progress.rounds[r.id] || { best: 0, stars: 0 };
    newBest = g.gems > rec.best;
    progress.rounds[r.id] = { best: Math.max(rec.best, g.gems), stars: Math.max(rec.stars, stars) };
    progress.unlocked = Math.max(progress.unlocked, Math.min(g.i + 1, ROUNDS.length - 1));
    store.set('progress', progress);
    sfx.win();
  } else sfx.lose();

  const hard = [...g.trouble.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
  const hardHTML = hard.length ? `<div class="panel"><h3>Numbers to review</h3>${hard.map(([n, c]) =>
    `<div class="row"><span>${plainFormula(n)}</span><span>${c} ${c === 1 ? 'miss' : 'misses'}</span></div>`).join('')}</div>` : '';
  const worst = Object.entries(g.tags).sort((a, b) => b[1] - a[1])[0];
  const tipHTML = worst ? `<div class="panel"><h3>Practice this: ${TROUBLE[worst[0]][0]}</h3><p>${TROUBLE[worst[0]][1]}</p></div>` : '';
  const hasNext = cleared && g.i + 1 < ROUNDS.length;
  const champ = cleared && !hasNext;
  const head = champ ? ['🏆', 'Master Cracker!', 'You cracked the biggest boulders in the mine.']
    : cleared ? ['💎', `${r.name} cleared!`, g.misses ? 'Nice work. Check the list below before you move on.' : 'Not one miss. That\'s a perfect round!']
    : ['💥', 'Cave-in!', 'Your shields ran out, but every miss taught you something. Look these over and try again.'];
  showScreen(`<div class="card">
    <div class="big-emoji">${head[0]}</div>
    <h2>${head[1]}</h2>
    ${cleared ? `<div class="stars" aria-label="${stars} of 3 stars">${starsHTML(stars)}</div>` : ''}
    <div class="score">💎 ${g.gems}${newBest ? '<small>New best!</small>' : ''}</div>
    <p>${head[2]}</p>
    ${hardHTML}${tipHTML}
    ${hasNext ? `<button class="wide go big" data-round="${g.i + 1}">Next round ▸</button>` : ''}
    <button class="wide ${hasNext ? '' : 'go big'}" data-round="${g.i}" style="flex:none">${cleared ? 'Play this round again' : 'Try again'}</button>
    <button class="wide" data-title="1" style="flex:none">All rounds</button>
  </div>`);
  stopRound();
}

/* ---------- input ---------- */
tray.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.hammer) chooseHammer(+d.hammer);
  else if (d.pair !== undefined) choosePair(+d.pair);
  else if (d.prime) choosePrime();
  else if (d.build) tapBuild(+d.build);
  else if (d.undo) undoBuild();
  else if (d.check) checkBuild();
  else if (d.next && B && !B.lock) nextBoulder();
});
nodesEl.addEventListener('click', e => {
  const b = e.target.closest('.node');
  if (b) tapNode(+b.dataset.id);
});
screenEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  audio();
  if (d.round !== undefined) startRound(+d.round);
  else if (d.begin) { hideScreen(); nextBoulder(); }
  else if (d.title) showTitle();
});
$('quit').addEventListener('click', showTitle);
function renderMute() { $('mute').textContent = muted ? '🔇' : '🔊'; }
$('mute').addEventListener('click', () => { muted = !muted; store.set('muted', muted); renderMute(); if (!muted) sfx.tap(); });
window.addEventListener('resize', layout);

/* The fuse only burns while the boulder is on screen and the tab is visible. */
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastTick) / 1000;
  lastTick = now;
  if (!G || !B || !G.r.timer || document.hidden || screenEl.classList.contains('on')) return;
  if ((B.phase !== 'crack' && B.phase !== 'build') || B.lock) return;
  B.left -= dt;
  if (B.left <= 0) { B.left = 0; timeOut(); }
  renderFuse();
}, 100);

renderMute();
showTitle();
</script>
</body>
</html>
