<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mathlings</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=VT323&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { height:100%; }
  body {
    height:100dvh; width:100%; overflow:hidden; position:fixed; inset:0;
    font-family:'VT323',monospace;
    background:#0a0e16;
    color:#d8f0ff;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(64,120,200,.12), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(200,80,160,.10), transparent 40%);
  }
  #wrap {
    width:min(100%,500px); max-width:500px;
    display:flex; flex-direction:column; position:absolute;
    top:0; bottom:0; left:50%; transform:translateX(-50%);
    max-height:900px;
    border-left:2px solid #1d2942; border-right:2px solid #1d2942;
    background:#0c1220;
    box-shadow:0 0 60px rgba(0,0,0,.6);
  }

  /* HUD — overlays the top of the battlefield so it doesn't consume a row */
  #hud {
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 12px;
    background:linear-gradient(180deg, rgba(14,23,48,.92), rgba(14,23,48,0));
    font-size:20px; letter-spacing:1px; pointer-events:none;
  }
  #hud .stat { display:flex; align-items:center; gap:5px; }
  #hud .lbl { color:#6f8cc4; font-size:15px; }
  .bar-wrap { width:120px; height:14px; background:#1a2238; border:1px solid #32507f; border-radius:7px; overflow:hidden; }
  #hpbar { height:100%; background:linear-gradient(90deg,#ff5d6c,#ffaf5d); transition:width .25s; }

  /* Battlefield */
  #field {
    flex:1 1 auto; min-height:120px; position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(80,120,200,.05) 38px 39px),
      linear-gradient(180deg,#0a1124,#0d1830);
  }
  .enemy {
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    transition:opacity .25s; will-change:top,left;
  }
  .enemy .emo { font-size:34px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .enemy .ehp { width:34px; height:5px; margin-top:2px; background:#3a1822; border-radius:3px; overflow:hidden; }
  .enemy .ehp i { display:block; height:100%; background:#5dff8f; }
  .enemy.shielded .emo { filter:drop-shadow(0 0 6px #5db8ff) drop-shadow(0 0 6px #5db8ff); }
  .enemy.jugg .emo { font-size:48px; }
  .hitflash { animation:flash .12s; }
  @keyframes flash { 0%{filter:brightness(3)} 100%{filter:none} }
  .enemy.boss .emo { font-size:72px; filter:drop-shadow(0 0 12px rgba(255,80,120,.7)); animation:bosspulse 1.2s infinite ease-in-out; }
  .enemy.boss .bossimg {
    height:90px; width:auto; display:block;
    filter:drop-shadow(0 0 12px rgba(255,80,120,.7));
    animation:bosspulse 1.2s infinite ease-in-out;
  }
  .enemy.boss .ehp { width:80px; height:8px; background:#3a1822; border:1px solid #ff5d6c; }
  .enemy.boss .ehp i { background:linear-gradient(90deg,#ff3c6e,#ff9d3c); }
  @keyframes bosspulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  #bossBanner {
    position:absolute; top:30%; left:50%; transform:translate(-50%,-50%);
    font-family:'Bungee'; font-size:34px; color:#ff5d6c; text-shadow:0 0 20px rgba(255,93,108,.6);
    pointer-events:none; z-index:15; animation:bossWarn 1.8s forwards; opacity:0;
  }
  @keyframes bossWarn { 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)} 20%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-80%) scale(1)} }
  .pop { position:absolute; transform:translate(-50%,-50%); font-size:18px; color:#ffe45d; pointer-events:none; animation:pop .6s forwards; }
  @keyframes pop { to { transform:translate(-50%,-150%); opacity:0; } }

  /* base zone */
  #base {
    height:46px; background:#10203f; border-top:3px solid #2f63b8;
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-size:22px; color:#7fd3ff; position:relative;
  }
  #base.hurt { animation:shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* problem + answers */
  #panel { background:#0e1730; border-top:2px solid #20305a; padding:10px 12px 16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  #problem { text-align:center; font-family:'Bungee'; font-size:40px; color:#ffe45d; margin-bottom:10px; letter-spacing:2px; text-shadow:0 0 14px rgba(255,228,93,.35); }
  #answers { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .ans {
    font-family:'Bungee'; font-size:26px; padding:14px 0; border:none; border-radius:12px;
    background:linear-gradient(180deg,#2a59b5,#1c3c80); color:#fff; cursor:pointer;
    box-shadow:0 4px 0 #11254f; transition:transform .05s;
  }
  .ans:active { transform:translateY(3px); box-shadow:0 1px 0 #11254f; }
  .ans.good { background:linear-gradient(180deg,#33c46e,#1f8f4d); }
  .ans.bad { background:linear-gradient(180deg,#d23c4e,#962333); }

  /* upgrade overlay */
  .overlay {
    position:absolute; inset:0; background:rgba(6,10,20,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px; z-index:20; text-align:center;
  }
  .overlay h2 { font-family:'Bungee'; font-size:26px; color:#ffe45d; }
  .overlay p { font-size:19px; color:#9db6e0; }
  .card {
    width:100%; max-width:360px; background:#13203e; border:2px solid #2f63b8;
    border-radius:14px; padding:14px 16px; cursor:pointer; text-align:left;
    display:flex; gap:12px; align-items:center; transition:transform .08s,border-color .08s;
  }
  .card:active { transform:scale(.97); }
  .card:hover { border-color:#5d9dff; }
  .card .ic { font-size:32px; }
  .card .t { font-family:'Bungee'; font-size:17px; color:#fff; }
  .card .d { font-size:17px; color:#9db6e0; line-height:1.1; }
  .btn {
    font-family:'Bungee'; font-size:20px; padding:14px 34px; border:none; border-radius:12px;
    background:linear-gradient(180deg,#ffce4a,#f29d2e); color:#3a2400; cursor:pointer;
    box-shadow:0 4px 0 #b56f12;
  }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #b56f12; }
  .muted { font-size:16px; color:#5f78a8; }
  .turret-tag { position:absolute; top:4px; font-size:13px; color:#6f8cc4; }
  #hpstrip {
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    display:flex; align-items:center; gap:10px;
    padding:6px 14px;
    background:linear-gradient(0deg, rgba(13,21,38,.95), rgba(13,21,38,0));
    pointer-events:none;
  }
  #hpstrip .lbl { color:#ff8d97; font-size:16px; letter-spacing:1px; white-space:nowrap; }
  #hpstrip .bar-wrap { flex:1; height:18px; }
  #hptext { font-size:18px; color:#ffb3ba; min-width:34px; text-align:right; }
  #timerbar { height:8px; background:#1a2238; border-radius:5px; overflow:hidden; margin-bottom:10px; }
  #timerbar.hidden { visibility:hidden; }
  #timerfill { height:100%; width:100%; background:linear-gradient(90deg,#5dff8f,#ffe45d); transition:width .1s linear, background .3s; }
  #timerfill.warn { background:linear-gradient(90deg,#ffaf5d,#ff5d6c); }
  .opgrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:340px; }
  .optoggle {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:14px 0; border:2px solid #2f4470; border-radius:14px;
    background:#11203e; color:#7d96c4; cursor:pointer; transition:all .1s;
    font-family:'VT323',monospace;
  }
  .optoggle .opsym { font-family:'Bungee'; font-size:30px; line-height:1; }
  .optoggle .opname { font-size:17px; letter-spacing:1px; }
  .optoggle.on {
    border-color:#5dff8f; background:linear-gradient(180deg,#1c4d33,#15392a);
    color:#9bffc4; box-shadow:0 0 14px rgba(93,255,143,.3);
  }
  .optoggle:active { transform:scale(.96); }
  .diffgrid { display:flex; flex-direction:column; gap:8px; width:100%; max-width:340px; }
  .difftoggle {
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    padding:10px 14px; border:2px solid #3a4470; border-radius:12px;
    background:#161f3a; color:#9db6e0; cursor:pointer; transition:all .1s;
    font-family:'VT323',monospace; text-align:left;
  }
  .difftoggle .diffname { font-family:'Bungee'; font-size:16px; color:#cfe0ff; }
  .difftoggle .diffsub { font-size:15px; color:#7d96c4; line-height:1.1; }
  .difftoggle.on {
    border-color:#ffce4a; background:linear-gradient(180deg,#403018,#322611);
    color:#ffe9b0; box-shadow:0 0 14px rgba(255,206,74,.3);
  }
  .difftoggle.on .diffname { color:#ffe45d; }
  .difftoggle:active { transform:scale(.98); }

  /* ---- Effects, streaks, reveals, intros, report ---- */
  body.in-arcade #hud { padding-left:96px; }        /* room for the arcade's Menu button */
  #fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
  #field.shake { animation:shake .3s; }
  #streak { color:#ffb13c; font-family:'Bungee'; font-size:17px; visibility:hidden; }
  #streak.on { visibility:visible; }
  .ans:disabled { cursor:default; }
  .ans.reveal { background:linear-gradient(180deg,#33c46e,#1f8f4d); box-shadow:0 0 0 3px #b8ffcf, 0 4px 0 #11254f; }
  #problem.shown { color:#9bffc4; text-shadow:0 0 14px rgba(93,255,143,.45); }
  .streakBanner {
    position:absolute; top:40%; left:50%; z-index:15; pointer-events:none; white-space:nowrap;
    font-family:'Bungee'; font-size:28px; color:#ffb13c; text-shadow:0 0 18px rgba(255,177,60,.7), 0 2px 0 #000;
    animation:bossWarn 1.3s forwards; opacity:0;
  }
  .intro-emo { font-size:72px; line-height:1; filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
  .facts { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:340px; }
  .facts span { font-family:'Bungee'; font-size:15px; background:#13203e; border:1px solid #2f63b8; border-radius:8px; padding:5px 9px; color:#ffe45d; }

  /* ---- Compact layout for short screens (iPhone X and similar) ---- */
  @media (max-height: 740px) {
    #hud { padding:3px 12px; font-size:16px; }
    #base { height:28px; font-size:16px; }
    #hpstrip { padding:3px 12px; gap:8px; }
    #hpstrip .lbl { font-size:14px; }
    #hpstrip .bar-wrap { height:12px; }
    #hptext { font-size:15px; }
    #panel { padding:5px 12px 6px; padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
    #problem { font-size:27px; margin-bottom:5px; }
    #timerbar { height:6px; margin-bottom:5px; }
    .ans { font-size:21px; padding:8px 0; border-radius:10px; }
    #answers { gap:7px; }
    /* start-screen overlay: shrink everything so all cards fit without scrolling */
    .overlay { gap:8px; padding:12px; justify-content:flex-start; overflow-y:auto; }
    .overlay h2 { font-size:22px; }
    .overlay p { font-size:16px; }
    .overlay .muted { font-size:14px; margin:2px 0; }
    .optoggle { padding:9px 0; }
    .optoggle .opsym { font-size:24px; }
    .optoggle .opname { font-size:15px; }
    .opgrid { gap:8px; }
    .difftoggle { padding:7px 12px; }
    .difftoggle .diffname { font-size:15px; }
    .difftoggle .diffsub { font-size:13px; }
    .diffgrid { gap:6px; }
    .btn { font-size:18px; padding:11px 30px; }
    .card { padding:10px 14px; }
    .card .ic { font-size:26px; }
    .card .t { font-size:15px; }
    .card .d { font-size:15px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="field">
    <div id="hud">
      <div class="stat"><span class="lbl">WAVE</span><span id="wave">1</span></div>
      <div class="stat" id="streak">🔥 0</div>
      <div class="stat"><span class="lbl">SOLVED</span><span id="solved">0</span></div>
    </div>
    <canvas id="fx"></canvas>
    <div class="turret-tag" id="dpsTag"></div>
    <div id="hpstrip">
      <span class="lbl">BASE HP</span>
      <div class="bar-wrap"><div id="hpbar" style="width:100%"></div></div>
      <span id="hptext">100</span>
    </div>
  </div>
  <div id="base">🛡️ BASE</div>

  <div id="panel">
    <div id="timerbar"><div id="timerfill"></div></div>
    <div id="problem">2 + 3</div>
    <div id="answers"></div>
  </div>

  <!-- overlays injected by JS -->
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const field = $('#field'), problemEl = $('#problem'), answersEl = $('#answers'),
        waveEl = $('#wave'), solvedEl = $('#solved'), hpbar = $('#hpbar'),
        baseEl = $('#base'), dpsTag = $('#dpsTag'), wrap = $('#wrap'), streakEl = $('#streak');
  if (window.self !== window.top) document.body.classList.add('in-arcade');
  const overlayOpen = () => !!wrap.querySelector('.overlay');
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  // ---- game state ----
  const G = {
    maxHP: 100, hp: 100, wave: 1, solved: 0,
    enemies: [], running: false, lastT: 0,
    autoDPS: 0,            // damage per second auto-fired at front enemy
    clickDamage: 12,       // one correct answer one-shots a normal enemy early on
    regen: 0,              // hp per second
    splash: 0,             // % of click damage to all enemies
    spawnQueue: 0, spawnTimer: 0,
    waveActive: false,
    difficulty: 1,
    defeats: 0, defeatsSinceUpgrade: 0,
    ops: ['+'],
    diff: null,            // active difficulty config, set at start
    timeLeft: 0,           // per-problem countdown (when enabled)
    cur: null,             // current problem {a, b, op, ans, q}
    locked: false,         // ignore taps while an answer is resolving
    problemStart: 0,
    streak: 0, bestStreak: 0,
    attempts: 0, correct: 0,
    sessionMisses: {},     // q -> {ans, n} for the end-of-game report
  };
  const DEFEATS_PER_UPGRADE = 12;

  // Difficulty tiers. Each multiplies the base values so all balance lives here.
  // speedMul/countAdd/bossHpMul scale enemies; numMax raises the math range;
  // answerSeconds sets the per-problem timer (0 = no timer).
  const DIFFICULTIES = {
    easy: {
      label: 'Easy', sub: 'Take your time. No timer.',
      speedMul: 0.8, countAdd: 0, bossHpMul: 0.85,
      numMax: 9, answerSeconds: 0, rampEvery: 99,
    },
    normal: {
      label: 'Normal', sub: 'A steady challenge. 10s per problem.',
      speedMul: 1.0, countAdd: 2, bossHpMul: 1.0,
      numMax: 12, answerSeconds: 10, rampEvery: 5,
    },
    hard: {
      label: 'Hard', sub: 'Fast, tougher math, 6s per problem.',
      speedMul: 1.35, countAdd: 4, bossHpMul: 1.25,
      numMax: 20, answerSeconds: 6, rampEvery: 3,
    },
  };
  let nextId = 1, autoAccum = 0, regenAccum = 0, curAnswer = 0;

  // Every enemy type has a special ability. All are available from wave 1 and
  // picked at random each spawn. {emo, ability, name} — ability drives behavior.
  const ENEMY_TYPES = [
    { emo:'👾', ability:'shield',  name:'Alien' },      // needs an extra hit to break its shield
    { emo:'👹', ability:'brute',   name:'Ogre' },       // +50% HP
    { emo:'🐛', ability:'morph',   name:'Caterpillar' },// becomes a butterfly (x2 HP) after 3s
    { emo:'🦠', ability:'split',   name:'Germ' },       // splits into two when defeated
    { emo:'🤖', ability:'armor',   name:'Robot' },      // takes half damage
    { emo:'👻', ability:'phase',   name:'Ghost' },      // periodically untargetable
    { emo:'😈', ability:'devil',   name:'Devil' },      // double damage to the base

    { emo:'🦂', ability:'fast',    name:'Scorpion' },   // moves much faster

  // ---- sound ----
  let AC = null;
  function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
  function tone(f, d, type = 'square', vol = .05, slide = 0, delay = 0){
    const a = ac(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
  }
  function noise(d, vol, freq){
    const a = ac(); if (!a) return;
    const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), x = buf.getChannelData(0);
    for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }

    fanfare(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .14, 'square', .045, 0, i * .09)); },
    chime(){ [784, 988, 1319].forEach((f, i) => tone(f, .14, 'triangle', .06, 0, i * .07)); },
    streak(){ [659, 880, 1175, 1568].forEach((f, i) => tone(f, .1, 'square', .045, 0, i * .05)); },
  };
  addEventListener('pointerdown', function unlock(){ ac(); removeEventListener('pointerdown', unlock); });

  // ---- effects canvas: turret, laser beams, particles, shockwaves ----
  const fxCanvas = $('#fx'), fctx = fxCanvas.getContext('2d');
  let FW = 0, FH = 0;
  function sizeFx(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    FW = field.clientWidth; FH = field.clientHeight;
    fxCanvas.width = FW * dpr; fxCanvas.height = FH * dpr; fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', sizeFx);
  const beams = [], parts = [], rings = [];
  let turretAngle = -Math.PI / 2, recoil = 0, baseFlash = 0;
  const turretPos = () => ({ x: FW / 2, y: FH - 42 });
  function burst(x, y, colors, n, speed){
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, v = speed * (.4 + Math.random() * .8);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .45 + Math.random() * .4, t: 0, c: colors[i % colors.length], s: 3 + Math.random() * 4 });
    }
  }
  function fireBeam(target, big){
    const t = turretPos();
    beams.push({ x1: t.x, y1: t.y - 14, x2: target.x, y2: target.y, t: 0, big });
    turretAngle = Math.atan2(target.y - t.y, target.x - t.x); recoil = 1;
    burst(target.x, target.y, big ? ['#ffffff', '#ffe45d', '#5dd8ff'] : ['#5dd8ff', '#ffffff'], big ? 10 : 4, big ? 130 : 70);
  }
  function popEffect(x, y, isBoss){
    burst(x, y, ['#ff5d6c', '#ffe45d', '#5dff8f', '#5db8ff', '#ffffff', '#c58cff'], isBoss ? 70 : 22, isBoss ? 280 : 170);
    rings.push({ x, y, t: 0, r: isBoss ? 140 : 46 });
  }
  function drawFx(dt){
    fctx.clearRect(0, 0, FW, FH);
    if (baseFlash > 0){ fctx.fillStyle = `rgba(255,60,80,${baseFlash * .3})`; fctx.fillRect(0, 0, FW, FH); baseFlash = Math.max(0, baseFlash - dt * 3); }
    fctx.lineCap = 'round';
    for (let i = beams.length - 1; i >= 0; i--){
      const b = beams[i]; b.t += dt; const dur = b.big ? .18 : .12;
      if (b.t > dur){ beams.splice(i, 1); continue; }
      const a = 1 - b.t / dur;
      fctx.strokeStyle = `rgba(93,216,255,${a * .55})`; fctx.lineWidth = b.big ? 11 : 5;
      fctx.beginPath(); fctx.moveTo(b.x1, b.y1); fctx.lineTo(b.x2, b.y2); fctx.stroke();
      fctx.strokeStyle = `rgba(255,255,255,${a})`; fctx.lineWidth = b.big ? 3.5 : 1.5;
      fctx.beginPath(); fctx.moveTo(b.x1, b.y1); fctx.lineTo(b.x2, b.y2); fctx.stroke();
    }
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i]; p.t += dt;
      if (p.t > p.life){ parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; p.vx *= .98;
      fctx.globalAlpha = 1 - p.t / p.life; fctx.fillStyle = p.c; fctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    fctx.globalAlpha = 1;
    for (let i = rings.length - 1; i >= 0; i--){
      const r = rings[i]; r.t += dt;
      if (r.t > .4){ rings.splice(i, 1); continue; }
      const k = r.t / .4;
      fctx.strokeStyle = `rgba(255,255,255,${1 - k})`; fctx.lineWidth = 3;
      fctx.beginPath(); fctx.arc(r.x, r.y, r.r * (.3 + k), 0, Math.PI * 2); fctx.stroke();
    }
    // Turret on the base: dome plus a barrel that swings to aim at each target.
    const t = turretPos();
    recoil = Math.max(0, recoil - dt * 6);
    fctx.save(); fctx.translate(t.x, t.y); fctx.rotate(turretAngle + Math.PI / 2);
    fctx.fillStyle = '#9db6e0'; fctx.fillRect(-4, -30 + recoil * 6, 8, 24);
    fctx.fillStyle = '#5dd8ff'; fctx.fillRect(-4, -32 + recoil * 6, 8, 4);
    fctx.restore();
    const dome = fctx.createRadialGradient(t.x - 5, t.y - 6, 2, t.x, t.y, 18);
    dome.addColorStop(0, '#cfe3ff'); dome.addColorStop(1, '#2f63b8');
    fctx.fillStyle = dome; fctx.beginPath(); fctx.arc(t.x, t.y, 16, Math.PI, 0); fctx.fill();
    fctx.fillStyle = '#1c3c80'; fctx.fillRect(t.x - 22, t.y, 44, 6);
  }

  // ---- tricky facts: misses are remembered and come back more often ----
  const facts = lsGet('mathlings_facts') || {};
  function recordMiss(p){
    const f = facts[p.q] || (facts[p.q] = { a: p.a, b: p.b, op: p.op, miss: 0 });
    f.miss = Math.min(5, f.miss + 1); lsSet('mathlings_facts', facts);
    const s = G.sessionMisses[p.q] || (G.sessionMisses[p.q] = { ans: p.ans, n: 0 }); s.n++;
  }
  function recordHit(p){
    const f = facts[p.q]; if (!f) return;
    if (--f.miss <= 0) delete facts[p.q];
    lsSet('mathlings_facts', facts);
  }

  // Wrong choices are common slips (times-table neighbours, adding instead of
  // multiplying, off-by-one) so the fact has to be known, not roughly guessed.
  function makeOptions(a, b, op, ans){
    let cands;
    if (op === '+') cands = [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, a - b];
    else if (op === '-') cands = [ans + 1, ans - 1, ans + 2, ans - 2, a + b, ans + 10];
    else if (op === '×') cands = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, ans + 10, ans - 10, ans + 1, ans - 1];
    else cands = [ans + 1, ans - 1, ans + 2, ans - 2, b, a - b];
    const opts = new Set([ans]);
    for (const c of shuffleArr(cands.filter(c => c >= 0 && c !== ans))) { if (opts.size >= 4) break; opts.add(c); }
    let guard = 0;
    while (opts.size < 4 && guard++ < 50){ const d = ans + rnd(1, 5) * (Math.random() < .5 ? -1 : 1); if (d >= 0) opts.add(d); }
    while (opts.size < 4) opts.add(ans + opts.size);
    return shuffleArr([...opts]);
  }
  const shuffleArr = arr => { for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // ---- problem generation: fluency-focused, scales with difficulty ----
  function genProblem() {
    let a, b, op, ans;
    const m = G.diff ? G.diff.numMax : 9;        // top of the number range for this difficulty
    // About a third of the time, bring back a fact he has missed before.
    const tricky = Object.values(facts).filter(f => G.ops.includes(f.op) && `${f.a} ${f.op} ${f.b}` !== (G.cur && G.cur.q));
    if (tricky.length && Math.random() < .33) {
      const f = tricky[Math.floor(Math.random() * tricky.length)];
      a = f.a; b = f.b; op = f.op;
      ans = op === '+' ? a + b : op === '-' ? a - b : op === '×' ? a * b : a / b;
    } else {
      op = G.ops[Math.floor(Math.random()*G.ops.length)];
      if (op === '+') {                            // sums of two single/low numbers
        a = rnd(1,m); b = rnd(1,m); ans = a + b;
      } else if (op === '-') {                     // no negatives
        a = rnd(1,m); b = rnd(0,a); ans = a - b;
      } else if (op === '×') {                     // times tables; cap factor so it stays mental-math
        const f = Math.min(12, Math.max(5, Math.round(m/1.5)));
        a = rnd(1,f); b = rnd(1,f); ans = a * b;
      } else {                                     // ÷ : clean whole-number answers
        const f = Math.min(12, Math.max(5, Math.round(m/1.5)));
        b = rnd(1,f); ans = rnd(1,f); a = b * ans;
      }
    }
    const q = `${a} ${op} ${b}`;
    G.cur = { a, b, op, ans, q };
    curAnswer = ans;
    G.locked = false; G.problemStart = performance.now();
    problemEl.textContent = q; problemEl.classList.remove('shown');
    answersEl.innerHTML = '';
    makeOptions(a, b, op, ans).forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'ans'; btn.textContent = v;
      btn.onclick = () => answer(v, btn);
      answersEl.appendChild(btn);
    });
    // (re)start the per-problem timer if this difficulty uses one
    G.timeLeft = G.diff && G.diff.answerSeconds > 0 ? G.diff.answerSeconds : 0;
    updateTimerBar();
  }
  const rnd = (lo,hi) => Math.floor(Math.random()*(hi-lo+1))+lo;

  function answer(val, btn) {
    if (G.locked) return;                // ignore double taps while this answer resolves
    G.locked = true;
    answersEl.querySelectorAll('.ans').forEach(b => b.disabled = true);
    G.attempts++;
    if (val === curAnswer) {
      btn.classList.add('good');
      G.solved++; G.correct++; solvedEl.textContent = G.solved;
      recordHit(G.cur);
      // Streaks and quick answers hit harder.
      const quick = performance.now() - G.problemStart < 3000;
      G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
      const mult = (1 + .1 * Math.min(G.streak - 1, 10)) * (quick ? 1.25 : 1);
      sfx.zap(G.streak);
      dealClickDamage(mult, quick);
      if ([3, 5, 10, 15, 20, 30].includes(G.streak)){ streakBanner(`🔥 ${G.streak} IN A ROW!`); sfx.streak(); }
      updateStreak();
      setTimeout(genProblem, 180);
    } else {
      btn.classList.add('bad');
      missed('');
    }
  }
  // Wrong answer or timeout: show the right answer, reset the streak, enemies surge.
  function missed(note){
    sfx.wrong();
    recordMiss(G.cur);
    G.streak = 0; updateStreak();
    answersEl.querySelectorAll('.ans').forEach(b => { b.disabled = true; if (+b.textContent === curAnswer) b.classList.add('reveal'); });
    problemEl.textContent = `${G.cur.q} = ${G.cur.ans}`; problemEl.classList.add('shown');
    G.enemies.forEach(e => e.y += 14);
    if (note) floatText(field.clientWidth / 2, 60, note);
    setTimeout(genProblem, 1100);
  }
  function updateStreak(){
    streakEl.textContent = `🔥 ${G.streak}`;
    streakEl.classList.toggle('on', G.streak >= 2);
  }
  function streakBanner(text){
    const b = document.createElement('div'); b.className = 'streakBanner'; b.textContent = text;
    field.appendChild(b); setTimeout(() => b.remove(), 1300);
  }

  function dealClickDamage(mult = 1, quick = false) {
    // Effective damage scales gently with the wave so a single correct answer
    // keeps one-shotting a normal enemy (HP = 8 + wave*2). Upgrades, streaks and speed add on top.
    const dmg = Math.round((G.clickDamage + G.wave*2) * mult);
    // sort by progress toward base; phased ghosts can't be targeted right now
    const sorted = [...G.enemies].sort((a,b)=>b.y-a.y);
    const target = sorted.find(e => !e.phased);
    if (target) {
      fireBeam(target, true);
      floatText(target.x, target.y, (quick ? '⚡' : '') + '-' + dmg);
      damage(target, dmg);
    } else if (sorted[0]) {
      // everything in front is phased: show a miss cue on the front ghost
      fireBeam(sorted[0], true);
      floatText(sorted[0].x, sorted[0].y, 'phased!');
    }
    if (G.splash > 0) {
      const t = turretPos(); rings.push({ x: t.x, y: t.y, t: 0, r: Math.max(FW, FH) });
      sorted.forEach(e => { if (e !== target && !e.phased) damage(e, dmg * G.splash); });
    }
  }

  function damage(e, amt) {
    if (e.dead) return;
    // robot armor halves incoming damage
    if (e.dmgTakenMul) amt *= e.dmgTakenMul;
    // alien shield absorbs one full hit
    if (e.shield) {
      e.shield = 0;
      e.el?.classList.remove('shielded');
      e.el?.classList.add('hitflash');
      setTimeout(()=>e.el?.classList.remove('hitflash'),120);
      floatText(e.x, e.y, 'shield!');
      return;
    }
    e.hp -= amt;
    if (e.el) { e.el.classList.add('hitflash'); setTimeout(()=>e.el?.classList.remove('hitflash'),120); }
    if (e.hp <= 0) defeatEnemy(e);
    else updateEnemyEl(e);
  }

  function defeatEnemy(e) {
    if (e.metaTimer) { clearTimeout(e.metaTimer); e.metaTimer = null; }
    e.el?.remove(); e.dead = true;
    G.enemies = G.enemies.filter(x=>x!==e);
    if (e.defeatedByPlayer !== false) {
      popEffect(e.x, e.y, e.isBoss);
      e.isBoss ? sfx.bossPop() : sfx.pop();
      G.defeats++; G.defeatsSinceUpgrade++;
      // germ splits into two smaller germs when defeated by the player
      if (e.ability === 'split' && !e.isSplitChild) {
        splitGerm(e);
      }
      // skull's curse: defeating it briefly hastens every other enemy
      if (e.ability === 'curse') {
        G.enemies.forEach(o => { o.speed *= 1.5; });
        floatText(e.x, e.y, '💀 haste!');
        setTimeout(() => { G.enemies.forEach(o => { if (!o.dead) o.speed /= 1.5; }); }, 2500);
      }
    }
    if (G.defeatsSinceUpgrade >= DEFEATS_PER_UPGRADE && G.hp > 0) {
      G.defeatsSinceUpgrade -= DEFEATS_PER_UPGRADE;
      showUpgrade();
      return;
    }
    if (G.waveActive && G.enemies.length === 0 && G.spawnQueue === 0) endWave();
  }

  // Germ death spawns two smaller, weaker germs that cannot split again.
  function splitGerm(parent) {
    const childHP = Math.max(4, Math.round(parent.maxHp * 0.5));
    const w = field.clientWidth;
    for (let i = 0; i < 2; i++) {
      const offset = i === 0 ? -22 : 22;
      makeEnemy({
        x: Math.max(30, Math.min(w - 30, parent.x + offset)),
        y: parent.y,
        hp: childHP,
        speed: parent.speed * 1.15,   // children scurry a bit faster
        emo: '🦠',
        ability: 'split',
        isSplitChild: true,
      });
    }
    floatText(parent.x, parent.y, 'split!');
  }

  function floatText(x,y,txt) {
    const p = document.createElement('div');
    p.className='pop'; p.textContent=txt; p.style.left=x+'px'; p.style.top=y+'px';
    field.appendChild(p); setTimeout(()=>p.remove(),600);
  }

  // ---- waves ----
  function startWave() {
    G.waveActive = true;
    waveEl.textContent = G.wave;
    G.isBossWave = (G.wave % 5 === 0);
    const extra = G.diff ? G.diff.countAdd : 0;
    if (G.isBossWave) {
      G.spawnQueue = 4 + Math.floor(G.wave / 2) + extra;   // minions alongside the boss
      G.bossPending = true;          // boss spawns first
      showBossBanner();
    } else {
      G.spawnQueue = 8 + (G.wave - 1) * 2 + extra;   // waves grow every time
      G.bossPending = false;
    }
    G.spawnTimer = 0;
  }

  function showBossBanner() {
    const b = document.createElement('div');
    b.id = 'bossBanner'; b.textContent = '⚠ BOSS ⚠';
    field.appendChild(b); setTimeout(()=>b.remove(), 1800);
    sfx.siren();
  }

  const enemyBaseHP = w => (8 + w*2.6) * Math.pow(1.06, w - 1);
  function spawnEnemy() {
    const w = G.wave;
    if (G.bossPending) { G.bossPending = false; return spawnBoss(); }
    // Early creatures fall to one correct answer; HP then outgrows base damage,
    // so later waves need streaks, quick answers or damage upgrades to one-shot.
    const baseHP = enemyBaseHP(w);
    const sMul = G.diff ? G.diff.speedMul : 1;
    const speed = (22 + w*1.8 + Math.random()*5) * sMul; // base pace, scaled by difficulty
    const type = ENEMY_TYPES[Math.floor(Math.random()*ENEMY_TYPES.length)];
    makeEnemy({
      x: rnd(36, field.clientWidth-36),
      y: -20,
      hp: Math.round(baseHP*(0.9+Math.random()*0.25)),
      speed, emo: type.emo, ability: type.ability,
    });
  }

  // Builds an enemy element + state from options and applies its special ability.
  function makeEnemy(opts) {
    const e = {
      id: nextId++,
      x: opts.x, y: opts.y,
      hp: opts.hp, maxHp: opts.hp,
      speed: opts.speed,
      emo: opts.emo,
      ability: opts.ability || 'none',
      isSplitChild: !!opts.isSplitChild,   // germ children don't split again
    };
    // --- apply spawn-time ability effects ---
    switch (e.ability) {
      case 'devil':  e.baseDamageMul = 2; break;                 // double base damage
      case 'brute':  e.hp = e.maxHp = Math.round(e.maxHp*1.5); break;
      case 'armor':  e.dmgTakenMul = 0.5; break;                 // half damage taken
      case 'shield': e.shield = 1; break;                        // one hit absorbed before HP
      case 'fast':   e.speed *= 1.6; break;
      case 'juggernaut': e.hp = e.maxHp = Math.round(e.maxHp*2.5); e.speed *= 0.55; break;
      case 'regen':  e.regenPerSec = Math.max(1, Math.round(e.maxHp*0.06)); break;
      case 'phase':  e.phaseTimer = 1.5 + Math.random(); e.phased = false; break;
    }
    const el = document.createElement('div');
    el.className = 'enemy' + (e.ability === 'juggernaut' ? ' jugg' : '');
    el.innerHTML = `<div class="emo">${e.emo}</div><div class="ehp"><i></i></div>`;
    if (e.shield) el.classList.add('shielded');
    field.appendChild(el); e.el = el;
    positionEnemy(e); updateEnemyEl(e);
    G.enemies.push(e);
    if (!e.isSplitChild && ABILITY_INFO[e.ability] && !seenTypes.has(e.ability)){
      seenTypes.add(e.ability); lsSet('mathlings_seen', [...seenTypes]);
      introQueue.push(e);
    }
    // caterpillar metamorphoses into a butterfly (double HP) after 3 seconds
    if (e.ability === 'morph') {
      e.metaTimer = setTimeout(() => metamorphose(e), 3000);
    }
    return e;
  }

  // Caterpillar -> butterfly: doubles HP and updates the visual.
  function metamorphose(e) {
    if (e.dead || !G.running) return;
    e.emo = '🦋';
    e.maxHp = e.hp = e.maxHp * 2;
    const emoEl = e.el && e.el.querySelector('.emo');
    if (emoEl) {
      emoEl.textContent = '🦋';
      emoEl.classList.add('hitflash');
      setTimeout(() => emoEl.classList.remove('hitflash'), 120);
    }
    updateEnemyEl(e);
    floatText(e.x, e.y, '🦋 x2 HP');
  }

  function spawnBoss() {
    const w = G.wave;
    const hpMul = G.diff ? G.diff.bossHpMul : 1;
    const sMul = G.diff ? G.diff.speedMul : 1;
    const hp = Math.round(enemyBaseHP(w) * 12 * hpMul);   // ~12x a normal enemy, scaled by difficulty
    const def = BOSSES[Math.floor((w/5 - 1)) % BOSSES.length];
    const e = {
      id: nextId++,
      x: field.clientWidth/2,
      y: -40,
      hp, maxHp: hp,
      speed: (5 + w*0.18) * sMul,                  // advancing menace, scaled by difficulty
      isBoss: true,
    };
    const visual = def.img
      ? `<img class="emo bossimg" src="${def.img}" alt="boss">`
      : `<div class="emo">${def.emo}</div>`;
    const el = document.createElement('div');
    el.className = 'enemy boss';
    el.innerHTML = `${visual}<div class="ehp"><i></i></div>`;
    field.appendChild(el); e.el = el;
    positionEnemy(e); updateEnemyEl(e);
    G.enemies.push(e);
  }

  function positionEnemy(e){ e.el.style.left=e.x+'px'; e.el.style.top=e.y+'px'; }
  function updateEnemyEl(e){ e.el.querySelector('.ehp i').style.width = Math.max(0,e.hp/e.maxHp*100)+'%'; }

  function endWave() {
    G.waveActive = false;
    sfx.fanfare();
    const cleared = G.wave;
    G.wave++;
    // Auto-ramp within the chosen tier: every rampEvery waves, nudge speed up
    // and shave the answer timer slightly (down to a floor), for steady escalation.
    if (G.diff && cleared % G.diff.rampEvery === 0) {
      G.diff.speedMul *= 1.06;
      if (G.diff.answerSeconds > 0) {
        G.diff.answerSeconds = Math.max(3, G.diff.answerSeconds - 0.5);
      }
    }
    if (cleared % 5 === 0) {
      // boss reward: full heal + guaranteed upgrade pick
      G.hp = G.maxHP; updateHP();
      showOverlay(`👑 Boss defeated!`, `Base fully repaired. Choose your spoils.`, true);
    } else {
      showOverlay(`Wave ${cleared} cleared!`, `Next wave incoming. Pick a reward.`, true);
    }
  }

  // ---- main loop ----
  function loop(t) {
    if (!G.running) return;
    const dt = Math.min(0.05, (t - G.lastT)/1000 || 0); G.lastT = t;
    step(dt);
    if (G.running) requestAnimationFrame(loop);
  }
  // One tick of the game. Kept separate from loop() so a test can run it faster than real time.
  function step(dt) {
    // Everything stands still while an overlay (upgrade pick, creature intro) is open.
    if (!overlayOpen() && introQueue.length) showIntro(introQueue.shift());
    if (overlayOpen()) { drawFx(dt); return; }

    // spawn
    if (G.spawnQueue > 0) {
      G.spawnTimer -= dt;
      if (G.spawnTimer <= 0) {
        // From wave 3, creatures sometimes arrive in packs of 2-3.
        const pack = G.wave >= 3 && Math.random() < .25 ? rnd(2, 3) : 1;
        for (let i = 0; i < pack && G.spawnQueue > 0; i++){ spawnEnemy(); G.spawnQueue--; }
        G.spawnTimer = Math.max(1.0, 3.0 - G.wave * 0.16) * (0.7 + Math.random() * 0.6) * pack;
      }
    }

    // per-problem countdown (only when a timer is active)
    if (G.diff && G.diff.answerSeconds > 0 && G.timeLeft > 0 && !G.locked) {
      G.timeLeft -= dt;
      if (G.timeLeft <= 0) { G.timeLeft = 0; updateTimerBar(); timeUp(); }
      else updateTimerBar();
    }

    // auto turret
    if (G.autoDPS > 0 && G.enemies.length) {
      autoAccum += G.autoDPS * dt;
      if (autoAccum >= 1) {
        const front = [...G.enemies].sort((a,b)=>b.y-a.y).find(e => !e.phased);
        if (front) { fireBeam(front, false); sfx.pew(); damage(front, Math.floor(autoAccum)); }
        autoAccum -= Math.floor(autoAccum);
      }
    }

    // regen
    if (G.regen > 0 && G.hp < G.maxHP) {
      regenAccum += G.regen * dt;
      if (regenAccum >= 1) { G.hp = Math.min(G.maxHP, G.hp + Math.floor(regenAccum)); regenAccum -= Math.floor(regenAccum); updateHP(); }
    }

    // move enemies
    const reach = field.clientHeight - 6;
    for (const e of [...G.enemies]) {
      e.y += e.speed * dt;
      positionEnemy(e);
      // ghost: toggle phased (untargetable + see-through) on a timer
      if (e.ability === 'phase') {
        e.phaseTimer -= dt;
        if (e.phaseTimer <= 0) {
          e.phased = !e.phased;
          e.phaseTimer = e.phased ? 1.2 : (1.5 + Math.random());
          if (e.el) e.el.style.opacity = e.phased ? '0.35' : '1';
        }
      }
      // octopus: regenerate HP over time (up to its max) if still alive
      if (e.regenPerSec && e.hp < e.maxHp) {
        e.hp = Math.min(e.maxHp, e.hp + e.regenPerSec * dt);
        updateEnemyEl(e);
      }
      if (e.y >= reach) {
        // hit the base (devil enemies deal double via baseDamageMul)
        let dmg = e.isBoss ? Math.ceil(G.maxHP*0.6) + 20 : Math.ceil(e.maxHp/4) + 4;
        dmg = Math.ceil(dmg * (e.baseDamageMul || 1));
        G.hp -= dmg; updateHP();
        baseEl.classList.add('hurt'); setTimeout(()=>baseEl.classList.remove('hurt'),300);
        field.classList.add('shake'); setTimeout(()=>field.classList.remove('shake'),300);
        baseFlash = 1; sfx.thud();
        e.defeatedByPlayer = false;
        defeatEnemy(e);
        if (G.hp <= 0) { gameOver(); return; }
      }
    }

    updateDpsTag();
    drawFx(dt);
  }

  function updateHP(){
    hpbar.style.width = Math.max(0,G.hp/G.maxHP*100)+'%';
    const t = document.getElementById('hptext');
    if (t) t.textContent = Math.max(0, Math.ceil(G.hp));
  }
  function updateDpsTag(){
    const parts=[];
    if(G.autoDPS) parts.push(`🔫 ${G.autoDPS}/s`);
    if(G.regen) parts.push(`➕ ${G.regen}hp/s`);
    if(G.splash) parts.push(`💥 ${Math.round(G.splash*100)}%`);
    dpsTag.textContent = parts.join('   ');
  }
  function updateTimerBar(){
    const bar = document.getElementById('timerbar');
    const fill = document.getElementById('timerfill');
    if (!bar || !fill) return;
    if (!G.diff || G.diff.answerSeconds <= 0) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    const pct = Math.max(0, G.timeLeft / G.diff.answerSeconds * 100);
    fill.style.width = pct + '%';
    fill.classList.toggle('warn', pct < 35);
  }
  // Called when the per-problem timer runs out: same surge penalty as a wrong answer.
  function timeUp(){
    if (G.locked) return;
    G.locked = true; G.attempts++;
    missed('⏱ Too slow!');
  }

  // ---- upgrades ----
  const UPGRADES = [
    {ic:'🗡️', t:'Sharper Math', d:'+5 damage per correct answer', fn:()=>G.clickDamage+=5},
    {ic:'🔫', t:'Auto-Turret', d:'+2 damage every second, automatically', fn:()=>G.autoDPS+=2},
    {ic:'💉', t:'Repair Drone', d:'Heal +2 HP per second', fn:()=>G.regen+=2},
    {ic:'❤️', t:'Reinforce Base', d:'+25 max HP and heal 25', fn:()=>{G.maxHP+=25;G.hp+=25;updateHP();}},
    {ic:'💥', t:'Splash Rounds', d:'Correct answers hit all enemies for +15%', fn:()=>G.splash+=0.15},
    {ic:'🩹', t:'Field Medic', d:'Instantly heal 40 HP now', fn:()=>{G.hp=Math.min(G.maxHP,G.hp+40);updateHP();}},
    {ic:'⚔️', t:'Double Strike', d:'+8 damage per correct answer', fn:()=>G.clickDamage+=8},
  ];

  function pick3(){
    const pool=[...UPGRADES]; const out=[];
    while(out.length<3 && pool.length){ out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
    return out;
  }

  function showUpgrade() {
    const choices = pick3();
    const ov = makeOverlay();
    ov.innerHTML = `<h2>Upgrade!</h2><p class="muted">Pick one — then keep solving</p>`;
    choices.forEach(u=>{
      const c=document.createElement('div'); c.className='card';
      c.innerHTML=`<div class="ic">${u.ic}</div><div><div class="t">${u.t}</div><div class="d">${u.d}</div></div>`;
      c.onclick=()=>{
        u.fn(); updateDpsTag(); ov.remove(); sfx.chime();
        if (G.waveActive && G.enemies.length === 0 && G.spawnQueue === 0) endWave();
        else genProblem();
      };
      ov.appendChild(c);
    });
    wrap.appendChild(ov);
  }

  function makeOverlay(){ const o=document.createElement('div'); o.className='overlay'; return o; }

  function showOverlay(title, sub, withUpgrade) {
    const ov = makeOverlay();
    ov.innerHTML = `<h2>${title}</h2><p>${sub}</p>`;
    if (withUpgrade) {
      pick3().forEach(u=>{
        const c=document.createElement('div'); c.className='card';
        c.innerHTML=`<div class="ic">${u.ic}</div><div><div class="t">${u.t}</div><div class="d">${u.d}</div></div>`;
        c.onclick=()=>{ u.fn(); updateDpsTag(); ov.remove(); sfx.chime(); startWave(); genProblem(); };
        ov.appendChild(c);
      });
    }
    wrap.appendChild(ov);
  }

  function gameOver() {
    G.running = false;
    const ov = makeOverlay();
    const acc = G.attempts ? Math.round(G.correct / G.attempts * 100) : 0;
    const misses = Object.entries(G.sessionMisses).sort((x, y) => y[1].n - x[1].n).slice(0, 8);
    ov.innerHTML = `<h2>Base Overrun!</h2><p>You reached <b>Wave ${G.wave}</b><br>and solved <b>${G.solved}</b> problems.</p>
      <p>🎯 ${acc}% correct &nbsp;·&nbsp; 🔥 Best streak ${G.bestStreak}</p>` +
      (misses.length
        ? `<p class="muted">Facts to practise (they'll come up more next time):</p><div class="facts">${misses.map(([q, m]) => `<span>${q} = ${m.ans}</span>`).join('')}</div>`
        : '<p>No misses. Amazing!</p>');
    const b=document.createElement('button'); b.className='btn'; b.textContent='PLAY AGAIN';
    b.onclick=()=>location.reload(); ov.appendChild(b);
    wrap.appendChild(ov);
  }

  // ---- start screen ----
  function start() {
    const ov = makeOverlay();
    ov.innerHTML = `<h2>MATHLINGS</h2>
      <p>Creatures march toward your base.<br>
      Solve math to blast the front one.<br>
      Every 10 defeats, pick an upgrade. Survive!</p>
      <p class="muted">Choose which math to practice:</p>`;

    const OPS = [
      {sym:'+', name:'Add'},
      {sym:'-', name:'Subtract'},
      {sym:'×', name:'Multiply'},
      {sym:'÷', name:'Divide'},
    ];
    const selected = new Set(['+']);
    const grid = document.createElement('div'); grid.className = 'opgrid';
    const startBtn = document.createElement('button');
    OPS.forEach(o => {
      const t = document.createElement('button');
      t.className = 'optoggle' + (selected.has(o.sym) ? ' on' : '');
      t.innerHTML = `<span class="opsym">${o.sym}</span><span class="opname">${o.name}</span>`;
      t.onclick = () => {
        if (selected.has(o.sym)) selected.delete(o.sym); else selected.add(o.sym);
        t.classList.toggle('on', selected.has(o.sym));
        startBtn.disabled = selected.size === 0;
        startBtn.style.opacity = selected.size === 0 ? .4 : 1;
      };
      grid.appendChild(t);
    });
    ov.appendChild(grid);

    // difficulty selector
    const diffLabel = document.createElement('p');
    diffLabel.className = 'muted'; diffLabel.textContent = 'Choose a difficulty:';
    diffLabel.style.marginTop = '6px';
    ov.appendChild(diffLabel);

    let chosenDiff = 'normal';
    const dgrid = document.createElement('div'); dgrid.className = 'diffgrid';
    const diffButtons = {};
    ['easy','normal','hard'].forEach(key => {
      const d = DIFFICULTIES[key];
      const b = document.createElement('button');
      b.className = 'difftoggle' + (key === chosenDiff ? ' on' : '');
      b.innerHTML = `<span class="diffname">${d.label}</span><span class="diffsub">${d.sub}</span>`;
      b.onclick = () => {
        chosenDiff = key;
        Object.values(diffButtons).forEach(x => x.classList.remove('on'));
        b.classList.add('on');
      };
      diffButtons[key] = b;
      dgrid.appendChild(b);
    });
    ov.appendChild(dgrid);

    startBtn.className='btn'; startBtn.textContent='START';
    startBtn.onclick=()=>{
      if (selected.size === 0) return;
      G.ops = [...selected];
      // copy the tier so the in-game ramp doesn't mutate the shared config
      G.diff = { ...DIFFICULTIES[chosenDiff] };
      ov.remove(); G.running=true; G.lastT=performance.now();
      sizeFx(); updateHP(); genProblem(); startWave(); requestAnimationFrame(loop);
    };
    ov.appendChild(startBtn); wrap.appendChild(ov);
  }

  start();
  // Hook for automated balance testing (play-speed simulations); unused in normal play.
  window.__mathlings = { G, step, genProblem, answerValue: v => {
    const btn = [...answersEl.querySelectorAll('.ans')].find(b => +b.textContent === v) || answersEl.querySelector('.ans');
    answer(+btn.textContent, btn);
  } };
})();
</script>
</body>
