<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Larry Plopper 🧙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #ffd25e; --parch: #f6e7c1; --parch2: #e4ca8f; --ink: #3a2410;
    --ui: 'Fredoka', ui-rounded, system-ui, sans-serif;
    --fancy: 'Cinzel Decorative', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { background: #120b26; color: #fff; font-family: var(--ui); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  button { font-family: inherit; border: 0; cursor: pointer; color: inherit; background: none; touch-action: manipulation; }
  button:disabled { cursor: default; }
  [hidden] { display: none !important; }

  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  #app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
         padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .screen { flex: 1; display: none; flex-direction: column; min-height: 0; position: relative; }
  .screen.on { display: flex; }
  .center { align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 12px; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* ---- HUD ---- */
  #hud { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 6px; background: rgba(10, 6, 24, .78); border-bottom: 2px solid #3a2a6e; position: relative; z-index: 2; }
  body.in-arcade #hud { padding-left: 96px; }
  .hudrow { display: flex; align-items: center; gap: 8px; }
  .hpwrap { flex: 1; min-width: 0; }
  .hpbar { height: 14px; background: #2a1d4a; border-radius: 8px; overflow: hidden; border: 1px solid #4a3a8a; position: relative; }
  #hpFill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a6e, #ff9a5a); transition: width .35s; }
  .hpline { font-size: 13px; display: flex; gap: 8px; margin-top: 2px; color: #ffd0d6; font-weight: 600; }
  #blockText { color: #9fd8ff; }
  .chip { background: rgba(255,255,255,.09); border-radius: 10px; padding: 4px 8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  #potBtn { background: rgba(120,255,160,.14); }
  #potBtn:disabled { opacity: .45; }
  #items { display: flex; gap: 2px; font-size: 18px; min-height: 22px; flex-wrap: wrap; }
  #items button { font-size: 18px; line-height: 1; padding: 1px; }

  /* ---- Title ---- */
  .h1 { font-family: var(--fancy); font-weight: 900; color: var(--gold); font-size: clamp(34px, 11vw, 54px); line-height: 1; text-shadow: 0 0 22px rgba(255,210,94,.45), 0 4px 0 #5a3b00; }
  .h1sub { font-family: var(--fancy); font-size: clamp(13px, 4vw, 18px); color: #e4d6ff; letter-spacing: 1px; }
  .h2 { font-family: var(--fancy); font-weight: 900; color: var(--gold); font-size: clamp(22px, 7vw, 30px); text-shadow: 0 0 16px rgba(255,210,94,.35); }
  .lead { color: #d8ccff; font-size: 16px; line-height: 1.4; max-width: 360px; }
  .label { font-size: 12px; letter-spacing: 2px; color: #a996e8; text-transform: uppercase; margin-top: 4px; }
  #grades { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: 100%; max-width: 360px; }
  .grade { background: #2a1d5c; border: 2px solid transparent; border-radius: 10px; padding: 9px 0; font-weight: 700; font-size: 16px; }
  .grade.sel { background: var(--gold); color: #2a1a00; border-color: #fff; }
  .btn { background: linear-gradient(180deg, #ffe08a, #f2b13a); color: #3a2400; font-weight: 700; font-size: 20px; border-radius: 16px; padding: 14px 30px; box-shadow: 0 5px 0 #a8701c, 0 10px 24px rgba(0,0,0,.35); min-width: 220px; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8701c; }
  .btn.ghost { background: linear-gradient(180deg, #4b3aa0, #2f2370); color: #fff; box-shadow: 0 5px 0 #1a1240; }
  .small { font-size: 13px; color: #a996e8; }
  #titleSpacer { height: 30vh; max-height: 260px; flex: none; }

  /* ---- Doors ---- */
  .floorTitle { text-align: center; padding: 14px 10px 4px; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #3a2a6e; display: block; }
  .dots i.done { background: var(--gold); }
  .dots i.now { background: #fff; box-shadow: 0 0 10px #fff; }
  .dots i.boss { background: #a03050; border-radius: 3px; }
  .doors { flex: 1; display: flex; gap: 12px; justify-content: center; align-items: center; padding: 10px 14px 24px; }
  .door { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .doorFrame { position: relative; width: 100%; aspect-ratio: 3 / 5; border-radius: 70px 70px 8px 8px; perspective: 700px;
               background: radial-gradient(circle at 50% 60%, var(--glow, #ffd25e) 0%, #1a0f38 70%); border: 5px solid #5b4632; box-shadow: 0 10px 24px rgba(0,0,0,.5), inset 0 0 20px rgba(0,0,0,.7); }
  .leaf { position: absolute; inset: 0; border-radius: 64px 64px 4px 4px; transform-origin: left center; transition: transform .7s cubic-bezier(.5,.1,.3,1);
          background: repeating-linear-gradient(90deg, #8a5a2e 0 22%, #7a4e27 22% 24%), linear-gradient(180deg, #9a6a38, #6e4522);
          box-shadow: inset 0 0 0 4px #5b3a1c, inset 0 -6px 0 #4a2e16; display: grid; place-items: center; backface-visibility: hidden; }
  .leaf .di { font-size: clamp(30px, 9vw, 44px); filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
  .leaf::after { content: ''; position: absolute; right: 12%; top: 55%; width: 10px; height: 10px; border-radius: 50%; background: #ffd25e; box-shadow: 0 0 6px #ffd25e; }
  .door.open .leaf { transform: rotateY(-108deg); }
  .door .dl { font-weight: 700; font-size: 15px; text-align: center; line-height: 1.1; }
  .door .ds { font-size: 12px; color: #b8a8ee; text-align: center; }
  .door:active .doorFrame { transform: scale(.97); }
  .door.boss .doorFrame { border-color: #a03050; }

  /* ---- Battle ---- */
  #stage { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
  #panel { height: 262px; flex: none; background: linear-gradient(180deg, #1c1240, #120b28); border-top: 2px solid #3a2a6e; position: relative; }
  .hint { font-size: 13px; color: #b8a8ee; text-align: center; padding: 6px 8px 0; }
  .spellGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 10px; }
  .spell { position: relative; background: linear-gradient(180deg, #3b2a8f, #271b63); border: 2px solid #5b46c6; border-radius: 16px; padding: 8px 10px;
           text-align: left; display: flex; align-items: center; gap: 8px; min-height: 76px; box-shadow: 0 4px 0 #160e3a; }
  .spell:active { transform: translateY(2px); box-shadow: 0 2px 0 #160e3a; }
  .spell .si { font-size: 30px; filter: drop-shadow(0 0 6px rgba(255,255,255,.25)); }
  .spell .sn { font-weight: 700; font-size: 15px; line-height: 1.1; }
  .spell .sd { font-size: 12px; color: #cbbcff; }
  .spell .tier { color: var(--gold); font-size: 11px; letter-spacing: 1px; }
  .spell .cdv { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; font-weight: 700; background: rgba(10,6,24,.66); border-radius: 14px; }
  .spell:disabled { filter: grayscale(.6) brightness(.75); }
  .solve { padding: 8px 10px; }
  .solveTop { display: flex; align-items: center; gap: 8px; }
  #cancelBtn { background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 10px; font-weight: 700; }
  #solveName { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .critBar { flex: 1; height: 10px; background: #2a1d4a; border-radius: 6px; overflow: hidden; }
  #critFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd25e, #ff8a3c); }
  #critLbl { font-size: 12px; font-weight: 700; color: var(--gold); white-space: nowrap; }
  #qText { font-weight: 700; font-size: clamp(30px, 9.5vw, 42px); text-align: center; margin: 6px 0 8px; color: var(--gold); text-shadow: 0 0 16px rgba(255,210,94,.4); white-space: nowrap; }
  #qText.shown { color: #9dffb0; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { background: linear-gradient(180deg, #f6e7c1, #e2c88e); color: var(--ink); border-radius: 14px; font-size: 26px; font-weight: 700; padding: 11px 0; box-shadow: 0 4px 0 #a88a4f; }
  .opt:active { transform: translateY(2px); box-shadow: 0 2px 0 #a88a4f; }
  .opt.good { background: linear-gradient(180deg, #8ef09a, #3fae5a); color: #fff; box-shadow: 0 4px 0 #237a3a; }
  .opt.bad { background: linear-gradient(180deg, #ff9a9a, #d64545); color: #fff; box-shadow: 0 4px 0 #8a2525; }
  .opt.reveal { box-shadow: 0 0 0 3px #9dffb0, 0 4px 0 #237a3a; background: linear-gradient(180deg, #8ef09a, #3fae5a); color: #fff; }

  /* ---- Cards (rewards, shop, rest, events) ---- */
  .cards { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 400px; padding: 0 14px; }
  .card { background: linear-gradient(180deg, var(--parch), var(--parch2)); color: var(--ink); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center;
          text-align: left; box-shadow: 0 6px 0 #8a6a35, 0 12px 24px rgba(0,0,0,.4); width: 100%; animation: cardIn .45s cubic-bezier(.2,1.4,.4,1) both; }
  .card:active { transform: translateY(3px); box-shadow: 0 3px 0 #8a6a35; }
  .card:disabled { opacity: .45; }
  .card .ci { font-size: 36px; flex: none; width: 46px; text-align: center; }
  .card .ct { font-weight: 700; font-size: 18px; }
  .card .cx { font-size: 14px; color: #6a4a28; line-height: 1.25; }
  .card .price { margin-left: auto; font-weight: 700; font-size: 17px; white-space: nowrap; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.92); } to { opacity: 1; transform: none; } }
  .goldPop { font-size: 22px; font-weight: 700; color: var(--gold); animation: cardIn .5s both; }
  .eventArt { font-size: 72px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .miniQ { width: 100%; max-width: 380px; padding: 0 14px; }

  /* ---- End ---- */
  .facts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 360px; }
  .facts span { background: rgba(255,255,255,.1); border: 1px solid #5b46c6; border-radius: 8px; padding: 4px 8px; font-weight: 700; color: var(--gold); }
  .stat { font-size: 18px; } .stat b { color: var(--gold); }

  /* ---- Toast + modal ---- */
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 74px); transform: translate(-50%, -12px); opacity: 0; transition: .25s; z-index: 50;
           background: rgba(20,12,48,.95); border: 2px solid var(--gold); border-radius: 14px; padding: 8px 14px; font-weight: 600; max-width: 92vw; text-align: center; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #modal { position: fixed; inset: 0; z-index: 40; background: rgba(8,4,20,.82); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 16px; }
  #modal.on { display: flex; }
  #floorBanner { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(8,4,20,.9); text-align: center; }
  #floorBanner.on { display: flex; animation: fadeInOut 2.4s both; }
  @keyframes fadeInOut { 0% { opacity: 0; } 15%, 80% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="hud" hidden>
    <div class="hudrow">
      <div class="hpwrap">
        <div class="hpbar"><i id="hpFill"></i></div>
        <div class="hpline"><span id="hpText">40/40</span><span id="blockText"></span></div>
      </div>
      <div class="chip" id="goldText">🪙 0</div>
      <button class="chip" id="potBtn">🧪 0</button>
    </div>
    <div class="hudrow"><div id="items"></div><div class="small" id="floorText" style="margin-left:auto"></div></div>
  </div>

  <!-- Title -->
  <section id="title" class="screen center on">
    <div id="titleSpacer"></div>
    <div class="h1">Larry Plopper</div>
    <div class="h1sub">and the Dungeon of Numbers</div>
    <p class="lead">Solve math to cast spells! Pick your doors, collect magic loot, and defeat the evil Lord Moldysock.</p>
    <div class="label">Grade</div>
    <div id="grades"></div>
    <button class="btn" id="continueBtn" hidden>▶ Continue run</button>
    <button class="btn" id="newBtn">✨ New run</button>
    <div class="small" id="bestText"></div>
  </section>

  <!-- Doors -->
  <section id="doors" class="screen">
    <div class="floorTitle"><div class="h2" id="floorName"></div><div class="small" id="doorHint">Choose a door</div><div class="dots" id="dots"></div></div>
    <div class="doors" id="doorRow"></div>
  </section>

  <!-- Battle -->
  <section id="battle" class="screen">
    <canvas id="stage"></canvas>
    <div id="panel">
      <div id="spellsView">
        <div class="hint" id="battleHint">Tap a spell, then solve it to cast!</div>
        <div class="spellGrid" id="spellGrid"></div>
      </div>
      <div id="solveView" class="solve" hidden>
        <div class="solveTop">
          <button id="cancelBtn">↩</button><div id="solveName"></div>
          <div class="critBar"><div id="critFill"></div></div><div id="critLbl">⚡ CRIT</div>
        </div>
        <div id="qText"></div>
        <div class="opts" id="opts"></div>
      </div>
    </div>
  </section>

  <!-- Generic room screen (rewards, shop, rest, events, treasure) -->
  <section id="room" class="screen center scroll"></section>

  <!-- End -->
  <section id="end" class="screen center scroll"></section>
</div>
<div id="toast"></div>
<div id="modal"></div>
<div id="floorBanner"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
if (window.self !== window.top) document.body.classList.add('in-arcade');
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuf = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 1 - Math.pow(1 - k, 3);
const wait = ms => new Promise(r => setTimeout(r, ms));
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

/* =====================================================================
   SOUND
   ===================================================================== */
let AC = null;
function ac(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type = 'sine', vol = .06, slide = 0, delay = 0){
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, freq, type = 'lowpass', delay = 0, sweep = 0){
  const a = ac(); if (!a) return;
  const n = Math.floor(a.sampleRate * d), b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + delay;
  s.buffer = b; f.type = type; f.frequency.setValueAtTime(freq, t); if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60, freq + sweep), t + d);
  g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  click(){ tone(660, .05, 'triangle', .05); },
  zap(){ [1320, 1760, 2093].forEach((f, i) => tone(f, .12, 'triangle', .05, 0, i * .04)); },
  fire(){ noise(.6, .35, 400, 'lowpass', 0, 1800); tone(180, .4, 'sawtooth', .04, -80); },
  frost(){ [2637, 3136, 2349].forEach((f, i) => tone(f, .25, 'sine', .04, 0, i * .05)); noise(.3, .12, 6000, 'highpass'); },
  bolt(){ noise(.5, .45, 2500, 'bandpass'); noise(.25, .3, 900, 'lowpass', .05); },
  whirl(){ noise(.8, .25, 600, 'bandpass', 0, 2400); },
  heal(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .25, 'sine', .05, 0, i * .08)); },
  shield(){ tone(300, .25, 'sine', .07, 500); tone(600, .2, 'sine', .04, 400, .08); },
  plop(){ tone(420, .28, 'sine', .12, -330); noise(.12, .2, 700, 'lowpass', .2); },
  hit(){ noise(.18, .4, 900); tone(140, .2, 'square', .05, -60); },
  hurt(){ tone(220, .25, 'square', .05, -120); noise(.15, .3, 500); },
  block(){ tone(900, .08, 'triangle', .06); tone(1200, .1, 'triangle', .04, 0, .05); },
  die(){ noise(.3, .3, 1500); [523, 392, 330].forEach((f, i) => tone(f, .12, 'triangle', .04, 0, i * .06)); },
  coin(){ tone(1568, .08, 'square', .03); tone(2093, .12, 'square', .03, 0, .06); },
  crit(){ [392, 523, 784].forEach(f => tone(f, .35, 'sawtooth', .035)); },
  door(){ tone(180, .7, 'sawtooth', .025, 90); noise(.5, .08, 300); },
  win(){ [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .16, 'square', .04, 0, i * .1)); },
  lose(){ [392, 370, 349, 262].forEach((f, i) => tone(f, i === 3 ? .7 : .3, 'sawtooth', .05, i === 3 ? -40 : 0, i * .32)); },
  roar(){ tone(90, 1, 'sawtooth', .08, -30); noise(.8, .2, 400); },
  owl(){ tone(700, .15, 'sine', .05, -200); tone(560, .2, 'sine', .05, -150, .18); },
  buff(){ tone(200, .3, 'square', .04, 300); },
  fart(){ for (let i = 0; i < 6; i++) tone(70 + Math.random() * 40, .12, 'sawtooth', .08, -20, i * .07); noise(.6, .25, 220); },
  whoosh(){ noise(.25, .2, 1800, 'bandpass', 0, -1200); },
  potion(){ tone(500, .1, 'sine', .06, 300); tone(800, .2, 'sine', .05, 300, .1); },
};
addEventListener('pointerdown', function unlock(){ ac(); removeEventListener('pointerdown', unlock); });

/* =====================================================================
   MATH PROBLEMS: three tiers per grade (★ easy, ★★ medium, ★★★ hard)
   ===================================================================== */
let grade = clamp(lsGet('larry_grade') ?? 3, 0, 8);
function mk(q, ans, cands){
  const A = String(ans), n = Number(A), allowNeg = n < 0 || grade >= 6;
  const set = new Set([A]);
  for (const c of shuf(cands.map(String))){
    if (set.size >= 4) break;
    if (c === A || c === 'NaN' || c.includes('Infinity')) continue;
    if (!allowNeg && c.startsWith('-')) continue;
    set.add(c);
  }
  let g = 0;
  while (set.size < 4 && g++ < 80){
    if (!isNaN(n)){
      const k = ri(1, 6) * (Math.random() < .5 ? -1 : 1);
      const v = Number.isInteger(n) ? n + k : +(n + k / 10).toFixed(1);
      if (v >= 0 || allowNeg) set.add(Number.isInteger(n) ? String(v) : v.toFixed(1));
    } else set.add(A.replace(/\d+/, d => String(+d + ri(1, 3))));
  }
  return { q, ans: A, opts: shuf([...set]) };
}
const add = (a, b) => mk(`${a} + ${b}`, a + b, [a + b + 1, a + b - 1, a + b + 2, a + b - 2, a + b + 10, a + b - 10, Math.abs(a - b)]);
const sub = (a, b) => mk(`${a} − ${b}`, a - b, [a - b + 1, a - b - 1, a - b + 2, a - b - 2, a + b, a - b + 10]);
const mul = (a, b) => mk(`${a} × ${b}`, a * b, [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, a * b + 10, a * b - 10]);
const div = (b, q) => mk(`${b * q} ÷ ${b}`, q, [q + 1, q - 1, q + 2, q - 2, b, b * q - b]);
function genProblem(g, t){
  const coin = () => Math.random() < .5;
  switch (g){
    case 0:
      if (t === 1) return add(ri(0, 3), ri(1, 3));
      if (t === 2) return add(ri(1, 5), ri(1, 5));
      { const a = ri(4, 10); return sub(a, ri(0, a)); }
    case 1:
      if (t === 1) return add(ri(1, 6), ri(1, 4));

      { const r = Math.random(); if (r < .4) return mul(ri(6, 12), ri(6, 12)); if (r < .7) return div(ri(3, 12), ri(3, 12));

        const d = ri(4, 12), a = ri(1, d - 2), b = ri(1, d - a - 1); return mk(`${a}/${d} + ${b}/${d}`, `${a + b}/${d}`, [`${a + b}/${2 * d}`, `${a + b + 1}/${d}`, `${a + b - 1}/${d}`, `${a * b}/${d}`]);

const parts = [], rings = [], floats = [], projs = [], bolts = [], tweens = [];
let shake = 0, flash = null;
function tween(dur, fn){ return new Promise(res => tweens.push({ t: 0, dur, fn, res })); }
function burst(x, y, colors, n, speed, opts = {}){
  for (let i = 0; i < n; i++){
    const a = opts.up ? -Math.PI / 2 + (Math.random() - .5) * 1.6 : Math.random() * Math.PI * 2, v = speed * (.35 + Math.random() * .75);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: (opts.life || .6) * (.6 + Math.random() * .7),
                 c: colors[i % colors.length], s: (opts.size || 4) * (.6 + Math.random() * .8), g: opts.grav ?? 240, shape: opts.shape || 'sq', spin: Math.random() * 6 });
  }
}
function ring(x, y, r, color, dur = .4, w = 4){ rings.push({ x, y, r, color, dur, w, t: 0 }); }
function float(text, x, y, color = '#fff', size = 22){ floats.push({ text, x, y, color, size, t: 0 }); }
function shoot(kind, x0, y0, x1, y1, dur, arc = 0){ return new Promise(res => projs.push({ kind, x0, y0, x1, y1, dur, arc, t: 0, res, x: x0, y: y0 })); }
function screenFlash(color, a = .5){ flash = { color, a }; }
function drawStar(g, x, y, r, rot = 0){
  g.beginPath();
  for (let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r, a = rot + i * Math.PI / 5 - Math.PI / 2; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
function updateFx(dt){
  for (let i = tweens.length - 1; i >= 0; i--){ const w = tweens[i]; w.t += dt; const k = Math.min(1, w.t / w.dur); w.fn(k); if (k >= 1){ tweens.splice(i, 1); w.res(); } }
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.t += dt; if (p.t > p.life){ parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= .985; }
  for (let i = rings.length - 1; i >= 0; i--){ rings[i].t += dt; if (rings[i].t > rings[i].dur) rings.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--){ floats[i].t += dt; if (floats[i].t > 1.2) floats.splice(i, 1); }
  for (let i = bolts.length - 1; i >= 0; i--){ bolts[i].t += dt; if (bolts[i].t > bolts[i].dur) bolts.splice(i, 1); }
  for (let i = projs.length - 1; i >= 0; i--){
    const p = projs[i]; p.t += dt; const k = Math.min(1, p.t / p.dur);
    p.x = lerp(p.x0, p.x1, k); p.y = lerp(p.y0, p.y1, k) - Math.sin(k * Math.PI) * p.arc;
    const trail = { zap: ['#fff8c0', '#ffd25e', '#ffffff'], fire: ['#ffb03a', '#ff5a2a', '#ffe08a'], frost: ['#bff4ff', '#7ad8ff', '#ffffff'], goo: ['#7aff5a', '#3fd04a'], owl: ['#e8d0a0'] }[p.kind];
    if (trail && Math.random() < .9) burst(p.x, p.y, trail, p.kind === 'fire' ? 3 : 2, 30, { life: .35, size: p.kind === 'fire' ? 6 : 4, grav: p.kind === 'fire' ? -60 : 40, shape: p.kind === 'zap' ? 'star' : 'sq' });
    if (k >= 1){ projs.splice(i, 1); p.res(); }
  }
  shake = Math.max(0, shake - dt * 2.2);
  if (flash){ flash.a -= dt * 2.2; if (flash.a <= 0) flash = null; }
}
function drawFxLayer(g){
  for (const p of parts){
    g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.c;
    if (p.shape === 'star') drawStar(g, p.x, p.y, p.s, p.spin + p.t * 4);
    else if (p.shape === 'circle'){ g.beginPath(); g.arc(p.x, p.y, p.s, 0, Math.PI * 2); g.fill(); }
    else g.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  g.globalAlpha = 1;
  for (const r of rings){ const k = r.t / r.dur; g.strokeStyle = r.color; g.globalAlpha = 1 - k; g.lineWidth = r.w * (1 - k) + 1; g.beginPath(); g.arc(r.x, r.y, r.r * (.2 + k), 0, Math.PI * 2); g.stroke(); }
  g.globalAlpha = 1;
  for (const b of bolts){
    g.globalAlpha = 1 - b.t / b.dur; g.lineJoin = 'round';
    for (const [w, c] of [[9, 'rgba(160,200,255,.45)'], [3, '#ffffff']]){
      g.strokeStyle = c; g.lineWidth = w; g.beginPath(); b.pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
    }
  }
  g.globalAlpha = 1;
  for (const p of projs) drawProjectile(g, p);
  for (const f of floats){
    const k = f.t / 1.2, y = f.y - ease(Math.min(1, k * 1.5)) * 40, sc = k < .15 ? .6 + k / .15 * .6 : 1.2 - Math.min(.2, (k - .15));
    g.save(); g.globalAlpha = k > .7 ? 1 - (k - .7) / .3 : 1; g.translate(f.x, y); g.scale(sc, sc);
    g.font = `700 ${f.size}px Fredoka, system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 5; g.strokeStyle = 'rgba(20,10,40,.9)'; g.strokeText(f.text, 0, 0); g.fillStyle = f.color; g.fillText(f.text, 0, 0);
    g.restore();
  }
}
function drawProjectile(g, p){
  if (p.kind === 'zap'){ g.fillStyle = '#fff8c0'; g.shadowColor = '#ffd25e'; g.shadowBlur = 18; drawStar(g, p.x, p.y, 11, p.t * 14); g.shadowBlur = 0; }
  else if (p.kind === 'fire'){
    const gr = g.createRadialGradient(p.x, p.y, 2, p.x, p.y, 18); gr.addColorStop(0, '#fff4c0'); gr.addColorStop(.4, '#ffb03a'); gr.addColorStop(1, 'rgba(255,60,20,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, 18, 0, Math.PI * 2); g.fill();
  } else if (p.kind === 'frost'){
    g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.y1 - p.y0, p.x1 - p.x0));
    g.fillStyle = '#dff8ff'; g.shadowColor = '#7ad8ff'; g.shadowBlur = 14;
    g.beginPath(); g.moveTo(16, 0); g.lineTo(0, 7); g.lineTo(-14, 0); g.lineTo(0, -7); g.closePath(); g.fill(); g.restore();
  } else if (p.kind === 'goo'){
    g.fillStyle = '#5ee04a'; g.beginPath(); g.ellipse(p.x, p.y, 16, 13, 0, 0, Math.PI * 2); g.fill();

/* ---- Emoji sprites (cached), with optional tint and a white "hit" version ---- */
const spriteCache = {};
function sprite(e, tint, white){

/* ---- Larry, hand-drawn ---- */
const L = { cast: 0, squash: 0, hurt: 0, goo: 0, offX: 0, jump: 0, bubble: 0, dead: 0 };
function drawLarry(g, x, y, s, st, time){

  g.fillStyle = '#ffd25e'; g.fillRect(-25, -9, 50, 4);
  g.fillStyle = 'rgba(255,230,140,.85)'; drawStar(g, -9, -30, 4, .3); drawStar(g, 8, -44, 3, .8); drawStar(g, 12, -20, 3, 1.4);
  // back arm
  g.fillStyle = '#3a2a90'; g.beginPath(); g.ellipse(-12, -45, 6, 12, .3, 0, Math.PI * 2); g.fill();
  // head

  // hair (messy)
  g.fillStyle = '#4a2c14';
  [[-10, -80, 8], [-4, -86, 8], [5, -88, 7], [-13, -71, 6], [12, -84, 6]].forEach(([hx, hy, r]) => { g.beginPath(); g.arc(hx, hy, r, 0, Math.PI * 2); g.fill(); });
  // glasses
  g.strokeStyle = '#1a1a1a'; g.lineWidth = 2.2;
  g.beginPath(); g.arc(4, -75, 5.5, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(15, -75, 5.5, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(9.5, -75); g.lineTo(9.5, -75); g.stroke();
  g.beginPath(); g.moveTo(-1.5, -76); g.lineTo(-10, -78); g.stroke();
  g.fillStyle = '#1a1a1a'; g.beginPath(); g.arc(5, -75, 1.8, 0, Math.PI * 2); g.arc(16, -75, 1.8, 0, Math.PI * 2); g.fill();
  // smile
  g.strokeStyle = '#7a3a2a'; g.lineWidth = 1.8; g.beginPath(); g.arc(10, -67, 4, .2, Math.PI - .4); g.stroke();

  g.fillStyle = '#2f2280'; g.beginPath(); g.ellipse(1, -88, 23, 5.5, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3d2ca0'; g.beginPath(); g.moveTo(-15, -89); g.quadraticCurveTo(-4, -112, -14 + sway, -132); g.lineTo(17, -89); g.closePath(); g.fill();
  g.fillStyle = '#ffd25e'; drawStar(g, 0, -103, 5, .2);
  // goo from a fizzled spell
  if (st.goo > 0){
    g.globalAlpha = Math.min(1, st.goo * 1.5);

function wandTip(){

/* =====================================================================
   BATTLE: logic produces events, the animator plays them
   ===================================================================== */
function makeEnemy(id){
  const d = ENEMIES[id], hp = Math.round(d.hp * (1 + .1 * (run.floor - 1)));
  return { id, e: d.e, name: d.n, hp, maxHp: hp, dispHp: hp, block: 0, dispBlock: 0, atkBonus: 0, frozen: 0, dead: false, intent: null,
           moveIdx: d.boss ? 0 : ri(0, d.moves.length - 1), size: d.size || (d.elite ? 1.3 : 1), tint: d.tint, boss: !!d.boss,
           x: SW * 1.2, tx: SW * .75, flashT: 0, kb: 0, lunge: 0, dying: 0, alpha: 1, spawn: 0 };
}
function setIntent(en){
  const moves = ENEMIES[en.id].moves, m = moves[en.moveIdx % moves.length]; en.moveIdx++;
  en.intent = { type: m[0], n: m[1], k: m[2] };
  if (en.intent.type === 'summon' && battle.enemies.filter(x => !x.dead).length >= 3) en.intent = { type: 'atk', n: 6 + run.floor * 2 };
}
function intentText(en){
  const i = en.intent; if (!i) return '';
  if (en.frozen > 0) return '❄️';
  const dz = en.blind > 0 ? '😵' : '';
  if (i.type === 'atk') return `${dz}🗡️${i.n + en.atkBonus}`;
  if (i.type === 'multi') return `${dz}🗡️${i.n + en.atkBonus}×${i.k}`;
  return { def: '🛡️', buff: '💪', charge: '⚠️', summon: '📣' }[i.type] || '';
}
function layoutEnemies(snap){
  if (!battle) return;
  const alive = battle.enemies.filter(e => !e.dead);
  alive.forEach((en, i) => {
    en.tx = alive.length === 1 ? SW * (en.boss ? .7 : .72) : SW * (.53 + (i + .5) * (.42 / alive.length));
    if (snap) en.x = en.tx;
  });
}
function enemyPos(en){ const s = Math.min(SW / 330, SH / 290); return { x: en.x + en.kb + en.lunge, y: SH * .86, size: 74 * s * en.size }; }
function aliveEnemies(){ return battle.enemies.filter(e => !e.dead); }

function startBattle(kind){
  const F = FLOORS[run.floor];
  const ids = kind === 'boss' ? F.boss : kind === 'elite' ? pick(F.elite) : pick(F.normal);
  battle = { kind, enemies: [], block: 0, phase: 'intro', target: 0, first: true, prob: null, spellIdx: -1, cds: run.spells.map(() => 0), dispHp: run.hp };
  show('battle'); sizeStage();
  battle.enemies = ids.map(id => makeEnemy(id));
  battle.enemies.forEach(setIntent);
  layoutEnemies(false);
  battle.enemies.forEach(en => { en.x = SW + 80; });
  L.cast = L.squash = L.hurt = L.goo = L.offX = L.jump = L.bubble = L.dead = 0;
  if (hasItem('scale')){ battle.block = 6; L.bubble = 1; }
  renderHud(); showSpells(); setPanelEnabled(false);
  $('battleHint').textContent = kind === 'boss' ? `👑 ${battle.enemies[0].name} appears!` : 'Tap a spell, then solve it to cast!';
  (async () => {
    if (kind === 'boss'){ sfx.roar(); shake = 1; }
    await tween(.7, k => battle.enemies.forEach(en => en.x = lerp(SW + 80, en.tx, ease(k))));
    playerTurnStart(true);
  })();
}

async function playerTurnStart(first){
  if (!first){ battle.block = 0; L.bubble = 0; }
  battle.cds = battle.cds.map(c => Math.max(0, c - 1));
  renderHud(run.hp, battle.block);
  if (hasItem('owl') && aliveEnemies().length){
    const t = pick(aliveEnemies()), lp = larryPos(), tp = enemyPos(t);
    sfx.owl();
    await shoot('owl', lp.x - 30, lp.y - 140 * lp.s, tp.x, tp.y - tp.size * .6, .5, 40);
    const ev = []; dmgEnemy(t, 3, ev, false); await playEvents(ev);
    if (!aliveEnemies().length) return victory();
  }
  battle.phase = 'choose'; battle.target = clamp(battle.target, 0, battle.enemies.length - 1);
  if (battle.enemies[battle.target]?.dead) battle.target = battle.enemies.indexOf(aliveEnemies()[0]);
  setPanelEnabled(true); renderHud();
}

/* ---- spells panel ---- */
function showSpells(){
  $('spellsView').hidden = false; $('solveView').hidden = true;
  const grid = $('spellGrid'); grid.innerHTML = '';
  run.spells.forEach((s, i) => {
    const S = SPELLS[s.id], cd = battle ? battle.cds[i] : 0;
    const b = document.createElement('button'); b.className = 'spell';
    const pw = spellPower(s), what = S.kind === 'block' ? `${pw} block` : S.kind === 'heal' ? `heal ${pw}` : S.kind === 'all' ? `${pw} to all` : S.kind === 'blind' ? `blind all · ${pw} turns` : `${pw} dmg`;
    b.innerHTML = `<div class="si">${S.icon}</div><div><div class="sn">${S.name}${s.lvl ? ' +' + s.lvl : ''}</div><div class="sd">${what}</div><div class="tier">${'★'.repeat(S.tier)}</div></div>` +
                  (cd > 0 ? `<div class="cdv">⏳ ${cd} turn${cd > 1 ? 's' : ''}</div>` : '');
    b.disabled = cd > 0; b.dataset.i = i;
    grid.appendChild(b);
  });
}
function setPanelEnabled(on){
  document.querySelectorAll('#spellGrid .spell').forEach((b, i) => b.disabled = !on || (battle && battle.cds[i] > 0));
  renderHud();
}
$('spellGrid').addEventListener('click', e => {
  const b = e.target.closest('.spell'); if (!b || b.disabled || !battle || battle.phase !== 'choose') return;
  sfx.click(); chooseSpell(+b.dataset.i);
});
let critTimer = 0;
function critWindow(tier){ return [0, 3.5, 5.5, 8][tier] + (hasItem('sand') ? 2 : 0); }
function chooseSpell(i){
  const s = run.spells[i], S = SPELLS[s.id];
  battle.spellIdx = i; battle.phase = 'solve';
  // About a quarter of the time, bring back a fact he has missed before (same tier).
  const old = Object.values(run.misses).filter(m => m.tier === S.tier && m.grade === run.grade);
  battle.prob = old.length && Math.random() < .25 ? { ...pick(old), opts: shuf(pick(old).opts.slice()) } : genProblem(run.grade, S.tier);
  battle.prob.tier = S.tier;
  battle.solveStart = performance.now(); battle.critWin = critWindow(S.tier);
  $('spellsView').hidden = true; $('solveView').hidden = false;
  $('solveName').textContent = `${S.icon} ${S.name}`;
  $('qText').textContent = battle.prob.q + ' = ?'; $('qText').classList.remove('shown');
  let opts = battle.prob.opts.slice();
  if (hasItem('specs')){ const wrong = opts.filter(o => o !== battle.prob.ans); opts = opts.filter(o => o !== wrong[0]); }
  $('opts').innerHTML = opts.map(o => `<button class="opt" data-v="${o}">${o}</button>`).join('');
  $('cancelBtn').disabled = false; renderHud();
}
$('cancelBtn').onclick = () => { if (battle && battle.phase === 'solve'){ sfx.click(); battle.phase = 'choose'; showSpells(); setPanelEnabled(true); } };
$('opts').addEventListener('click', e => { const b = e.target.closest('.opt'); if (b && battle && battle.phase === 'solve') answer(b.dataset.v, b); });

// Tap a monster to aim single-target spells.
stage.addEventListener('pointerdown', e => {
  if (!battle || !['choose', 'solve'].includes(battle.phase)) return;
  const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  let best = -1, bd = 1e9;
  battle.enemies.forEach((en, i) => { if (en.dead) return; const p = enemyPos(en), d = Math.hypot(px - p.x, py - (p.y - p.size * .5)); if (d < p.size && d < bd){ bd = d; best = i; } });
  if (best >= 0 && best !== battle.target){ battle.target = best; sfx.click(); }
});

async function answer(val, btn){
  battle.phase = 'resolving'; $('cancelBtn').disabled = true;
  const P = battle.prob, ok = val === P.ans, st = run.stats;
  const took = (performance.now() - battle.solveStart) / 1000;
  document.querySelectorAll('#opts .opt').forEach(b => b.disabled = true);
  st.attempts++;
  let crit = false, lucky = false;
  if (ok){
    btn.classList.add('good'); st.correct++; st.streak++; st.best = Math.max(st.best, st.streak);
    crit = took <= battle.critWin || (hasItem('crystal') && battle.first);
    const m = run.misses[P.q]; if (m && --m.n <= 0) delete run.misses[P.q];
    await wait(260);
  } else {
    btn.classList.add('bad'); st.streak = 0;
    document.querySelectorAll('#opts .opt').forEach(b => { if (b.dataset.v === P.ans) b.classList.add('reveal'); });
    $('qText').textContent = `${P.q} = ${P.ans}`; $('qText').classList.add('shown');
    const m = run.misses[P.q] || (run.misses[P.q] = { q: P.q, ans: P.ans, opts: P.opts, tier: P.tier, grade: run.grade, n: 0 }); m.n = Math.min(3, m.n + 1);
    lucky = hasItem('cat') && Math.random() < .5;
    await wait(1250);
  }
  battle.first = false;
  showSpells(); setPanelEnabled(false);
  const ev = resolvePlayer(run.spells[battle.spellIdx], ok, crit, lucky);
  await playEvents(ev);
  if (!aliveEnemies().length) return victory();
  await enemyPhase();
}

function resolvePlayer(s, ok, crit, lucky){
  const S = SPELLS[s.id], ev = [];
  if (!ok && !lucky){ ev.push({ type: 'plop' }); return ev; }
  let p = spellPower(s);
  if (['dmg', 'freeze', 'all'].includes(S.kind) && hasItem('combo')) p += Math.min(5, Math.max(0, run.stats.streak - 1));
  if (lucky){ p = Math.ceil(p / 2); ev.push({ type: 'lucky' }); }
  if (crit) p = Math.round(p * 1.5);
  battle.cds[battle.spellIdx] = S.cd + (S.cd ? 1 : 0);   // +1 because cooldowns tick at the start of the next turn
  let target = battle.enemies[battle.target];
  if (!target || target.dead) target = aliveEnemies()[0];
  if (S.kind === 'dmg' || S.kind === 'freeze'){
    ev.push({ type: 'cast', spell: s.id, targets: [battle.enemies.indexOf(target)], crit });
    dmgEnemy(target, p, ev, crit);
    if (S.kind === 'freeze' && !target.dead){ target.frozen = 1; ev.push({ type: 'freeze', i: battle.enemies.indexOf(target) }); }
  } else if (S.kind === 'all'){
    const ts = aliveEnemies();
    ev.push({ type: 'cast', spell: s.id, targets: ts.map(t => battle.enemies.indexOf(t)), crit });
    ts.forEach(t => dmgEnemy(t, p, ev, crit));
  } else if (S.kind === 'blind'){
    const ts = aliveEnemies();
    ev.push({ type: 'cast', spell: s.id, targets: ts.map(t => battle.enemies.indexOf(t)), crit });
    ts.forEach(t => { t.blind = Math.max(t.blind || 0, p); ev.push({ type: 'blind', i: battle.enemies.indexOf(t) }); });
  } else if (S.kind === 'block'){
    battle.block += p; ev.push({ type: 'cast', spell: s.id, targets: [], crit }, { type: 'gainBlock', amount: p, blockAfter: battle.block });
  } else if (S.kind === 'heal'){
    const before = run.hp; run.hp = Math.min(run.maxHp, run.hp + p);
    ev.push({ type: 'cast', spell: s.id, targets: [], crit }, { type: 'heal', amount: run.hp - before, hpAfter: run.hp });
  }
  return ev;
}
function dmgEnemy(en, amount, ev, crit){
  const i = battle.enemies.indexOf(en), blocked = Math.min(en.block, amount);
  en.block -= blocked; const dealt = amount - blocked; en.hp = Math.max(0, en.hp - dealt);
  ev.push({ type: 'dmg', i, dealt, blocked, crit, hpAfter: en.hp, blockAfter: en.block });
  if (en.hp <= 0 && !en.dead){ en.dead = true; run.stats.defeated++; ev.push({ type: 'die', i }); }
}
function dmgPlayer(amount, ev, i){
  const en = battle.enemies[i];
  if (en && en.blind > 0 && Math.random() < .6){ ev.push({ type: 'miss', i }); return; }   // blinded by Fartos Plopem
  const blocked = Math.min(battle.block, amount); battle.block -= blocked;
  const dealt = amount - blocked; run.hp = Math.max(0, run.hp - dealt);
  ev.push({ type: 'hit', i, dealt, blocked, hpAfter: run.hp, blockAfter: battle.block });
}

async function enemyPhase(){
  battle.phase = 'enemy';
  for (const en of battle.enemies.slice()){
    if (en.dead) continue;
    const ev = [], i = battle.enemies.indexOf(en);
    if (en.frozen > 0){ en.frozen = 0; ev.push({ type: 'thaw', i }); await playEvents(ev); continue; }
    en.block = 0; en.dispBlock = 0;
    const it = en.intent;
    if (it.type === 'atk'){ ev.push({ type: 'lunge', i }); dmgPlayer(it.n + en.atkBonus, ev, i); }
    else if (it.type === 'multi'){ for (let k = 0; k < it.k && run.hp > 0; k++){ ev.push({ type: 'lunge', i, quick: true }); dmgPlayer(it.n + en.atkBonus, ev, i); } }
    else if (it.type === 'def'){ en.block += it.n; ev.push({ type: 'eBlock', i, amount: it.n }); }
    else if (it.type === 'buff'){ en.atkBonus += it.n; ev.push({ type: 'eBuff', i, amount: it.n }); }
    else if (it.type === 'charge'){ ev.push({ type: 'eCharge', i }); }
    else if (it.type === 'summon'){
      const m = makeEnemy(it.n); m.x = SW + 60; battle.enemies.push(m); setIntent(m);
      ev.push({ type: 'summon', i, j: battle.enemies.length - 1 });
    }
    if (en.blind > 0) en.blind--;
    await playEvents(ev);
    if (run.hp <= 0) return defeat();
  }
  battle.enemies.forEach(en => { if (!en.dead) setIntent(en); });
  await playerTurnStart(false);
}

async function playEvents(list){ for (const e of list) await playEvent(e); }
async function playEvent(ev){
  const lp = larryPos();
  const en = ev.i !== undefined ? battle.enemies[ev.i] : null;
  switch (ev.type){
    case 'plop': {
      sfx.plop();
      await shoot('goo', lp.x + 4 * lp.s, lp.y - 260 * lp.s, lp.x, lp.y - 96 * lp.s, .4);
      burst(lp.x, lp.y - 96 * lp.s, ['#5ee04a', '#3fd04a', '#9dff7a'], 22, 220, { grav: 500, size: 6, shape: 'circle' });
      L.goo = 1; float('PLOP!', lp.x, lp.y - 150 * lp.s, '#7aff5a', 34);
      await tween(.35, k => L.squash = Math.sin(k * Math.PI) * .9);
      tween(2.5, k => L.goo = 1 - k);
      await wait(250);
      break;
    }
    case 'blind': { const p = enemyPos(en); float('😵 Blinded!', p.x, p.y - p.size * 1.4, '#b8e05a', 18); await wait(120); break; }
    case 'miss': {
      const dist = (en.x - lp.x) * .45; sfx.whoosh();
      await tween(.22, k => en.lunge = -dist * ease(k));
      float('MISS!', lp.x + 20, lp.y - 140 * lp.s, '#b8e05a', 26);
      tween(.3, k => en.lunge = -dist * (1 - k));
      await wait(200); break;
    }
    case 'lucky': float('🐈‍⬛ Lucky! Half power', lp.x + 40, lp.y - 160 * lp.s, '#ffd25e', 20); await wait(450); break;
    case 'cast': await castAnim(ev); break;
    case 'dmg': {
      const p = enemyPos(en);
      en.dispHp = ev.hpAfter; en.dispBlock = ev.blockAfter; en.flashT = .14;
      tween(.3, k => en.kb = Math.sin(k * Math.PI) * 18);
      if (ev.blocked) float(`🛡️-${ev.blocked}`, p.x + 26, p.y - p.size * 1.1, '#9fd8ff', 18);
      if (ev.dealt) float(ev.crit ? `CRIT! ${ev.dealt}` : `${ev.dealt}`, p.x, p.y - p.size * 1.15, ev.crit ? '#ffd25e' : '#ffffff', ev.crit ? 32 : 26);
      sfx.hit(); await wait(140);
      break;
    }
    case 'die': {
      const p = enemyPos(en);
      sfx.die();
      burst(p.x, p.y - p.size * .5, ['#b77aff', '#7a5ad6', '#ffffff'], 26, 200, { grav: -40, size: 7, life: .8, shape: 'circle' });
      burst(p.x, p.y - p.size * .5, ['#ffd25e', '#ffb03a'], 10, 260, { grav: 600, size: 6, shape: 'circle' });
      ring(p.x, p.y - p.size * .5, p.size, '#ffffff', .45, 5);
      await tween(.45, k => { en.dying = k; });
      layoutEnemies(false); battle.target = battle.enemies.indexOf(aliveEnemies()[0]);
      tween(.4, () => aliveEnemies().forEach(a => a.x = lerp(a.x, a.tx, .2)));
      break;
    }
    case 'freeze': { const p = enemyPos(en); burst(p.x, p.y - p.size * .5, ['#dff8ff', '#7ad8ff'], 18, 160, { shape: 'star', grav: 80 }); float('Frozen!', p.x, p.y - p.size * 1.4, '#9fe8ff', 20); await wait(300); break; }
    case 'thaw': { const p = enemyPos(en); burst(p.x, p.y - p.size * .5, ['#dff8ff', '#7ad8ff'], 14, 200, { grav: 400 }); float('❄️ skips a turn', p.x, p.y - p.size * 1.3, '#9fe8ff', 18); sfx.frost(); await wait(500); break; }
    case 'gainBlock': L.bubble = 1; renderHud(battle.dispHp, ev.blockAfter); float(`+${ev.amount} 🛡️`, lp.x, lp.y - 150 * lp.s, '#9fd8ff', 24); await wait(250); break;
    case 'heal': battle.dispHp = ev.hpAfter; renderHud(ev.hpAfter); float(`+${ev.amount} ❤️`, lp.x, lp.y - 150 * lp.s, '#7aff9a', 26); await wait(250); break;
    case 'lunge': {
      const dist = (en.x - lp.x) * .55;
      await tween(ev.quick ? .16 : .24, k => en.lunge = -dist * ease(k));
      tween(.25, k => en.lunge = -dist * (1 - k));
      break;
    }
    case 'hit': {
      battle.dispHp = ev.hpAfter; renderHud(ev.hpAfter, ev.blockAfter);
      if (ev.blocked){ sfx.block(); ring(lp.x, lp.y - 60 * lp.s, 70 * lp.s, '#9fd8ff', .35, 6); float(`🛡️ ${ev.blocked}`, lp.x + 30, lp.y - 140 * lp.s, '#9fd8ff', 20); if (!ev.blockAfter){ L.bubble = 0; burst(lp.x, lp.y - 60 * lp.s, ['#bfe8ff', '#ffffff'], 16, 200, { shape: 'circle', grav: 100 }); } }
      if (ev.dealt){
        sfx.hurt(); shake = Math.min(1, .35 + ev.dealt / 25); screenFlash('rgba(255,40,60,1)', .3);
        float(`-${ev.dealt}`, lp.x, lp.y - 140 * lp.s, '#ff6a7a', 28);
        burst(lp.x + 10, lp.y - 60 * lp.s, ['#ff6a7a', '#ffffff'], 10, 180);
        tween(.5, k => { L.hurt = 1 - k; L.offX = -Math.sin(k * Math.PI) * 14; });
      }
      await wait(220);
      break;
    }
    case 'eBlock': { const p = enemyPos(en); en.dispBlock = en.block; sfx.block(); ring(p.x, p.y - p.size * .5, p.size * .9, '#9fd8ff', .45, 6); float(`🛡️+${ev.amount}`, p.x, p.y - p.size * 1.3, '#9fd8ff', 22); await wait(450); break; }
    case 'eBuff': { const p = enemyPos(en); sfx.buff(); burst(p.x, p.y - p.size * .4, ['#ff5a5a', '#ffb03a'], 16, 120, { up: true, grav: -80 }); float(`💪+${ev.amount}`, p.x, p.y - p.size * 1.3, '#ff9a6a', 22); await wait(450); break; }
    case 'eCharge': { const p = enemyPos(en); sfx.roar(); float('⚠️ Charging up!', p.x, p.y - p.size * 1.35, '#ffd25e', 20); await tween(.6, k => en.kb = Math.sin(k * 40) * 4 * (1 - k)); break; }
    case 'summon': {
      const m = battle.enemies[ev.j]; float('📣 Minion!', enemyPos(en).x, enemyPos(en).y - enemyPos(en).size * 1.3, '#ffd25e', 20);
      layoutEnemies(false); const x0 = m.x;
      await tween(.5, k => { battle.enemies.forEach(a => { if (!a.dead && a !== m) a.x = lerp(a.x, a.tx, .25); }); m.x = lerp(x0, m.tx, ease(k)); });
      break;
    }
  }
}
async function castAnim(ev){
  const tip = () => wandTip();
  await tween(.18, k => L.cast = ease(k));
  const targets = ev.targets.map(i => battle.enemies[i]);
  const tp = en => { const p = enemyPos(en); return { x: p.x, y: p.y - p.size * .5, r: p.size }; };
  if (ev.crit){ sfx.crit(); float('⚡ CRITICAL!', SW / 2, SH * .22, '#ffd25e', 30); screenFlash('rgba(255,230,120,1)', .35); }
  switch (ev.spell){
    case 'zap': {
      sfx.zap(); const t = tp(targets[0]), w = tip();
      await shoot('zap', w.x, w.y, t.x, t.y, .32, 30);
      burst(t.x, t.y, ['#fff8c0', '#ffd25e', '#ffffff'], 18, 220, { shape: 'star', grav: 60, size: 7 }); ring(t.x, t.y, t.r * .8, '#ffd25e');
      break;
    }
    case 'fire': {
      sfx.fire(); const t = tp(targets[0]), w = tip();
      await shoot('fire', w.x, w.y, t.x, t.y, .45, 50);
      burst(t.x, t.y, ['#ffe08a', '#ffb03a', '#ff5a2a', '#ff3a1a'], 40, 320, { size: 9, grav: -120, life: .7, shape: 'circle' });
      burst(t.x, t.y, ['#555', '#777'], 10, 90, { size: 12, grav: -90, life: 1, shape: 'circle' });
      ring(t.x, t.y, t.r * 1.4, '#ffb03a', .45, 8); shake = .7; screenFlash('rgba(255,150,60,1)', .25);
      break;
    }
    case 'frost': {
      sfx.frost(); const t = tp(targets[0]), w = tip();
      await shoot('frost', w.x, w.y, t.x, t.y, .35, 10);
      burst(t.x, t.y, ['#dff8ff', '#7ad8ff', '#ffffff'], 24, 240, { shape: 'star', size: 7, grav: 120 }); ring(t.x, t.y, t.r, '#9fe8ff', .4, 6);
      break;
    }
    case 'whirl': {
      sfx.whirl(); const t = tp(targets[0]);
      await tween(.75, k => {
        for (let n = 0; n < 3; n++){ const a = k * 18 + n * 2.1, r = t.r * (1 - k * .6);
          parts.push({ x: t.x + Math.cos(a) * r, y: t.y + Math.sin(a) * r * .5 - k * 20, vx: 0, vy: -30, t: 0, life: .4, c: n % 2 ? '#d0f0ff' : '#ffffff', s: 6, g: 0, shape: 'circle', spin: 0 }); }
      });
      ring(t.x, t.y, t.r * 1.3, '#d0f0ff', .4, 6); shake = .5;
      break;
    }
    case 'bolt': {
      sfx.bolt(); screenFlash('rgba(200,220,255,1)', .5); shake = .6;
      for (const en of targets){
        const t = tp(en), pts = []; let y = 0, x = t.x + (Math.random() - .5) * 60;
        while (y < t.y){ pts.push([x, y]); y += 18 + Math.random() * 14; x += (Math.random() - .5) * 34; }
        pts.push([t.x, t.y]); bolts.push({ pts, t: 0, dur: .4 });
        burst(t.x, t.y, ['#ffffff', '#bfe0ff', '#ffe98a'], 14, 220, { size: 5 });
      }
      await wait(260);
      break;
    }
    case 'fart': {
      sfx.fart(); const lp = larryPos();
      float('💨 FARTOS PLOPEM!', SW / 2, SH * .34, '#b8e05a', 26); screenFlash('rgba(150,190,60,1)', .25);
      await tween(.25, k => L.squash = Math.sin(k * Math.PI) * .5);
      await tween(.7, k => {
        for (let n = 0; n < 3; n++) parts.push({ x: lp.x - 20 * lp.s, y: lp.y - 30 * lp.s, vx: 160 + Math.random() * 260, vy: -20 - Math.random() * 60, t: 0, life: 1.1, c: pick(['#9ccf5a', '#b8a35a', '#7aa04a', '#c8e08a']), s: 10 + Math.random() * 12, g: -10, shape: 'circle', spin: 0 });
      });
      for (const en of targets){ const t = tp(en); burst(t.x, t.y, ['#9ccf5a', '#b8a35a', '#c8e08a'], 18, 90, { shape: 'circle', size: 14, grav: -30, life: 1.1 }); }
      break;
    }
    case 'shield': {
      sfx.shield(); const lp = larryPos();
      await tween(.35, k => L.bubble = ease(k));
      burst(lp.x, lp.y - 60 * lp.s, ['#bfe8ff', '#ffffff'], 14, 120, { shape: 'star', grav: 0 });

    case 'heal': {

      break;
    }
  }
  tween(.25, k => L.cast = 1 - ease(k));
}

async function victory(){
  battle.phase = 'won'; setPanelEnabled(false);
  sfx.win();
  await tween(.6, k => L.jump = Math.sin(k * Math.PI) * 40);
  const lp = larryPos();
  burst(lp.x, lp.y - 100 * lp.s, ['#ffd25e', '#ffffff', '#b77aff', '#7aff9a'], 40, 300, { shape: 'star', grav: 200, size: 7 });
  await wait(600);
  run.stats.rooms++;
  const kind = battle.kind;
  let gold = kind === 'boss' ? ri(55, 70) : kind === 'elite' ? ri(25, 35) : ri(10, 17);
  if (hasItem('hat')) gold = Math.round(gold * 1.25);
  run.gold += gold;
  if (hasItem('cookie')) run.hp = Math.min(run.maxHp, run.hp + 4);
  battle = null;
  if (kind === 'boss') return bossReward(gold);
  rewardScreen(gold, kind);
}
async function defeat(){
  battle.phase = 'lost'; setPanelEnabled(false);
  sfx.lose();
  await tween(1, k => L.dead = ease(k));
  await wait(500);
  endRun(false);
}

/* =====================================================================
   DRAW THE BATTLE + AMBIENT BACKGROUNDS
   ===================================================================== */
const TORCHES = [.08, .92];
function drawStage(dt){
  const g = sx, F = FLOORS[run ? run.floor : 1];
  g.save();
  if (shake > 0) g.translate((Math.random() - .5) * shake * 16, (Math.random() - .5) * shake * 16);
  const wall = g.createLinearGradient(0, 0, 0, SH); wall.addColorStop(0, F.wall[0]); wall.addColorStop(1, F.wall[1]);
  g.fillStyle = wall; g.fillRect(-20, -20, SW + 40, SH + 40);
  // bricks
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1;
  const bh = 22, floorY = SH * .74;
  for (let y = 0, row = 0; y < floorY; y += bh, row++){ g.beginPath(); g.moveTo(0, y); g.lineTo(SW, y); g.stroke();
    for (let x = (row % 2) * 24; x < SW; x += 48){ g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + bh); g.stroke(); } }
  // floor
  const fl = g.createLinearGradient(0, floorY, 0, SH); fl.addColorStop(0, F.floor); fl.addColorStop(1, '#0d0820');
  g.fillStyle = fl; g.fillRect(0, floorY, SW, SH - floorY);
  g.strokeStyle = 'rgba(255,255,255,.05)';
  for (let i = -6; i <= 6; i++){ g.beginPath(); g.moveTo(SW / 2 + i * 40, floorY); g.lineTo(SW / 2 + i * 140, SH); g.stroke(); }
  // torches with glow + flame particles
  for (const tx of TORCHES){
    const x = SW * tx, y = SH * .3, flick = .8 + Math.sin(T * 13 + tx * 9) * .1 + Math.random() * .08;
    const glow = g.createRadialGradient(x, y, 4, x, y, 110 * flick); glow.addColorStop(0, 'rgba(255,170,70,.35)'); glow.addColorStop(1, 'rgba(255,170,70,0)');
    g.fillStyle = glow; g.fillRect(x - 120, y - 120, 240, 240);
    g.fillStyle = '#5b3a1c'; g.fillRect(x - 4, y + 4, 8, 26);
    g.fillStyle = '#ffb03a'; g.beginPath(); g.ellipse(x, y - 2, 7 * flick, 13 * flick, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff2b0'; g.beginPath(); g.ellipse(x, y + 1, 3.5, 7, 0, 0, Math.PI * 2); g.fill();
    if (Math.random() < dt * 14) parts.push({ x: x + (Math.random() - .5) * 6, y: y - 12, vx: (Math.random() - .5) * 10, vy: -40, t: 0, life: .6, c: '#ffcf6a', s: 2.5, g: -20, shape: 'sq', spin: 0 });
  }
  if (battle){
    // enemies (back to front)
    battle.enemies.forEach((en, i) => {
      if (en.dead && en.dying >= 1) return;
      const p = enemyPos(en), size = p.size * (1 - en.dying * .9), bob = Math.sin(T * 3 + i * 2) * 3 * (1 - en.dying);
      if (en.flashT > 0) en.flashT -= dt;
      g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(p.x, p.y, size * .42, size * .1, 0, 0, Math.PI * 2); g.fill();
      if (i === battle.target && !en.dead && ['choose', 'solve'].includes(battle.phase)){
        g.strokeStyle = 'rgba(255,210,94,.8)'; g.lineWidth = 3; g.beginPath(); g.ellipse(p.x, p.y, size * .5, size * .13, 0, 0, Math.PI * 2); g.stroke();
        g.fillStyle = '#ffd25e'; const ay = p.y - size * 1.45 - Math.abs(Math.sin(T * 5)) * 8;
        g.beginPath(); g.moveTo(p.x - 9, ay - 10); g.lineTo(p.x + 9, ay - 10); g.lineTo(p.x, ay); g.closePath(); g.fill();
      }
      g.save(); g.translate(p.x, p.y + bob); g.rotate(en.dying * 2.5); g.globalAlpha = 1 - en.dying;
      const spr = sprite(en.e, en.tint, en.flashT > 0);
      g.drawImage(spr, -size * .6, -size * 1.1, size * 1.2, size * 1.2);
      if (en.frozen > 0){ g.fillStyle = 'rgba(150,220,255,.35)'; g.fillRect(-size * .5, -size * 1.05, size, size); }
      if (en.blind > 0){   // stink haze from Fartos Plopem
        for (let k = 0; k < 4; k++){ const a = T * 1.5 + k * 1.6;
          g.fillStyle = `rgba(160,200,80,${.22 + Math.sin(T * 3 + k) * .06})`;
          g.beginPath(); g.arc(Math.cos(a) * size * .28, -size * .55 + Math.sin(a) * size * .18, size * .3, 0, Math.PI * 2); g.fill(); }
      }
      g.restore();
      if (!en.dead){
        const bw = Math.max(54, size * .9), by = p.y + 10;
        g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(p.x - bw / 2, by, bw, 8);
        g.fillStyle = '#ff5a6e'; g.fillRect(p.x - bw / 2 + 1, by + 1, (bw - 2) * clamp(en.dispHp / en.maxHp, 0, 1), 6);
        g.font = '700 12px Fredoka, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'top'; g.fillStyle = '#fff';
        g.fillText(`${Math.ceil(en.dispHp)}${en.dispBlock > 0 ? '  🛡️' + en.dispBlock : ''}`, p.x, by + 10);
        const it = intentText(en);
        if (it && battle.phase !== 'won'){
          g.font = '700 16px Fredoka, "Apple Color Emoji", system-ui, sans-serif'; g.textBaseline = 'middle';
          const tw = g.measureText(it).width + 14, iy = p.y - size * 1.2;
          g.fillStyle = 'rgba(20,10,40,.85)'; g.beginPath(); g.roundRect ? g.roundRect(p.x - tw / 2, iy - 13, tw, 26, 10) : g.rect(p.x - tw / 2, iy - 13, tw, 26); g.fill();
          g.fillStyle = en.intent.type === 'charge' ? '#ffd25e' : '#fff'; g.fillText(it, p.x, iy);
        }
      }
    });
    // Larry + shield bubble
    const lp = larryPos();
    drawLarry(g, lp.x, lp.y, lp.s, L, T);
    if (L.bubble > 0 && battle.block > 0){
      const r = 82 * lp.s * L.bubble, cy = lp.y - 62 * lp.s;
      const bgr = g.createRadialGradient(lp.x - r * .3, cy - r * .3, r * .1, lp.x, cy, r);
      bgr.addColorStop(0, 'rgba(255,255,255,.25)'); bgr.addColorStop(.8, 'rgba(120,200,255,.12)'); bgr.addColorStop(1, 'rgba(160,220,255,.5)');
      g.fillStyle = bgr; g.beginPath(); g.arc(lp.x, cy, r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = `rgba(200,240,255,${.5 + Math.sin(T * 4) * .2})`; g.lineWidth = 2; g.stroke();
    }
  }
  drawFxLayer(g);
  if (flash){ g.globalAlpha = Math.max(0, flash.a); g.fillStyle = flash.color; g.fillRect(-20, -20, SW + 40, SH + 40); g.globalAlpha = 1; }
  // vignette
  const vg = g.createRadialGradient(SW / 2, SH / 2, SH * .3, SW / 2, SH / 2, SH * .9); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = vg; g.fillRect(-20, -20, SW + 40, SH + 40);
  g.restore();
}

// Ambient background for menus: stars, floating candles, and a big Larry on the title screen.
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, tw: Math.random() * 6 }));
const CANDLES = Array.from({ length: 7 }, (_, i) => ({ x: .08 + i * .14 + Math.random() * .04, y: .1 + Math.random() * .35, ph: Math.random() * 6 }));
function drawBg(){
  const g = bgx;
  const gr = g.createLinearGradient(0, 0, 0, BH); gr.addColorStop(0, '#1d1145'); gr.addColorStop(1, '#0b0620');
  g.fillStyle = gr; g.fillRect(0, 0, BW, BH);
  for (const s of STARS){ g.globalAlpha = .35 + .65 * Math.abs(Math.sin(T * 1.2 + s.tw)); g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x * BW, s.y * BH, s.r, 0, Math.PI * 2); g.fill(); }
  g.globalAlpha = 1;
  for (const c of CANDLES){
    const x = c.x * BW, y = c.y * BH + Math.sin(T * 1.1 + c.ph) * 10, fl = .85 + Math.random() * .15;
    const glow = g.createRadialGradient(x, y - 18, 2, x, y - 18, 40); glow.addColorStop(0, 'rgba(255,190,90,.35)'); glow.addColorStop(1, 'rgba(255,190,90,0)');
    g.fillStyle = glow; g.fillRect(x - 40, y - 60, 80, 80);
    g.fillStyle = '#f2e6c8'; g.fillRect(x - 5, y - 10, 10, 30);
    g.fillStyle = '#ffb03a'; g.beginPath(); g.ellipse(x, y - 17, 4 * fl, 8 * fl, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff2b0'; g.beginPath(); g.ellipse(x, y - 15, 2, 4, 0, 0, Math.PI * 2); g.fill();
  }
  if (screen === 'title'){
    const s = Math.min(BW / 390, BH / 700) * 1.55, x = BW / 2 - 10 * s, y = Math.min(BH * .3, 260) + 10 + (document.body.classList.contains('in-arcade') ? 20 : 0);
    const st = { ...L, cast: .55 + Math.sin(T * 2) * .45, squash: 0, hurt: 0, goo: 0, offX: 0, jump: 0, dead: 0 };
    drawLarry(g, x, y, s, st, T);
    if (Math.random() < .5){ const a = lerp(.5, -1.9, st.cast); parts.push({ x: x + s * (9 + Math.cos(a) * 48), y: y + s * (-52 + Math.sin(a) * 48), vx: (Math.random() - .5) * 60, vy: -30 - Math.random() * 50, t: 0, life: .9, c: pick(['#fff8c0', '#ffd25e', '#b77aff']), s: 6, g: 30, shape: 'star', spin: Math.random() * 6 }); }
    drawFxLayer(g);
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt;
  updateFx(dt);
  if (screen === 'battle') drawStage(dt); else drawBg();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================================
   DOORS (room choice)
   ===================================================================== */
function genDoors(){
  const r = run.room + 1;
  if (r === ROOMS) return ['boss'];
  const w = { battle: 5, mystery: 2 };
  if (r >= 2){ w.treasure = 1; if (!run.shopUsed) w.shop = 1.6; }
  if (r >= 3){ w.elite = 1.6; w.rest = 1.5; }
  const n = r === 1 ? 2 : 3, out = r === 1 ? ['battle'] : [];
  if (r === ROOMS - 1 && !out.includes('rest')) out.push('rest');
  let guard = 0;
  while (out.length < n && guard++ < 50){
    let tot = 0; for (const k in w) if (!out.includes(k)) tot += w[k];
    let roll = Math.random() * tot;
    for (const k in w){ if (out.includes(k)) continue; if ((roll -= w[k]) < 0){ out.push(k); break; } }
  }
  return shuf(out);
}
function showDoors(){
  if (!run.doors) run.doors = genDoors();
  saveRun();
  show('doors'); renderHud();
  $('floorName').textContent = `Floor ${run.floor}: ${FLOORS[run.floor].name}`;
  $('doorHint').textContent = run.room + 1 === ROOMS ? 'The boss awaits…' : 'Choose a door';
  $('dots').innerHTML = Array.from({ length: ROOMS }, (_, i) => `<i class="${i < run.room ? 'done' : i === run.room ? 'now' : ''}${i === ROOMS - 1 ? ' boss' : ''}"></i>`).join('');
  $('doorRow').innerHTML = run.doors.map((d, i) => {
    const D = DOOR_INFO[d];
    return `<button class="door ${d}" data-i="${i}" style="--glow:${D.glow}"><div class="doorFrame"><div class="leaf"><div class="di">${D.icon}</div></div></div><div class="dl">${D.label}</div><div class="ds">${D.sub}</div></button>`;
  }).join('');
}
$('doorRow').addEventListener('click', async e => {
  const b = e.target.closest('.door'); if (!b || $('doorRow').dataset.busy) return;
  $('doorRow').dataset.busy = '1';
  sfx.door(); b.classList.add('open');
  await wait(750);
  delete $('doorRow').dataset.busy;
  const type = run.doors[+b.dataset.i];
  run.room++; run.doors = null;
  enterRoom(type);
});
function enterRoom(type){
  if (type === 'battle' || type === 'elite' || type === 'boss') return startBattle(type);
  if (type === 'treasure') return treasureRoom();
  if (type === 'shop') return shopRoom();
  if (type === 'rest') return restRoom();
  if (type === 'mystery') return mysteryRoom();
}
function nextRoom(){ run.stats.rooms += 0; saveRun(); showDoors(); }

/* =====================================================================
   ROOM SCREENS: rewards, treasure, shop, campfire, mystery
   ===================================================================== */
function roomScreen(html){ const r = $('room'); r.innerHTML = html; show('room'); r.scrollTop = 0; renderHud(); return r; }
function cardHTML(icon, title, desc, extra = '', delay = 0){ return `<span class="ci">${icon}</span><span><div class="ct">${title}</div><div class="cx">${desc}</div></span>${extra}`; }
// Cards are one-tap choices: after the first tap the rest of the group ignores taps,
// unless the choice was backed out of (the handler returns false). Shop cards pass multi.
function addCard(container, icon, title, desc, onClick, opts = {}){
  const c = document.createElement('button'); c.className = 'card'; c.innerHTML = cardHTML(icon, title, desc, opts.price ? `<span class="price">🪙 ${opts.price}</span>` : '');
  c.style.animationDelay = (opts.delay || 0) + 's'; if (opts.disabled) c.disabled = true;
  c.onclick = async () => {
    if (!opts.multi){ if (container.dataset.locked) return; container.dataset.locked = '1'; }
    sfx.click();
    const r = await onClick(c);
    if (r === false) delete container.dataset.locked;
  };
  container.appendChild(c); return c;
}

async function learnSpell(id){
  if (run.spells.length < 4){ run.spells.push({ id, lvl: 0 }); toast(`${SPELLS[id].icon} Learned ${SPELLS[id].name}!`); return true; }
  const S = SPELLS[id];
  const choice = await modal(`<div class="h2">Spellbook full!</div><p class="lead">Forget a spell to learn ${S.icon} ${S.name}?</p>`,
    [...run.spells.map((s, i) => ({ label: `${SPELLS[s.id].icon} Forget ${SPELLS[s.id].name}`, value: i, cls: 'btn ghost' })), { label: 'Keep my spells', value: -1 }]);
  if (choice < 0) return false;
  run.spells[choice] = { id, lvl: 0 }; toast(`${S.icon} Learned ${S.name}!`); return true;
}
async function upgradeSpellPicker(title){
  const choice = await modal(`<div class="h2">${title}</div><p class="lead">Upgraded spells are 30% stronger.</p>`,
    [...run.spells.map((s, i) => ({ label: `${SPELLS[s.id].icon} ${SPELLS[s.id].name}${s.lvl ? ' +' + s.lvl : ''} → +${s.lvl + 1}`, value: i, cls: 'btn ghost' })), { label: 'Never mind', value: -1 }]);
  if (choice < 0) return false;
  run.spells[choice].lvl++; toast(`📖 ${SPELLS[run.spells[choice].id].name} is now +${run.spells[choice].lvl}!`); return true;
}

function rewardScreen(gold, kind){
  sfx.coin();
  const r = roomScreen(`<div class="h2">Victory!</div><div class="goldPop">+${gold} 🪙</div><p class="lead">${kind === 'elite' ? 'The tough monster dropped a magic item! Pick one:' : 'Choose your reward:'}</p><div class="cards" id="rc"></div><button class="btn ghost" id="skipBtn" style="margin-top:6px">Skip</button>`);
  const rc = r.querySelector('#rc');
  const done = () => nextRoom();
  if (kind === 'elite'){
    randomItems(3).forEach((id, i) => addCard(rc, ITEMS[id].icon, ITEMS[id].name, ITEMS[id].desc, () => { grantItem(id); toast(`${ITEMS[id].icon} Got ${ITEMS[id].name}!`); done(); }, { delay: i * .08 }));
  } else {
    const sp = newSpellChoices(1)[0];
    if (sp) addCard(rc, SPELLS[sp].icon, `New spell: ${SPELLS[sp].name}`, `${SPELLS[sp].desc} (${'★'.repeat(SPELLS[sp].tier)} problems)`, async () => { if (await learnSpell(sp)) done(); else return false; }, { delay: 0 });
    else addCard(rc, '📖', 'Study', 'Upgrade one of your spells', async () => { if (await upgradeSpellPicker('Upgrade a spell')) done(); else return false; });
    addCard(rc, '🧪', 'Healing Potion', run.potions >= 3 ? 'Your potion belt is full (3)' : `Drink in battle to heal ${hasItem('bottle') ? 20 : 12}`, () => { run.potions++; done(); }, { delay: .08, disabled: run.potions >= 3 });
    if (Math.random() < .3){ const it = randomItems(1)[0]; if (it) addCard(rc, ITEMS[it].icon, ITEMS[it].name, ITEMS[it].desc, () => { grantItem(it); done(); }, { delay: .16 }); }
    else addCard(rc, '💰', 'Bag of Gold', '+20 gold', () => { run.gold += 20; sfx.coin(); done(); }, { delay: .16 });
  }
  r.querySelector('#skipBtn').onclick = () => { sfx.click(); done(); };
}
function bossReward(gold){
  run.hp = run.maxHp;
  if (run.floor === 3) return endRun(true);
  const r = roomScreen(`<div class="eventArt">👑</div><div class="h2">Boss defeated!</div><div class="goldPop">+${gold} 🪙 · Health fully restored</div><p class="lead">Pick a magic item for the road:</p><div class="cards" id="rc"></div>`);
  const rc = r.querySelector('#rc');
  randomItems(3).forEach((id, i) => addCard(rc, ITEMS[id].icon, ITEMS[id].name, ITEMS[id].desc, () => {
    grantItem(id); run.floor++; run.room = 0; run.shopUsed = false; run.doors = null; saveRun();
    floorBanner(); setTimeout(showDoors, 1200);
  }, { delay: i * .08 }));
}
function floorBanner(){
  const b = $('floorBanner');
  b.innerHTML = `<div class="small">FLOOR ${run.floor}</div><div class="h1" style="font-size:clamp(28px,9vw,44px)">${FLOORS[run.floor].name}</div>`;
  b.classList.remove('on'); void b.offsetWidth; b.classList.add('on'); sfx.door();
  setTimeout(() => b.classList.remove('on'), 2400);
}
function treasureRoom(){
  const gold = ri(25, 40) + run.floor * 5, it = randomItems(1)[0];
  run.gold += gold; if (it) grantItem(it); sfx.coin(); setTimeout(sfx.win, 200);
  const r = roomScreen(`<div class="eventArt">🎁</div><div class="h2">Treasure!</div><div class="goldPop">+${gold} 🪙</div>
    ${it ? `<div class="cards"><div class="card">${cardHTML(ITEMS[it].icon, ITEMS[it].name, ITEMS[it].desc)}</div></div>` : ''}<button class="btn" id="go">Onward ▶</button>`);
  r.querySelector('#go').onclick = () => { sfx.click(); nextRoom(); };
}
function shopRoom(){
  run.shopUsed = true;
  const offers = [{ type: 'potion', price: 15 }];
  const sp = newSpellChoices(1)[0]; if (sp) offers.push({ type: 'spell', id: sp, price: 45 });
  offers.push({ type: 'upgrade', price: 35 });
  randomItems(2).forEach(id => offers.push({ type: 'item', id, price: 55 }));
  const render = () => {
    const r = roomScreen(`<div class="eventArt">🧙‍♀️</div><div class="h2">Madam Fizzwick's Shop</div><p class="lead">"Spend wisely, young wizard!"</p><div class="cards" id="sc"></div><button class="btn ghost" id="leave">Leave shop ▶</button>`);
    const sc = r.querySelector('#sc');
    offers.forEach((o, i) => {
      if (o.sold) return;
      const can = run.gold >= o.price;
      if (o.type === 'potion') addCard(sc, '🧪', 'Healing Potion', run.potions >= 3 ? 'Potion belt full' : 'Heal in battle', () => { run.gold -= o.price; run.potions++; sfx.coin(); render(); }, { price: o.price, disabled: !can || run.potions >= 3, delay: i * .05, multi: true });
      if (o.type === 'spell') addCard(sc, SPELLS[o.id].icon, SPELLS[o.id].name, `${SPELLS[o.id].desc} (${'★'.repeat(SPELLS[o.id].tier)})`, async () => { if (await learnSpell(o.id)){ run.gold -= o.price; o.sold = true; sfx.coin(); } render(); }, { price: o.price, disabled: !can, delay: i * .05, multi: true });
      if (o.type === 'upgrade') addCard(sc, '📖', 'Spell Lesson', 'Upgrade one spell (+30%)', async () => { if (await upgradeSpellPicker('Which spell?')){ run.gold -= o.price; o.sold = true; sfx.coin(); } render(); }, { price: o.price, disabled: !can, delay: i * .05, multi: true });
      if (o.type === 'item') addCard(sc, ITEMS[o.id].icon, ITEMS[o.id].name, ITEMS[o.id].desc, () => { run.gold -= o.price; o.sold = true; grantItem(o.id); sfx.coin(); render(); }, { price: o.price, disabled: !can, delay: i * .05, multi: true });
    });
    r.querySelector('#leave').onclick = () => { sfx.click(); nextRoom(); };
  };
  render();
}
function restRoom(){
  const heal = Math.round(run.maxHp * .35);
  const r = roomScreen(`<div class="eventArt">🔥</div><div class="h2">Campfire</div><p class="lead">The fire crackles. Take a breather.</p><div class="cards" id="cc"></div>`);
  const cc = r.querySelector('#cc');
  addCard(cc, '😴', 'Nap', `Heal ${heal} health`, () => { run.hp = Math.min(run.maxHp, run.hp + heal); sfx.heal(); toast(`+${heal} ❤️`); nextRoom(); });
  addCard(cc, '📖', 'Study', 'Upgrade one spell (+30%)', async () => { if (await upgradeSpellPicker('Study which spell?')) nextRoom(); else return false; }, { delay: .08 });
}

// A small inline problem used by mystery rooms.
function askProblem(container, tier){
  return new Promise(res => {
    const P = genProblem(run.grade, tier);
    const box = document.createElement('div'); box.className = 'miniQ';
    box.innerHTML = `<div id="qText" style="font-size:clamp(28px,9vw,40px);color:var(--gold);font-weight:700;margin:8px 0">${P.q} = ?</div><div class="opts">${P.opts.map(o => `<button class="opt" data-v="${o}">${o}</button>`).join('')}</div>`;
    container.appendChild(box);
    box.querySelector('.opts').addEventListener('click', async e => {
      const b = e.target.closest('.opt'); if (!b || box.dataset.done) return; box.dataset.done = 1;
      const ok = b.dataset.v === P.ans; run.stats.attempts++;
      if (ok){ run.stats.correct++; b.classList.add('good'); sfx.zap(); }
      else { b.classList.add('bad'); box.querySelectorAll('.opt').forEach(x => { if (x.dataset.v === P.ans) x.classList.add('reveal'); }); sfx.plop();
             const m = run.misses[P.q] || (run.misses[P.q] = { q: P.q, ans: P.ans, opts: P.opts, tier, grade: run.grade, n: 0 }); m.n = Math.min(3, m.n + 1); }
      await wait(ok ? 600 : 1300);
      res(ok);
    });
  });
}
function mysteryRoom(){
  const ev = pick(['door', 'cauldron', 'quiz']);
  if (ev === 'door'){
    const r = roomScreen(`<div class="eventArt">🚪</div><div class="h2">The Grumpy Door</div><p class="lead">"Nobody gets my treasure without answering my riddle!" it grumbles.</p><div id="q"></div>`);
    askProblem(r.querySelector('#q'), 3).then(ok => {
      if (ok){ run.gold += 30; run.potions = Math.min(3, run.potions + 1); sfx.win(); }
      else run.hp = Math.max(1, run.hp - 4);
      const done = roomScreen(`<div class="eventArt">${ok ? '😮' : '😤'}</div><div class="h2">${ok ? 'The door swings open!' : 'PLOP!'}</div><p class="lead">${ok ? 'You found +30 🪙 and a potion!' : 'The door sneezes goo on you. -4 health.'}</p><button class="btn" id="go">Onward ▶</button>`);
      done.querySelector('#go').onclick = () => { sfx.click(); nextRoom(); };
    });
  } else if (ev === 'cauldron'){
    const r = roomScreen(`<div class="eventArt">🫕</div><div class="h2">Bubbling Cauldron</div><p class="lead">A mysterious cauldron bubbles. It smells like strawberries… and socks.</p><div class="cards" id="cc"></div>`);
    const cc = r.querySelector('#cc');
    addCard(cc, '🥄', 'Take a sip', '50% heal 15, 50% lose 6', () => {
      const good = Math.random() < .5;
      if (good){ run.hp = Math.min(run.maxHp, run.hp + 15); sfx.heal(); } else { run.hp = Math.max(1, run.hp - 6); sfx.plop(); }
      const d = roomScreen(`<div class="eventArt">${good ? '😋' : '🤢'}</div><div class="h2">${good ? 'Delicious!' : 'Bleh! PLOP!'}</div><p class="lead">${good ? '+15 health' : '-6 health'}</p><button class="btn" id="go">Onward ▶</button>`);
      d.querySelector('#go').onclick = () => { sfx.click(); nextRoom(); };
    });
    addCard(cc, '🚶', 'Walk away', 'Better safe than sorry', () => nextRoom(), { delay: .08 });
  } else {
    let score = 0, n = 0;
    const r = roomScreen(`<div class="eventArt">🦉</div><div class="h2">Professor Hootwhistle's Pop Quiz!</div><p class="lead">"Three questions! 10 gold for each one you get right!"</p><div class="small" id="qn">Question 1 of 3</div><div id="q"></div>`);
    const askNext = () => {
      const q = r.querySelector('#q'); q.innerHTML = '';
      r.querySelector('#qn').textContent = `Question ${n + 1} of 3`;
      askProblem(q, 2).then(ok => {
        n++; if (ok) score++;
        if (n < 3) return askNext();
        run.gold += score * 10; let bonus = '';
        if (score === 3){ const it = randomItems(1)[0]; if (it){ grantItem(it); bonus = `<div class="cards"><div class="card">${cardHTML(ITEMS[it].icon, ITEMS[it].name, ITEMS[it].desc)}</div></div>`; } }
        sfx.win();
        const d = roomScreen(`<div class="eventArt">🦉</div><div class="h2">${score}/3 correct!</div><div class="goldPop">+${score * 10} 🪙</div>${score === 3 ? '<p class="lead">"A perfect score! Take this!"</p>' : ''}${bonus}<button class="btn" id="go">Onward ▶</button>`);
        d.querySelector('#go').onclick = () => { sfx.click(); nextRoom(); };
      });
    };
    askNext();
  }
}

/* ---- potions ---- */
$('potBtn').onclick = async () => {
  if (!battle || battle.phase !== 'choose' || run.potions <= 0) return;
  run.potions--; const amt = hasItem('bottle') ? 20 : 12, before = run.hp; run.hp = Math.min(run.maxHp, run.hp + amt);
  sfx.potion(); const lp = larryPos();
  burst(lp.x, lp.y - 60 * lp.s, ['#7aff9a', '#c8ffd4', '#ffffff'], 20, 160, { up: true, grav: -60, shape: 'star' });
  float(`+${run.hp - before} ❤️`, lp.x, lp.y - 150 * lp.s, '#7aff9a', 26);
  battle.dispHp = run.hp; renderHud();
};

/* =====================================================================
   END OF RUN
   ===================================================================== */
function endRun(won){
  const st = run.stats, acc = st.attempts ? Math.round(st.correct / st.attempts * 100) : 0;
  const best = lsGet('larry_best') || { floor: 0, room: 0, wins: 0 };
  if (won) best.wins++;
  if (run.floor > best.floor || (run.floor === best.floor && run.room > best.room)){ best.floor = run.floor; best.room = run.room; }
  lsSet('larry_best', best); lsDel('larry_run');
  const misses = Object.values(run.misses).sort((a, b) => b.n - a.n).slice(0, 8);
  if (won) sfx.win();
  const e = $('end');
  e.innerHTML = `<div class="eventArt">${won ? '🏆' : '💚'}</div>
    <div class="h1" style="font-size:clamp(28px,9vw,44px)">${won ? 'You beat Lord Moldysock!' : 'Larry got plopped!'}</div>
    <p class="lead">${won ? 'The Dungeon of Numbers is safe, thanks to your math magic!' : `You made it to Floor ${run.floor}, Room ${run.room}. Every wizard gets plopped sometimes. Try again!`}</p>
    <div class="stat">🎯 <b>${acc}%</b> correct · 🔥 best streak <b>${st.best}</b></div>
    <div class="stat">👾 <b>${st.defeated}</b> monsters · 🪙 <b>${run.gold}</b> gold</div>
    ${misses.length ? `<div class="small">Spells to practise (they'll come up again):</div><div class="facts">${misses.map(m => `<span>${m.q} = ${m.ans}</span>`).join('')}</div>` : '<div class="small">No mistakes. Wizard-level math!</div>'}
    <button class="btn" id="againBtn">✨ New run</button><button class="btn ghost" id="titleBtn">Title screen</button>`;
  show('end');
  e.querySelector('#againBtn').onclick = () => { sfx.click(); startRun(); };
  e.querySelector('#titleBtn').onclick = () => { sfx.click(); goTitle(); };
  run = null; battle = null;
}

/* =====================================================================
   TITLE
   ===================================================================== */
const GRADES = ['K', '1', '2', '3', '4', '5', '6', '7', '8'];
GRADES.forEach((label, i) => {
  const b = document.createElement('button'); b.className = 'grade' + (i === grade ? ' sel' : ''); b.textContent = label;
  b.onclick = () => { grade = i; lsSet('larry_grade', i); sfx.click(); document.querySelectorAll('.grade').forEach((x, j) => x.classList.toggle('sel', j === i)); };
  $('grades').appendChild(b);
});
function goTitle(){
  const saved = lsGet('larry_run'), best = lsGet('larry_best');
  $('continueBtn').hidden = !saved;
  if (saved) $('continueBtn').textContent = `▶ Continue (Floor ${saved.floor}, Room ${saved.room}/${ROOMS})`;
  $('bestText').textContent = best ? `🏆 Best: Floor ${best.floor}, Room ${best.room}${best.wins ? ` · Wins: ${best.wins}` : ''}` : '';
  show('title');
}
function startRun(){
  if (lsGet('larry_run') && !confirm('Start a new run? Your saved run will be lost.')) return;
  lsDel('larry_run'); newRun(); floorBanner(); setTimeout(showDoors, 900);
}
$('newBtn').onclick = () => { sfx.click(); startRun(); };
$('continueBtn').onclick = () => { sfx.click(); run = lsGet('larry_run'); if (run){ grade = run.grade; showDoors(); } };
goTitle();

// Hook for automated testing; unused in normal play.
window.__larry = { get run(){ return run; }, get battle(){ return battle; }, genProblem, SPELLS, ENEMIES, startBattle, newRun: () => newRun(), showDoors };
</script>
