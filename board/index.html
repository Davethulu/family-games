<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Family Board</title>
<style>
:root {
  --bg: #111a2c; --panel: #1b2a41; --panel2: #24364f; --line: #3a4f6d;
  --ink: #f7f3e8; --muted: #a9b8cc; --mint: #9fe3bf; --blue: #a8c7ff;
  --orange: #ffc27a; --pink: #ff8fa8; --gold: #ffd95e;
}
* { box-sizing: border-box; }
html { font-size: .625vw; background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--bg);
  font-family: "Trebuchet MS", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hide { display: none !important; }

/* ---------- TV view: every size is in rem, and rem is fitted to the browser's real space ---------- */
#tv { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden;
  display: flex; flex-direction: column; padding: 2.5rem 3.5rem; }
.tv-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.8rem; }
.tv-date { font-size: 4.2rem; font-weight: 700; }
.tv-clock { font-size: 4.2rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.tv-main { display: flex; flex: 1; min-height: 0; margin-bottom: 1.8rem; }
.hero { flex: 1.25; min-width: 0; margin-right: 1.8rem; background: var(--panel); border-radius: 2rem;
  padding: 2.4rem 3rem; display: flex; flex-direction: column; }
.hero-label { font-size: 3.4rem; font-weight: 700; color: var(--mint); }
.hero-count { font-size: 15.5rem; line-height: 1.08; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero.soon .hero-label, .hero.soon .hero-count { color: var(--orange); }
.hero.now .hero-label, .hero.now .hero-count { color: var(--pink); }
.hero-sub { font-size: 2.3rem; color: var(--muted); }
.stops { display: flex; margin-top: auto; padding-top: 1.4rem; }
.stop { flex: 1; min-width: 0; padding: 1rem 1.1rem; margin-right: .8rem; border-radius: 1.1rem; background: var(--panel2); }
.stop:last-child { margin-right: 0; }
.stop b { display: block; font-size: 2.3rem; font-variant-numeric: tabular-nums; }
.stop span { display: block; font-size: 1.55rem; color: var(--muted); line-height: 1.2; }
.stop.past { opacity: .4; }
.stop.next { background: var(--mint); color: var(--panel); }
.stop.next span { color: var(--panel); }

.kids { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kid { flex: 1; min-height: 0; background: var(--panel); border-radius: 2rem; padding: 1.5rem 2.2rem; margin-bottom: 1.8rem;
  display: flex; flex-direction: column; justify-content: center; }
.kid:last-child { margin-bottom: 0; }
.kid-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .6rem; }
.kid-name { font-size: 3.2rem; font-weight: 700; }
.kid-total { font-size: 5rem; font-weight: 700; color: var(--mint); font-variant-numeric: tabular-nums; }
.kid-total small { font-size: 2rem; color: var(--muted); font-weight: 400; }
.block { display: flex; align-items: center; margin-top: .55rem; }
.block-name { width: 13.5rem; font-size: 1.9rem; color: var(--muted); }
.block-track { flex: 1; height: 1.9rem; border-radius: 1rem; background: var(--panel2); overflow: hidden; }
.block-fill { height: 100%; background: var(--blue); border-radius: 1rem; }
.block-min { width: 8rem; text-align: right; font-size: 2.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kid-note { font-size: 1.6rem; color: var(--orange); margin-top: .5rem; }

.tv-bottom { display: flex; height: 21rem; flex-shrink: 0; }
.cal { flex: 1; min-width: 0; background: var(--panel); border-radius: 2rem; padding: 1.5rem 2.2rem; overflow: hidden; }
.cal h2 { margin: 0 0 .6rem; font-size: 2.2rem; color: var(--gold); }
.cal-list { display: flex; flex-wrap: wrap; }
.cal-col { width: 50%; min-width: 0; padding-right: 1.5rem; }
.ev { height: 2.6rem; display: flex; align-items: baseline; font-size: 1.8rem; white-space: nowrap; }
.ev-when { flex-shrink: 0; width: 9.5rem; font-weight: 700; color: var(--mint); font-size: 1.65rem; }
.ev-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ev-date { color: var(--muted); font-size: 1.4rem; margin-left: .8rem; flex-shrink: 0; }
.empty { color: var(--muted); font-size: 2rem; }
.side { width: 33rem; margin-left: 1.8rem; display: flex; flex-direction: column; flex-shrink: 0; }
.player { flex: 1; min-height: 0; border-radius: 1.4rem; overflow: hidden; background: var(--panel); margin-bottom: 1rem;
  display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.9rem; color: var(--muted); padding: 0; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.tv-btns { display: flex; }
.tv-btn { flex: 1; padding: .8rem; font-size: 1.9rem; font-weight: 700; border-radius: 1rem; border: .3rem solid transparent;
  background: var(--panel2); margin-right: .8rem; }
.tv-btn:last-child { margin-right: 0; }
.status { position: absolute; left: 50%; top: .6rem; transform: translateX(-50%); font-size: 1.5rem; color: var(--orange); }
#tv button:focus { outline: none; border-color: var(--gold); background: var(--gold); color: var(--panel); }

/* ---------- Switching feeds: a chosen panel grows to fill the screen ---------- */
.feed-tag, .fx { display: none; }
.feedbox { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 1rem; }
.feedbox .player { margin-bottom: 0; }
#camBack { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 4; }
.cam-big { position: relative; z-index: 5; transform-origin: 0 0; }
.tv-btns { position: relative; z-index: 6; }

/* ---------- Theme: Security Office. Only cheap effects, since TV processors are slow. ---------- */
#tv.theme-office { --bg: #020504; --panel: #07100c; --panel2: #10211a; --line: #1f4a35;
  --ink: #d9ffe9; --muted: #7fb79a; --mint: #5dffa0; --blue: #5dffa0; --orange: #ffc83d; --pink: #ff4b62; --gold: #ffc83d;
  background: var(--bg); font-family: "Courier New", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.theme-office .hero, .theme-office .kid, .theme-office .cal, .theme-office .feedbox {
  position: relative; overflow: hidden; border-radius: .4rem; border: .25rem solid var(--line); background: var(--panel); }
.theme-office .hero { padding-top: 4.6rem; }
.theme-office .kid { padding-top: 4.2rem; }
.theme-office .cal { padding-top: 4.2rem; }
.theme-office .cal h2 { display: none; }
.theme-office .player { border-radius: 0; background: #000; }
.block-name, .block-min, .ev-when, .tv-btn { white-space: nowrap; }
.theme-office .block-name { width: 15.5rem; }
.theme-office .block-min { width: 9.5rem; }
.theme-office .ev-when { width: 11rem; font-size: 1.55rem; }
.theme-office .ev { font-size: 1.6rem; }
.theme-office .ev-date { font-size: 1.25rem; }
.theme-office .tv-btn { font-size: 1.55rem; padding: .8rem .2rem; }
.theme-office .stop, .theme-office .tv-btn { border-radius: .3rem; }
.theme-office .block-track, .theme-office .block-fill { border-radius: 0; }
.theme-office .hero-count { color: var(--mint); text-shadow: 0 0 2rem rgba(93,255,160,.55); animation: jitter 7s infinite; }
.theme-office .hero.soon .hero-count { color: var(--orange); text-shadow: 0 0 2rem rgba(255,200,61,.55); }
.theme-office .hero.now .hero-count { color: var(--pink); text-shadow: 0 0 2rem rgba(255,75,98,.65); }
.theme-office .feed-tag { display: flex; justify-content: space-between; position: absolute; left: 0; right: 0; top: 0; z-index: 3;
  padding: .6rem 1.2rem; font-size: 1.9rem; color: var(--mint); background: rgba(0,0,0,.55); }
.theme-office .feedbox .feed-tag { position: static; flex-shrink: 0; padding: .3rem .8rem; font-size: 1.5rem; }
.theme-office .rec { color: var(--pink); animation: rec 2s steps(1) infinite; }
.theme-office .fx { display: block; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 2; overflow: hidden; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) .12rem, transparent .12rem, transparent .4rem);
  animation: flicker 6s infinite; }
.theme-office .fx::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18%;
  background: rgba(190,255,220,.07); animation: roll 8s linear infinite; }
.theme-office .kid:nth-of-type(2) .fx::after { animation-duration: 11s; animation-delay: -4s; }
.theme-office .cal .fx::after { animation-duration: 13s; animation-delay: -7s; }
#tv.switching .fx { background: repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0, rgba(255,255,255,.4) .3rem, rgba(0,0,0,.7) .3rem, rgba(0,0,0,.7) .7rem); }
@keyframes rec { 0% { opacity: 1; } 50% { opacity: .15; } }
@keyframes roll { from { transform: translateY(-120%); } to { transform: translateY(620%); } }
@keyframes flicker { 0%, 93%, 100% { opacity: 1; } 94% { opacity: .55; } 96% { opacity: .9; } 97% { opacity: .6; } }
@keyframes jitter { 0%, 95%, 100% { transform: none; } 96% { transform: translateX(-.5rem); } 98% { transform: translateX(.4rem); } }

/* ---------- Compact countdown with its stops as a list, so the kids' cards get the room ---------- */
.hero { flex: .62; }
.kids { flex: 1; }
.hero-label { font-size: 2.8rem; }
.hero-count { font-size: 10rem; }
.hero-sub { font-size: 1.8rem; }
.stops { display: block; }
.stop { display: flex; align-items: center; justify-content: space-between; margin: 0 0 .6rem; padding: .55rem 1.2rem; }
.stop:last-child { margin-bottom: 0; }
.stop b { font-size: 2.4rem; }
.stop span { font-size: 1.9rem; }

/* ---------- Timers: each kid's card gets a tile while a timer is going ---------- */
.kid-row { display: flex; align-items: center; min-height: 0; }
.kid-main { flex: 1; min-width: 0; }
.kid-timer { flex-shrink: 0; width: 25rem; margin-left: 1.6rem; padding: 1rem 1rem .9rem; text-align: center; border-radius: 1rem; background: var(--panel2); border: .25rem solid var(--line); }
.t-label { font-size: 2rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-num { font-size: 5.8rem; line-height: 1.1; font-weight: 700; color: var(--mint); font-variant-numeric: tabular-nums; }
.t-track { height: 1rem; border-radius: .5rem; background: var(--panel); overflow: hidden; }
.t-fill { height: 100%; background: var(--mint); transition: width 1s linear; }
.kid-timer.soon .t-num { color: var(--orange); }
.kid-timer.soon .t-fill { background: var(--orange); }
.kid-timer.over { border-color: var(--pink); animation: tOver 1s ease-in-out infinite; }
.kid-timer.over .t-num { color: var(--pink); }
.kid-timer.paused { opacity: .65; }
@keyframes tOver { 0%, 100% { transform: none; } 50% { transform: scale(1.04); } }
.theme-harvest .t-num { font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif; }
.ed-time { font-weight: 700; color: var(--mint); margin-left: .4em; }
.ed-time.over { color: var(--pink); }
.sync-link { display: inline-block; margin-top: .7em; padding: .5em .9em; border-radius: .5em; background: var(--panel2); color: var(--ink); text-decoration: none; border: .15em solid transparent; }
.sync-link:focus { outline: none; border-color: var(--gold); }

/* ---------- Daily checklist on each kid's card ---------- */
.kid { position: relative; overflow: hidden; }
.kid-head { margin-bottom: .2rem; }
.kid-name { font-size: 2.9rem; }
.kid-total { font-size: 4.2rem; }
.kid-flag { margin-left: 1.2rem; padding: .2rem .9rem; font-size: 1.7rem; font-weight: 700; border-radius: .6rem; background: var(--gold); color: var(--panel); vertical-align: middle; }
.chips { display: flex; margin-top: .9rem; }
.chip { flex: 1; min-width: 0; margin-right: .7rem; padding: .4rem .6rem; border-radius: .8rem; background: var(--panel2); display: flex; align-items: center; height: 5.6rem; overflow: hidden; }
.chip:last-child { margin-right: 0; }
.chip-icon { width: 3.4rem; height: 3.4rem; flex-shrink: 0; margin-right: .4rem; display: flex; align-items: center; justify-content: center; }
.chip-ring { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: .25rem dashed var(--muted); opacity: .6; }
.chip-text { flex: 1; min-width: 0; max-height: 100%; overflow: hidden; font-size: 1.55rem; line-height: 1.12; color: var(--muted); }
.theme-office .kid { padding-top: 3.6rem; padding-bottom: .8rem; }
.chip.on { background: var(--mint); }
.chip.on .chip-text { color: var(--panel); font-weight: 700; }
.mascot { display: block; width: 100%; height: 100%; }
.pop { animation: pop .7s ease-out; }
.parade { position: absolute; left: 0; bottom: .5rem; width: 9rem; height: 9rem; z-index: 4; animation: parade 5s linear forwards; }
.hero { position: relative; }
.tv-banner { font-size: 2.6rem; font-weight: 700; display: flex; align-items: center; color: var(--gold); }
.tv-banner .mascot { width: 4.4rem; height: 4.4rem; margin-right: .8rem; }
.leaves { display: none; }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.35) rotate(8deg); } 100% { transform: none; } }
@keyframes parade { 0% { transform: translateX(-10rem); opacity: 1; } 95% { opacity: 1; } 100% { transform: translateX(62rem); opacity: 0; } }

/* ---------- Surprise scenes that play now and then. Everything here is removed when it ends. ---------- */
#fxStage { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 3; }
.fx-walker { position: absolute; left: -22rem; bottom: 1.5rem; width: 15rem; height: 15rem; animation: fxWalk 12s linear forwards; }
.fx-walker.fast { animation-duration: 4.5s; }
.fx-walker.roll { width: 10rem; height: 10rem; animation-duration: 9s; }
.fx-hop { width: 100%; height: 100%; animation: fxHop .7s ease-in-out infinite; }
.fast .fx-hop { animation-duration: .28s; }
.roll .fx-hop { animation: fxSpin 1.6s linear infinite; }
.fx-say { position: absolute; left: 8rem; bottom: 14rem; padding: .5rem 1.2rem; white-space: nowrap; font-size: 2.4rem; font-weight: 700; border-radius: 1rem; background: #fff; color: #2a1a10; }
.fx-clip { position: absolute; overflow: hidden; }
.fx-peek { position: absolute; left: 50%; bottom: 0; width: 18rem; height: 20rem; margin-left: -9rem; animation: fxPeek 5s ease-in-out forwards; }
.fx-alert { position: absolute; left: 0; right: 0; top: 4rem; text-align: center; font-size: 2.6rem; font-weight: 700; color: var(--pink); animation: rec .8s steps(1) infinite; }
.fx-lost { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 4rem; font-weight: 700; color: #fff;
  background: repeating-linear-gradient(0deg, #111 0, #111 .5rem, #444 .5rem, #444 .8rem); animation: flicker 1s infinite; }
.fx-dark { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; animation: fxDark 3.2s steps(1) forwards; }
.fx-eye { position: absolute; top: 44%; width: 4rem; height: 2.6rem; border-radius: 50%; background: #ffe45e; box-shadow: 0 0 2rem #ffe45e; animation: fxBlink 1.2s steps(1) infinite; }
.fx-gust { position: absolute; left: -6rem; width: 5rem; height: 5rem; animation: fxGust 5s linear forwards; }
.fx-star { position: absolute; left: 10%; top: 8%; width: 8rem; height: 8rem; animation: fxShoot 2.4s ease-in forwards; }
@keyframes fxWalk { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 30rem)); } }
@keyframes fxHop { 0%, 100% { transform: rotate(-5deg); } 50% { transform: translateY(-1.4rem) rotate(5deg); } }
@keyframes fxSpin { to { transform: rotate(360deg); } }
@keyframes fxPeek { 0% { transform: translateY(100%); } 18%, 80% { transform: translateY(12%); } 100% { transform: translateY(100%); } }
@keyframes fxDark { 0% { opacity: 1; } 8% { opacity: 0; } 14% { opacity: 1; } 20% { opacity: 0; } 28%, 94% { opacity: 1; } 100% { opacity: 0; } }
@keyframes fxBlink { 0%, 80% { transform: none; } 81% { transform: scaleY(.1); } }
@keyframes fxGust { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(calc(100vw + 12rem), 14rem) rotate(900deg); opacity: 1; } }
@keyframes fxShoot { 0% { transform: translate(0, 0) scale(.4); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(70vw, 34vh) scale(1); opacity: 0; } }
.fx-small { position: absolute; bottom: .4rem; left: -11rem; width: 10rem; height: 10rem; animation: fxScurry 5s linear forwards; }
.fx-spider { position: absolute; top: 0; width: 10rem; height: 26rem; animation: fxDrop 6s ease-in-out forwards; }
.fx-thread { position: absolute; left: 50%; top: 0; bottom: 8rem; width: .2rem; background: rgba(255,255,255,.75); }
.fx-spider .mascot { position: absolute; left: 0; bottom: 0; height: 10rem; }
.fx-flash { position: absolute; left: -150vw; top: -150vh; width: 300vw; height: 300vh; animation: fxSweep 6s ease-in-out forwards;
  background: radial-gradient(circle at center, rgba(255,250,200,.12) 0, rgba(255,250,200,.05) 12rem, rgba(0,0,0,.94) 21rem); }
.fx-tear { position: absolute; left: -4%; width: 108%; background: rgba(170,255,210,.16); animation: fxTear .5s steps(2) infinite; }
.fx-track { position: absolute; left: 0; right: 0; top: 42%; text-align: center; font-size: 5rem; font-weight: 700; color: #d9ffe9; animation: flicker .9s infinite; }
.fx-wave { position: absolute; right: -1.2rem; top: 5rem; width: 4rem; height: 6.5rem; background: #8f5f38; border-radius: 2rem; transform-origin: 50% 100%; animation: fxWave .55s ease-in-out infinite alternate; }
.fx-fly { position: absolute; left: -32rem; top: 5%; width: 28rem; height: 16rem; animation: fxWalk 13s linear forwards; }
.fx-bird { position: absolute; width: 6.5rem; height: 4rem; }
.fx-shadow { position: absolute; left: 18%; right: 18%; bottom: -.6rem; height: 1.3rem; border-radius: 50%; background: rgba(0,0,0,.28); }
.fx-say::after { content: ""; position: absolute; left: 1.8rem; bottom: -1rem; border-left: 1rem solid transparent; border-right: .3rem solid transparent; border-top: 1.1rem solid #fff; }
.fx-say { animation: fxSayIn .45s ease-out 1s backwards; box-shadow: 0 .3rem .8rem rgba(0,0,0,.3); }
.fx-feather { position: absolute; bottom: 8rem; width: 2.2rem; height: 4.4rem; animation: fxFeatherFall 2.6s ease-in both; }
.fx-speed { position: absolute; left: -9rem; top: 25%; width: 9rem; height: 50%; }
.fx-speed i { display: block; height: .35rem; margin: 1.3rem 0; background: rgba(255,255,255,.75); border-radius: 1rem; }
.fx-speed i:nth-child(2) { width: 70%; margin-left: 30%; }
.fx-box { position: absolute; left: -1rem; right: -1rem; top: -1rem; bottom: 0; border: .28rem dashed var(--pink); animation: rec .8s steps(1) infinite; }
.fx-lost { flex-direction: column; }
.fx-lost small { font-size: 2rem; margin-top: .5rem; font-weight: 400; }
.fx-bars { position: absolute; left: 0; right: 0; bottom: 0; height: 12%; display: flex; }
.fx-bars i { flex: 1; }
.fx-whisper { position: absolute; left: 0; right: 0; top: 58%; text-align: center; font-size: 3rem; color: #a9c9b6; animation: fxSayIn 1s ease-out .9s backwards; }
.fx-stand { position: absolute; left: 48%; top: 28%; width: 22rem; height: 28rem; }
.fx-letter { position: absolute; left: 4rem; top: 13.5rem; width: 7rem; height: 4.6rem; animation: fxLetter 13s linear forwards; }
.fx-twink { position: absolute; width: 1.8rem; height: 1.8rem; animation: fxTwink .9s ease-in-out infinite alternate; }
.bit.far { animation: fxBitFar 4.5s linear forwards; }

/* Moving body parts. The checklist's mascots don't use these, so they stay still. */
.a-blink { animation: aBlink 4s steps(1) infinite; }
.a-legA { animation: aSwing .7s ease-in-out infinite alternate; }
.a-legB { animation: aSwing .7s ease-in-out infinite alternate-reverse; }
.fast .a-legA, .fast .a-legB { animation-duration: .2s; }
.a-wig { animation: aWig 1.1s ease-in-out infinite alternate; }
.a-wigR { animation: aWig 1.1s ease-in-out infinite alternate-reverse; }
.a-flap { animation: aFlap .45s ease-in-out infinite alternate; }
.a-flapR { animation: aFlapR .45s ease-in-out infinite alternate; }
.a-fan { animation: aFan 2.4s ease-in-out infinite alternate; }
.a-flick { animation: aFlick .35s ease-in-out infinite alternate; }
.a-flame { animation: aFlame 2.2s ease-in-out infinite; }
.a-look { animation: aLook 3s ease-in-out infinite; }
.a-bub { animation: aBub 2s ease-in infinite; }
.a-pageL { animation: aFlap .32s ease-in-out infinite alternate; }
.a-pageR { animation: aFlapR .32s ease-in-out infinite alternate; }
.a-hopSm { animation: fxHop 1.2s ease-in-out infinite; }
@keyframes aBlink { 0%, 92%, 100% { transform: none; } 93%, 97% { transform: scaleY(.08); } }
@keyframes aSwing { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }
@keyframes aWig { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
@keyframes aFlap { from { transform: rotate(-22deg); } to { transform: rotate(24deg); } }
@keyframes aFlapR { from { transform: rotate(22deg); } to { transform: rotate(-24deg); } }
@keyframes aFan { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes aFlick { from { transform: scale(1, 1); opacity: .86; } to { transform: scale(.88, 1.14); opacity: 1; } }
@keyframes aFlame { 0%, 40%, 100% { transform: scale(0); } 50%, 80% { transform: scale(1.4); } }
@keyframes aLook { 0%, 30% { transform: translateX(-1.5px); } 45%, 75% { transform: translateX(1.5px); } 90%, 100% { transform: translateX(-1.5px); } }
@keyframes aBub { 0% { transform: translateY(6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-24px); opacity: 0; } }
@keyframes fxSayIn { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      var list = copyChannels();
      list.push({ id: id, text: name });
      put('channels', list);
      put('music', { source: 'lofi', video: id });
      ed.chanName = ''; ed.ytLink = '';
      toast('Added ' + name);
      forceEditor();
    },
    saveSetup: function () {
      var d = ed.draft;
      if (d.pin && !/^\d{4}$/.test(d.pin)) { toast('The PIN needs 4 digits', true); return; }
      d.blockMinutes = Math.max(15, parseInt(d.blockMinutes, 10) || 45);
      d.floor = Math.min(d.blockMinutes, Math.max(0, parseInt(d.floor, 10) || 0));
      if (d.checklistText !== undefined) {
        d.checklist = d.checklistText.split('\n').map(function (t) { return t.replace(/^\s+|\s+$/g, ''); }).filter(Boolean).slice(0, 6);
        delete d.checklistText;
      }
      put('settings', d);
      ed.draft = null;
      toast('Saved');
      forceEditor();
    }
  };
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
    if (!el || el === document) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-arg'));
  });
  function onInput(e) {
    var el = e.target, v = el.type === 'checkbox' ? el.checked : el.value;
    var draft = el.getAttribute && el.getAttribute('data-draft');
    if (draft) { ed[draft] = v; return; }
    var chan = el.getAttribute && el.getAttribute('data-chan');
    if (chan !== null && chan !== undefined) { ed.chanNames[chan] = v; return; }
    var key = el.getAttribute && el.getAttribute('data-setup');
    if (key && ed.draft) {
      if (key === 'kid0') ed.draft.kids[0] = v;
      else if (key === 'kid1') ed.draft.kids[1] = v;
      else if (key.indexOf('ready-') === 0) ed.draft.schedule[key.slice(6)].ready = v;
      else if (key.indexOf('out-') === 0) ed.draft.schedule[key.slice(4)].out = v;
      else ed.draft[key] = v;
      return;
    }
    if (el.getAttribute && el.getAttribute('data-input') === 'homework' && e.type === 'change') {
      put('homework/' + dateKey(new Date()), v || null);
      toast('Saved');
    }
  }
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);

  /* ---------- Remote control: arrows move between buttons, Back leaves the editor ---------- */
  function focusables() {
    var root = tvEditing ? $('editor') : ($('gate').className.indexOf('hide') < 0 ? $('gate') : $('editor').className.indexOf('hide') < 0 ? $('editor') : $('tv'));
    var all = root.querySelectorAll('button, input, select, textarea'), out = [], i;
    for (i = 0; i < all.length; i++) if (all[i].offsetWidth > 0 && !all[i].disabled) out.push(all[i]);
    return out;
  }
  function moveFocus(dir) {
    var list = focusables(), cur = document.activeElement, i;
    if (list.indexOf(cur) < 0) { if (list.length) list[0].focus(); return; }
    var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2, best = null, bestScore = 1e12;
    for (i = 0; i < list.length; i++) {
      if (list[i] === cur) continue;
      var b = list[i].getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var main = dir === 'left' ? a.left - b.right : dir === 'right' ? b.left - a.right : dir === 'up' ? a.top - b.bottom : b.top - a.bottom;
      if (main < -2) continue;
      var cross = dir === 'left' || dir === 'right' ? Math.abs(by - ay) : Math.abs(bx - ax);
      var score = main + cross * 2;
      if (score < bestScore) { bestScore = score; best = list[i]; }
    }
    if (best) { best.focus(); if (best.scrollIntoView) best.scrollIntoView({ block: 'nearest' }); }
  }
  document.addEventListener('keydown', function (e) {
    var dirs = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' }, dir = dirs[e.keyCode], t = e.target, tag = t && t.tagName;
    var typing = (tag === 'INPUT' && t.type !== 'checkbox') || tag === 'TEXTAREA';
    if (dir) {
      if (typing && (dir === 'left' || dir === 'right') && t.value) return;
      e.preventDefault();
      moveFocus(dir);
      return;
    }
    if (e.keyCode === 13 && tag === 'SELECT' && t.showPicker) { try { t.showPicker(); e.preventDefault(); } catch (err) {} return; }
    if (tvEditing && !pinOk && e.keyCode >= 48 && e.keyCode <= 57) { pinPress(String(e.keyCode - 48)); return; }
    // Escape, plus the Back codes used by LG (461) and Samsung (10009) remotes.
    var isBack = e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009 || e.keyCode === 8;
    if (tvEditing && !typing && isBack) {
      e.preventDefault();
      closeTvEditor();
    } else if (!tvEditing && camIndex >= 0 && isBack) {
      e.preventDefault();
      showCam(-1);
    }
  });

  /* ---------- Start up ---------- */
  function renderAll() {
    if ($('tv').className.indexOf('hide') < 0) { applyTheme(); renderKids(); renderCal(); renderMusic(); tick(); }
    renderEditor();
  }
  function showGate(message) {
    var g = $('gate');
    g.className = '';
    g.innerHTML = '<h1>Family Board</h1><p>' + esc(message) + '</p>' +
      '<label class="lab" for="codeBox">Family code</label><input id="codeBox" autocapitalize="off" autocomplete="off" spellcheck="false">' +
      '<button class="go" id="codeGo">Open board</button>';
    $('codeGo').onclick = function () {
      var v = $('codeBox').value.replace(/\s/g, '').toLowerCase();
      if (v) { store('code', v); code = v; g.className = 'hide'; begin(); }
    };
    $('codeBox').focus();
  }
  function badCode() {
    store('code', '');
    $('tv').className = 'hide'; $('editor').className = 'hide';
    clearInterval(pollTimer);
    showGate("That family code didn't work. Check it and try again.");
  }
  var pollTimer = null;
  if (DEMO) window.boardFx = { play: playFx, scenes: FX_SCENES, timeUp: fxTimeUp, celebrate: fxCelebrate, intro: playIntro };
  function begin() {
    if (EDIT_ONLY) { $('editor').className = ''; pruneLater = true; }
    else { $('tv').className = ''; fitTv(); window.addEventListener('resize', fitTv); $('btnMusic').focus(); }
    if (!DEMO) { try { data = JSON.parse(store('cache') || '{}') || {}; } catch (e) { data = {}; } }
    renderAll();
    poll();
    pollTimer = setInterval(poll, POLL_MS);
    setInterval(pollTimers, 4000);
    if (pruneLater) setTimeout(pruneOld, 5000);
  }
  var pruneLater = false;
  function start() {
    setInterval(tick, 1000);
    if (DEMO) { begin(); return; }
    if (!DB) { $('gate').className = ''; $('gate').innerHTML = '<h1>Family Board</h1><p>The shared database is not connected yet.</p>'; return; }
    var hash = location.hash.replace(/^#/, '').replace(/\s/g, '').toLowerCase();
    if (hash) store('code', hash);
    code = hash || store('code') || '';
    if (code) begin(); else showGate('Enter your family code. You only need to do this once on each device.');
  }
  start();
})();
</script>
