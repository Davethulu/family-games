<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Family Board</title>
<style>
:root {
  --bg: #111a2c; --panel: #1b2a41; --panel2: #24364f; --line: #3a4f6d;
  --ink: #f7f3e8; --muted: #a9b8cc; --mint: #9fe3bf; --blue: #a8c7ff;
  --orange: #ffc27a; --pink: #ff8fa8; --gold: #ffd95e;
}
* { box-sizing: border-box; }
html { font-size: .625vw; background: var(--bg); }
body { margin: 0; color: var(--ink); background: var(--bg);
  font-family: "Trebuchet MS", "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hide { display: none !important; }

/* ---------- TV view: every size is in rem, and rem is fitted to the browser's real space ---------- */
#tv { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden;
  display: flex; flex-direction: column; padding: 2.5rem 3.5rem; }
.tv-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.8rem; }
.tv-date { font-size: 4.2rem; font-weight: 700; }
.tv-clock { font-size: 4.2rem; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
.tv-main { display: flex; flex: 1; min-height: 0; margin-bottom: 1.8rem; }
.hero { flex: 1.25; min-width: 0; margin-right: 1.8rem; background: var(--panel); border-radius: 2rem;
  padding: 2.4rem 3rem; display: flex; flex-direction: column; }
.hero-label { font-size: 3.4rem; font-weight: 700; color: var(--mint); }
.hero-count { font-size: 15.5rem; line-height: 1.08; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero.soon .hero-label, .hero.soon .hero-count { color: var(--orange); }
.hero.now .hero-label, .hero.now .hero-count { color: var(--pink); }
.hero-sub { font-size: 2.3rem; color: var(--muted); }
.stops { display: flex; margin-top: auto; padding-top: 1.4rem; }
.stop { flex: 1; min-width: 0; padding: 1rem 1.1rem; margin-right: .8rem; border-radius: 1.1rem; background: var(--panel2); }
.stop:last-child { margin-right: 0; }
.stop b { display: block; font-size: 2.3rem; font-variant-numeric: tabular-nums; }
.stop span { display: block; font-size: 1.55rem; color: var(--muted); line-height: 1.2; }
.stop.past { opacity: .4; }
.stop.next { background: var(--mint); color: var(--panel); }
.stop.next span { color: var(--panel); }

.kids { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kid { flex: 1; min-height: 0; background: var(--panel); border-radius: 2rem; padding: 1.5rem 2.2rem; margin-bottom: 1.8rem;
  display: flex; flex-direction: column; justify-content: center; }
.kid:last-child { margin-bottom: 0; }
.kid-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: .6rem; }
.kid-name { font-size: 3.2rem; font-weight: 700; }
.kid-total { font-size: 5rem; font-weight: 700; color: var(--mint); font-variant-numeric: tabular-nums; }
.kid-total small { font-size: 2rem; color: var(--muted); font-weight: 400; }
.block { display: flex; align-items: center; margin-top: .55rem; }
.block-name { width: 13.5rem; font-size: 1.9rem; color: var(--muted); }
.block-track { flex: 1; height: 1.9rem; border-radius: 1rem; background: var(--panel2); overflow: hidden; }
.block-fill { height: 100%; background: var(--blue); border-radius: 1rem; }
.block-min { width: 8rem; text-align: right; font-size: 2.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.kid-note { font-size: 1.6rem; color: var(--orange); margin-top: .5rem; }

.tv-bottom { display: flex; height: 21rem; flex-shrink: 0; }
.cal { flex: 1; min-width: 0; background: var(--panel); border-radius: 2rem; padding: 1.5rem 2.2rem; overflow: hidden; }
.cal h2 { margin: 0 0 .6rem; font-size: 2.2rem; color: var(--gold); }
.cal-list { display: flex; flex-wrap: wrap; }
.ev { width: 50%; padding: .5rem 1.5rem .5rem 0; display: flex; align-items: baseline; font-size: 2.2rem; }
.ev-when { flex-shrink: 0; width: 10.5rem; font-weight: 700; color: var(--mint); font-size: 2rem; }
.ev-text { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ev-date { color: var(--muted); font-size: 1.7rem; margin-left: .8rem; flex-shrink: 0; }
.empty { color: var(--muted); font-size: 2rem; }
.side { width: 33rem; margin-left: 1.8rem; display: flex; flex-direction: column; flex-shrink: 0; }
.player { flex: 1; min-height: 0; border-radius: 1.4rem; overflow: hidden; background: var(--panel); margin-bottom: 1rem;
  display: flex; align-items: center; justify-content: center; text-align: center; font-size: 1.9rem; color: var(--muted); padding: 0; }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.tv-btns { display: flex; }
.tv-btn { flex: 1; padding: .8rem; font-size: 1.9rem; font-weight: 700; border-radius: 1rem; border: .3rem solid transparent;
  background: var(--panel2); margin-right: .8rem; }
.tv-btn:last-child { margin-right: 0; }
.status { position: absolute; left: 50%; top: .6rem; transform: translateX(-50%); font-size: 1.5rem; color: var(--orange); }
#tv button:focus { outline: none; border-color: var(--gold); background: var(--gold); color: var(--panel); }

/* ---------- Switching feeds: a chosen panel grows to fill the screen ---------- */
.feed-tag, .fx { display: none; }
.feedbox { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-bottom: 1rem; }
.feedbox .player { margin-bottom: 0; }
#camBack { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; z-index: 4; }
.cam-big { position: relative; z-index: 5; transform-origin: 0 0; }
.tv-btns { position: relative; z-index: 6; }

/* ---------- Theme: Security Office. Only cheap effects, since TV processors are slow. ---------- */
#tv.theme-office { --bg: #020504; --panel: #07100c; --panel2: #10211a; --line: #1f4a35;
  --ink: #d9ffe9; --muted: #7fb79a; --mint: #5dffa0; --blue: #5dffa0; --orange: #ffc83d; --pink: #ff4b62; --gold: #ffc83d;
  background: var(--bg); font-family: "Courier New", "DejaVu Sans Mono", "Liberation Mono", monospace; }
.theme-office .hero, .theme-office .kid, .theme-office .cal, .theme-office .feedbox {
  position: relative; overflow: hidden; border-radius: .4rem; border: .25rem solid var(--line); background: var(--panel); }
.theme-office .hero { padding-top: 4.6rem; }
.theme-office .kid { padding-top: 4.2rem; }
.theme-office .cal { padding-top: 4.2rem; }
.theme-office .cal h2 { display: none; }
.theme-office .player { border-radius: 0; background: #000; }
.block-name, .block-min, .ev-when, .tv-btn { white-space: nowrap; }
.theme-office .block-name { width: 15.5rem; }
.theme-office .block-min { width: 9.5rem; }
.theme-office .ev-when { width: 13rem; }
.theme-office .ev { font-size: 2rem; }
.theme-office .ev-date { font-size: 1.5rem; }
.theme-office .tv-btn { font-size: 1.55rem; padding: .8rem .2rem; }
.theme-office .stop, .theme-office .tv-btn { border-radius: .3rem; }
.theme-office .block-track, .theme-office .block-fill { border-radius: 0; }
.theme-office .hero-count { color: var(--mint); text-shadow: 0 0 2rem rgba(93,255,160,.55); animation: jitter 7s infinite; }
.theme-office .hero.soon .hero-count { color: var(--orange); text-shadow: 0 0 2rem rgba(255,200,61,.55); }
.theme-office .hero.now .hero-count { color: var(--pink); text-shadow: 0 0 2rem rgba(255,75,98,.65); }
.theme-office .feed-tag { display: flex; justify-content: space-between; position: absolute; left: 0; right: 0; top: 0; z-index: 3;
  padding: .6rem 1.2rem; font-size: 1.9rem; color: var(--mint); background: rgba(0,0,0,.55); }
.theme-office .feedbox .feed-tag { position: static; flex-shrink: 0; padding: .3rem .8rem; font-size: 1.5rem; }
.theme-office .rec { color: var(--pink); animation: rec 2s steps(1) infinite; }
.theme-office .fx { display: block; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 2; overflow: hidden; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) .12rem, transparent .12rem, transparent .4rem);
  animation: flicker 6s infinite; }
.theme-office .fx::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 18%;
  background: rgba(190,255,220,.07); animation: roll 8s linear infinite; }
.theme-office .kid:nth-of-type(2) .fx::after { animation-duration: 11s; animation-delay: -4s; }
.theme-office .cal .fx::after { animation-duration: 13s; animation-delay: -7s; }
#tv.switching .fx { background: repeating-linear-gradient(0deg, rgba(255,255,255,.4) 0, rgba(255,255,255,.4) .3rem, rgba(0,0,0,.7) .3rem, rgba(0,0,0,.7) .7rem); }
@keyframes rec { 0% { opacity: 1; } 50% { opacity: .15; } }
@keyframes roll { from { transform: translateY(-120%); } to { transform: translateY(620%); } }
@keyframes flicker { 0%, 93%, 100% { opacity: 1; } 94% { opacity: .55; } 96% { opacity: .9; } 97% { opacity: .6; } }
@keyframes jitter { 0%, 95%, 100% { transform: none; } 96% { transform: translateX(-.5rem); } 98% { transform: translateX(.4rem); } }

/* ---------- Daily checklist on each kid's card ---------- */
.kid { position: relative; overflow: hidden; }
.kid-head { margin-bottom: .2rem; }
.kid-name { font-size: 2.9rem; }
.kid-total { font-size: 4.2rem; }
.kid-flag { margin-left: 1.2rem; padding: .2rem .9rem; font-size: 1.7rem; font-weight: 700; border-radius: .6rem; background: var(--gold); color: var(--panel); vertical-align: middle; }
.chips { display: flex; margin-top: .9rem; }
.chip { flex: 1; min-width: 0; margin-right: .7rem; padding: .5rem .6rem; border-radius: .8rem; background: var(--panel2); display: flex; align-items: center; min-height: 5.6rem; }
.chip:last-child { margin-right: 0; }
.chip-icon { width: 4rem; height: 4rem; flex-shrink: 0; margin-right: .5rem; display: flex; align-items: center; justify-content: center; }
.chip-ring { width: 2.4rem; height: 2.4rem; border-radius: 50%; border: .25rem dashed var(--muted); opacity: .6; }
.chip-text { min-width: 0; font-size: 1.55rem; line-height: 1.12; color: var(--muted); }
.theme-office .chip-text { font-size: 1.3rem; }
.theme-office .chip-icon { width: 3.2rem; margin-right: .3rem; }
.theme-office .kid { padding-top: 3.6rem; padding-bottom: .8rem; }
.chip.on { background: var(--mint); }
.chip.on .chip-text { color: var(--panel); font-weight: 700; }
.mascot { display: block; width: 100%; height: 100%; }
.pop { animation: pop .7s ease-out; }
.parade { position: absolute; left: 0; bottom: .5rem; width: 9rem; height: 9rem; z-index: 4; animation: parade 5s linear forwards; }
.hero { position: relative; }
.hero-art { position: absolute; right: 3rem; bottom: 10.5rem; width: 14rem; height: 14rem; animation: bob 4s ease-in-out infinite; }
.tv-banner { font-size: 2.6rem; font-weight: 700; display: flex; align-items: center; color: var(--gold); }
.tv-banner .mascot { width: 4.4rem; height: 4.4rem; margin-right: .8rem; }
.leaves { display: none; }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.35) rotate(8deg); } 100% { transform: none; } }
@keyframes parade { 0% { transform: translateX(-10rem); opacity: 1; } 95% { opacity: 1; } 100% { transform: translateX(62rem); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: none; } 50% { transform: translateY(-.8rem); } }

/* ---------- Theme: Thanksgiving ---------- */
#tv.theme-harvest { --bg: #4a2412; --panel: #fff3dc; --panel2: #f6dfb8; --line: #d99a4e; --ink: #4a2412; --muted: #8a5a34;
  --mint: #e9862c; --blue: #d9622b; --orange: #c9481f; --pink: #a8201a; --gold: #ffd27a;
  background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", "Noto Serif", serif; }
.theme-harvest .tv-date, .theme-harvest .tv-clock { color: var(--gold); }
.theme-harvest .hero, .theme-harvest .kid, .theme-harvest .cal, .theme-harvest .player { border: .3rem solid var(--line); }
.theme-harvest .hero-label, .theme-harvest .cal h2 { color: #b5481a; }
.theme-harvest .hero-count { color: #7a2e12; }
.theme-harvest .stop.next { background: #e9862c; color: #fff; }
.theme-harvest .stop.next span { color: #fff; }
.theme-harvest .kid-total { color: #b5481a; }
.theme-harvest .ev-when { color: #b5481a; width: 12.5rem; }
.theme-harvest .hero-count, .theme-harvest .tv-clock, .theme-harvest .kid-total, .theme-harvest .block-min, .theme-harvest .stop b { font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif; }
.theme-harvest .chip.on { background: #f3b35f; }
.theme-harvest .chip.on .chip-text { color: var(--ink); }
.theme-harvest .kid-flag { background: #b5481a; color: #fff; }
.theme-harvest .player { color: var(--muted); }
.theme-harvest .tv-btn { background: #6b3518; color: #fff3dc; }
.theme-harvest .leaves { display: block; position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; z-index: 3; }
.leaf { position: absolute; top: -5rem; width: 3.4rem; height: 3.4rem; animation: fall 17s linear infinite; }
@keyframes fall { from { transform: translateY(0) rotate(0); } to { transform: translateY(100rem) rotate(540deg); } }
#tv.theme-harvest button:focus { color: #4a2412; }

/* ---------- Parent editor: sized in em, so it fits a phone or fills a TV ---------- */
#editor { background: var(--bg); min-height: 100vh; font-size: 17px; }
#editor.overlay { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow-y: auto; font-size: 2.1rem; z-index: 10; }
.ed-wrap { max-width: 44em; margin: 0 auto; padding: 1em; }
.ed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .8em; }
.ed-head h1 { font-size: 1.4em; margin: 0; }
.tabs { display: flex; margin-bottom: 1em; }
.tab { flex: 1; padding: .65em .2em; margin-right: .4em; background: var(--panel); border: .15em solid transparent; border-radius: .6em; font-weight: 700; }
.tab:last-child { margin-right: 0; }
.tab.on { background: var(--blue); color: var(--panel); }
.card { background: var(--panel); border-radius: .9em; padding: 1em; margin-bottom: 1em; }
.card h2 { font-size: 1.1em; margin: 0 0 .6em; color: var(--gold); }
.lab { display: block; font-size: .9em; color: var(--muted); margin: .9em 0 .35em; }
.lab:first-child { margin-top: 0; }
.opts { display: flex; flex-wrap: wrap; margin: 0 -.2em; }
.opt { flex: 1 1 auto; min-height: 2.7em; padding: .5em .8em; margin: .2em; background: var(--panel2); border: .15em solid transparent; border-radius: .6em; }
.opt.on { background: var(--mint); color: var(--panel); font-weight: 700; }
.reason { display: flex; width: 100%; justify-content: space-between; text-align: left; min-height: 2.7em; padding: .55em .8em; margin-bottom: .35em;
  background: var(--panel2); border: .15em solid transparent; border-radius: .6em; }
.reason.on { background: var(--mint); color: var(--panel); font-weight: 700; }
.reason i { font-style: normal; flex-shrink: 0; margin-left: .8em; }
.go { display: block; width: 100%; min-height: 3em; margin-top: 1em; padding: .6em; background: var(--gold); color: var(--panel);
  border: .15em solid transparent; border-radius: .7em; font-weight: 700; font-size: 1.05em; }
.go:disabled { opacity: .45; }
.small { min-height: 2.4em; padding: .3em .8em; background: var(--panel2); border: .15em solid transparent; border-radius: .5em; }
.row { display: flex; align-items: center; justify-content: space-between; padding: .55em 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row > div { min-width: 0; padding-right: .8em; }
.row em { display: block; font-style: normal; color: var(--muted); font-size: .85em; }
input, select, textarea { width: 100%; min-height: 2.7em; padding: .4em .6em; background: var(--panel2); border: .15em solid var(--line); border-radius: .5em; }
.tab { font-size: .92em; }
.mark { display: flex; align-items: center; justify-content: center; flex: 1 1 40%; min-height: 3em; padding: .4em .6em; margin: .2em; background: var(--panel2); border: .15em solid transparent; border-radius: .6em; }
.mark.on { background: var(--mint); color: var(--panel); font-weight: 700; }
.mark .mascot { width: 1.9em; height: 1.9em; margin-right: .4em; flex-shrink: 0; }
.mark .ring { width: 1.3em; height: 1.3em; margin: 0 .55em 0 .25em; border-radius: 50%; border: .14em solid var(--muted); flex-shrink: 0; }
.list-item { font-weight: 700; margin: .9em 0 .25em; }
.list-item:first-of-type { margin-top: 0; }
.pair { display: flex; }
.pair > * { flex: 1; min-width: 0; margin-right: .6em; }
.pair > *:last-child { margin-right: 0; }
.check { display: flex; align-items: center; margin-top: .9em; }
.check input { width: 1.5em; min-height: 1.5em; margin: 0 .6em 0 0; flex-shrink: 0; }
.hint { font-size: .85em; color: var(--muted); margin: .6em 0 0; }
.day-row { display: flex; align-items: center; padding: .25em 0; }
.day-row b { width: 3em; flex-shrink: 0; }
.day-row select { flex: 1; min-width: 0; margin-left: .5em; }
.keypad { display: flex; flex-wrap: wrap; max-width: 15em; margin: 1em auto; }
.keypad button { width: 30%; margin: 1.6%; min-height: 3em; font-size: 1.2em; background: var(--panel2); border: .15em solid transparent; border-radius: .6em; }
.toast { position: fixed; left: 50%; bottom: 1.2em; transform: translateX(-50%); background: var(--mint); color: var(--panel);
  padding: .6em 1.1em; border-radius: .7em; font-weight: 700; z-index: 20; font-size: 17px; }
.toast.bad { background: var(--pink); }
#editor button:focus, #editor input:focus, #editor select:focus, #gate button:focus, #gate input:focus {
  outline: none; border-color: var(--gold); box-shadow: 0 0 0 .15em var(--gold); }

#gate { padding: 2em 1em; max-width: 30em; margin: 0 auto; font-size: 18px; }
#gate h1 { font-size: 1.5em; margin: 0 0 .6em; }
</style>
</head>
<body>

<div id="gate" class="hide"></div>

<div id="tv" class="hide">
  <div class="status hide" id="status"></div>
  <div class="leaves" id="leaves"></div>
  <div class="tv-top"><div class="tv-date" id="tvDate"></div><div class="tv-banner" id="tvBanner"></div><div class="tv-clock" id="tvClock"></div></div>
  <div id="camBack" class="hide"></div>
  <div class="tv-main">
    <div class="hero" id="hero" data-cam="Countdown">
      <div class="feed-tag"><span><span class="rec">&#9679;</span> CAM 1 &middot; COUNTDOWN</span><span class="feed-time"></span></div>
      <div class="fx"></div>
      <div class="hero-art" id="heroArt"></div>
      <div class="hero-label" id="heroLabel"></div>
      <div class="hero-count" id="heroCount"></div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="stops" id="stops"></div>
    </div>
    <div class="kids" id="kids"></div>
  </div>
  <div class="tv-bottom">
    <div class="cal" data-cam="Calendar">
      <div class="feed-tag"><span><span class="rec">&#9679;</span> CAM 4 &middot; CALENDAR</span><span class="feed-time"></span></div>
      <div class="fx"></div>
      <h2>Coming up</h2><div class="cal-list" id="cal"></div>
    </div>
    <div class="side">
      <div class="feedbox" data-cam="Music">
        <div class="feed-tag"><span><span class="rec">&#9679;</span> CAM 5 &middot; MUSIC</span></div>
        <div class="player" id="player"></div>
      </div>
      <div class="tv-btns">
        <button class="tv-btn" id="btnCams" data-act="tvCams">Wall</button>
        <button class="tv-btn" id="btnMusic" data-act="tvMusic">Music</button>
        <button class="tv-btn" id="btnEdit" data-act="tvEdit">Parents</button>
      </div>
    </div>
  </div>
</div>

<div id="editor" class="hide"></div>
<div id="toast" class="toast hide"></div>

<script src="config.js"></script>
<script>
(function () {
  // Written in plain older JavaScript on purpose: TV browsers can be years behind.
  // Lofi Girl's live streams. Their IDs change now and then, so parents can also paste a new link.
  var LOFI_PRESETS = [{ id: '4t4AQ15yj1M', text: 'Cozy Christmas lo-fi' }, { id: '0sfDth4lMLc', text: 'Spooky lo-fi' }];
  var POLL_MS = 15000;
  var DAY_MS = 86400000;
  var DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // The rules from the family plan. Kid names are saved in the family's data, not in this public file.
  var DEFAULT_SETTINGS = {
    kids: ['Kid 1', 'Kid 2'],
    pin: '',
    theme: 'office',
    camTour: false,
    checklist: ['Dressed', 'Breakfast', 'Floss and brush', 'Backpack & Chromebook'],
    blockMinutes: 45,
    floor: 15,
    evening: '19:00',
    bedtime: '',
    schedule: {
      sun: { ready: '08:40', out: '' },
      mon: { ready: '07:50', out: '08:00' },
      tue: { ready: '07:50', out: '08:00' },
      wed: { ready: '07:50', out: '08:00' },
      thu: { ready: '08:40', out: '08:50' },
      fri: { ready: '07:50', out: '08:00' },
      sat: { ready: '08:40', out: '' }
    }
  };
  var REASONS = [

    if (list.indexOf(cur) < 0) { if (list.length) list[0].focus(); return; }
    var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2, best = null, bestScore = 1e12;
    for (i = 0; i < list.length; i++) {
      if (list[i] === cur) continue;
      var b = list[i].getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var main = dir === 'left' ? a.left - b.right : dir === 'right' ? b.left - a.right : dir === 'up' ? a.top - b.bottom : b.top - a.bottom;
      if (main < -2) continue;
      var cross = dir === 'left' || dir === 'right' ? Math.abs(by - ay) : Math.abs(bx - ax);
      var score = main + cross * 2;
      if (score < bestScore) { bestScore = score; best = list[i]; }
    }
    if (best) { best.focus(); if (best.scrollIntoView) best.scrollIntoView({ block: 'nearest' }); }
  }
  document.addEventListener('keydown', function (e) {
    var dirs = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' }, dir = dirs[e.keyCode], t = e.target, tag = t && t.tagName;
    var typing = (tag === 'INPUT' && t.type !== 'checkbox') || tag === 'TEXTAREA';
    if (dir) {
      if (typing && (dir === 'left' || dir === 'right') && t.value) return;
      e.preventDefault();
      moveFocus(dir);
      return;
    }
    if (e.keyCode === 13 && tag === 'SELECT' && t.showPicker) { try { t.showPicker(); e.preventDefault(); } catch (err) {} return; }
    if (tvEditing && !pinOk && e.keyCode >= 48 && e.keyCode <= 57) { pinPress(String(e.keyCode - 48)); return; }
    // Escape, plus the Back codes used by LG (461) and Samsung (10009) remotes.
    var isBack = e.keyCode === 27 || e.keyCode === 461 || e.keyCode === 10009 || e.keyCode === 8;
    if (tvEditing && !typing && isBack) {
      e.preventDefault();
      closeTvEditor();
    } else if (!tvEditing && camIndex >= 0 && isBack) {
      e.preventDefault();
      showCam(-1);
    }
  });

  /* ---------- Start up ---------- */
  function renderAll() {
    if ($('tv').className.indexOf('hide') < 0) { applyTheme(); renderKids(); renderCal(); renderMusic(); tick(); }
    renderEditor();
  }
  function showGate(message) {
    var g = $('gate');
    g.className = '';
    g.innerHTML = '<h1>Family Board</h1><p>' + esc(message) + '</p>' +
      '<label class="lab" for="codeBox">Family code</label><input id="codeBox" autocapitalize="off" autocomplete="off" spellcheck="false">' +
      '<button class="go" id="codeGo">Open board</button>';
    $('codeGo').onclick = function () {
      var v = $('codeBox').value.replace(/\s/g, '').toLowerCase();
      if (v) { store('code', v); code = v; g.className = 'hide'; begin(); }
    };
    $('codeBox').focus();
  }
  function badCode() {
    store('code', '');
    $('tv').className = 'hide'; $('editor').className = 'hide';
    clearInterval(pollTimer);
    showGate("That family code didn't work. Check it and try again.");
  }
  var pollTimer = null;
  function begin() {
    if (EDIT_ONLY) { $('editor').className = ''; pruneLater = true; }
    else { $('tv').className = ''; fitTv(); window.addEventListener('resize', fitTv); $('btnMusic').focus(); }
    if (!DEMO) { try { data = JSON.parse(store('cache') || '{}') || {}; } catch (e) { data = {}; } }
    renderAll();
    poll();
    pollTimer = setInterval(poll, POLL_MS);
    if (pruneLater) setTimeout(pruneOld, 5000);
  }
  var pruneLater = false;
  function start() {
    setInterval(tick, 1000);
    if (DEMO) { begin(); return; }
    if (!DB) { $('gate').className = ''; $('gate').innerHTML = '<h1>Family Board</h1><p>The shared database is not connected yet.</p>'; return; }
    var hash = location.hash.replace(/^#/, '').replace(/\s/g, '').toLowerCase();
    if (hash) store('code', hash);
    code = hash || store('code') || '';
    if (code) begin(); else showGate('Enter your family code. You only need to do this once on each device.');
  }
  start();
})();
</script>
</body>
