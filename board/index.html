<script src="config.js"></script>
<script>
(function () {
  // Written in plain older JavaScript on purpose: TV browsers can be years behind.
  // Lofi Girl's live streams. Their IDs change now and then, so parents can also paste a new link.
  var LOFI_PRESETS = [{ id: '4t4AQ15yj1M', text: 'Cozy Christmas lo-fi' }, { id: '0sfDth4lMLc', text: 'Spooky lo-fi' }];
  var POLL_MS = 15000;
  var DAY_MS = 86400000;
  var DAYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  // The rules from the family plan. Kid names are saved in the family's data, not in this public file.
  var DEFAULT_SETTINGS = {
    kids: ['Kid 1', 'Kid 2'],
    pin: '',
    theme: 'office',
    camTour: false,
    fxLevel: 'normal',
    // Pit Stop cars, one per kid. Real names and sponsors are set from the phone, so they stay out of this public file.
    cars: [{ number: '67', color: '#1d5fd1', sponsor: 'Testing Lab' }, { number: '76', color: '#d62828', sponsor: 'Snack Stand' }],
    fxSound: false, // theme sounds on the TV (Pit Stop, Mother Pig Country)
    checklist: ['Dressed', 'Breakfast', 'Floss and brush', 'Backpack & Chromebook'],
    checklist2: ['Homework done', 'Room clean', 'Teeth brushed', 'Showered'],
    blockMinutes: 45,
    floor: 15,
    evening: '19:00',
    bedtime: '',
    schedule: {
      sun: { ready: '08:40', out: '' },
      mon: { ready: '07:50', out: '08:00' },
      tue: { ready: '07:50', out: '08:00' },
      wed: { ready: '07:50', out: '08:00' },
      thu: { ready: '08:40', out: '08:50' },
      fri: { ready: '07:50', out: '08:00' },
      sat: { ready: '08:40', out: '' }
    }
  };
  var REASONS = [
    { id: 'late', text: 'Past the ready-by time', perMin: true },
    { id: 'hw', text: 'Past the homework done-by time', perMin: true },
    { id: 'teeth', text: 'Teeth over 5 minutes', perMin: true },
    { id: 'shower', text: 'Shower over 10 minutes', perMin: true },
    { id: 'yell', text: 'Yelling or name-calling', min: 5 },
    { id: 'yellcalm', text: 'Yelling, calmed within a minute', min: 3 },
    { id: 'brother', text: "Commenting on brother's behavior", min: 5 },
    { id: 'forgot', text: 'Forgot materials or work', min: 5 },
    { id: 'other', text: 'Not on the chart (parent call)', perMin: true }
  ];

  var params = location.search;
  var DEMO = params.indexOf('demo') >= 0;
  var EDIT_ONLY = params.indexOf('edit') >= 0;
  var DB = (window.BOARD_CONFIG && window.BOARD_CONFIG.databaseURL || '').replace(/\/+$/, '');

  var code = '';
  var data = {};
  var pending = 0;
  var lastDataJson = '';
  var lastError = false;
  var musicKey = null;
  var tvEditing = false;
  var pinEntry = null;
  var pinOk = false;
  var ed = { chanNames: {}, timerWho: 0, timerMins: 25, tab: 'list', kid: 0, reason: '', block: '', giveOpen: false, evOpen: false, evTitle: '', evPick: '', evView: null, evHour: '', evMin: '00', evNoSchool: false, more: '', draft: null };

  function $(id) { return document.getElementById(id); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem('board-' + key);
      localStorage.setItem('board-' + key, val);
    } catch (e) { return null; }
    return null;
  }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDateKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function atTime(d, hhmm) { var p = hhmm.split(':'); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), +p[0], +p[1]); }
  function time12(hhmm) {
    var p = hhmm.split(':'), h = +p[0];
    return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' am' : ' pm');
  }
  function newId() { return Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

  /* ---------- Data: one small tree, read by polling, written one path at a time so two parents don't collide ---------- */
  function setLocal(path, val) {
    var parts = path.split('/'), node = data, i;
    for (i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {};
      node = node[parts[i]];
    }
    if (val === null) delete node[parts[i]]; else node[parts[i]] = val;
  }
  function saveDemo() { store('demo', JSON.stringify(data)); }
  function request(method, path, body, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, DB + '/boards/' + encodeURIComponent(code) + (path ? '/' + path : '') + '.json', true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        var parsed = null;
        try { parsed = JSON.parse(xhr.responseText); } catch (e) { cb(false, null, xhr.status); return; }
        cb(true, parsed, xhr.status);
      } else cb(false, null, xhr.status);
    };
    xhr.onerror = xhr.ontimeout = function () { cb(false, null, 0); };
    if (body !== undefined) { xhr.setRequestHeader('Content-Type', 'application/json'); xhr.send(JSON.stringify(body)); }
    else xhr.send();
  }
  function put(path, val, done) {
    setLocal(path, val);
    lastDataJson = JSON.stringify(data); // so a poll that disagrees with this write redraws instead of leaving it frozen
    renderAll();
    if (DEMO) { saveDemo(); if (done) done(); return; }
    pending++;
    request('PUT', path, val, function (ok) {
      pending--;
      if (!ok) toast("Couldn't save. Check the connection and try again.", true);
      else if (done) done();
      poll();
    });
  }
  function poll() {
    if (DEMO) {
      var saved = store('demo');
      try { data = saved ? JSON.parse(saved) : data; } catch (e) {}
      afterData();
      return;
    }
    if (pending) return;
    request('GET', '', undefined, function (ok, val, status) {
      if (pending) return;
      lastError = !ok;
      if (ok) { data = val || {}; store('cache', JSON.stringify(data)); }
      else if (status === 401 || status === 403) { badCode(); return; }
      afterData();
    });
  }
  function pollTimers() {
    // Timers are checked every few seconds so they feel instant. They're tiny, so this stays cheap.
    if (DEMO || pending) return;
    request('GET', 'timers', undefined, function (ok, val) {
      if (!ok || pending) return;
      if (JSON.stringify(val) === JSON.stringify(data.timers === undefined ? null : data.timers)) return;
      if (val) data.timers = val; else delete data.timers;
      afterData();
    });
  }
  function afterData() {
    var json = JSON.stringify(data);
    if (json !== lastDataJson) {
      // What's already true when the page opens shouldn't animate as if it just happened.
      var opening = !lastDataJson;
      if (opening) { lastChecks = null; lastMins = null; }
      if (ed.syncing && data.icloud && data.icloud.at !== ed.syncFrom) { ed.syncing = 0; toast('Calendar synced'); editorForced = true; }
      lastDataJson = json;
      renderAll();
      if (opening && $('tv').className.indexOf('hide') < 0) playIntro();
    }
    renderStatus();
  }
  function settings() {
    var s = data.settings || {}, d = DEFAULT_SETTINGS, out = {}, k;
    for (k in d) out[k] = s[k] === undefined ? d[k] : s[k];
    out.schedule = {};
    for (k = 0; k < 7; k++) out.schedule[DAYS[k]] = (s.schedule && s.schedule[DAYS[k]]) || d.schedule[DAYS[k]];
    return out;
  }

  /* ---------- Plan logic ---------- */
  function events() {
    var list = [], ev = data.events || {}, id;
    for (id in ev) { var e = ev[id]; if (e && e.date) list.push({ id: id, title: e.title, date: e.date, time: e.time || '', noSchool: !!e.noSchool }); }
    var synced = (data.icloud && data.icloud.events) || {};
    for (id in synced) { var c = synced[id]; if (c && c.date) list.push({ id: id, title: c.title, date: c.date, end: c.end || c.date, time: c.time || '', noSchool: !!c.noSchool, icloud: true }); }
    list.sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; });
    return list;
  }
  function isNoSchool(d) {
    var k = dateKey(d), list = events(), i;
    for (i = 0; i < list.length; i++) if (list[i].noSchool && list[i].date <= k && (list[i].end || list[i].date) >= k) return true;
    return false;
  }
  function stopsFor(d) {
    var s = settings(), key = DAYS[d.getDay()], off = isNoSchool(d);
    var day = off ? s.schedule.sat : s.schedule[key];
    var hw = data.homework && data.homework[dateKey(d)];
    var list = [];
    if (day.ready) list.push({ at: day.ready, label: 'Ready by' });
    if (day.out) list.push({ at: day.out, label: 'Out the door' });
    if (hw) list.push({ at: hw, label: 'Homework done' });
    if (s.evening) list.push({ at: s.evening, label: 'Evening screens' });
    if (s.bedtime) list.push({ at: s.bedtime, label: 'Bedtime' });
    list.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    return list;
  }
  function kidMinutes(kid, key) {
    var s = settings(), log = (data.log && data.log[key]) || {}, raw = { after: 0, evening: 0 }, id;
    for (id in log) if (log[id].kid === kid && raw[log[id].block] !== undefined) raw[log[id].block] += log[id].min;
    var cap = s.blockMinutes - s.floor;
    var after = s.blockMinutes - Math.max(0, Math.min(raw.after, cap));
    var evening = s.blockMinutes - Math.max(0, Math.min(raw.evening, cap));
    var leftAfter = minutesLeft(after, kid, 'after', key), leftEvening = minutesLeft(evening, kid, 'evening', key);
    return { after: after, evening: evening, total: after + evening, leftAfter: leftAfter, leftEvening: leftEvening, left: leftAfter + leftEvening, full: s.blockMinutes * 2, taken: raw,
      over: Math.max(0, raw.after - cap) + Math.max(0, raw.evening - cap) };
  }
  function usedMs(kid, block, key) {
    // Time already watched, plus the stretch running now. It's worked out on each screen, so penalties change the countdown right away.
    var day = data.used && data.used[key], ms = (day && day[kid] && day[kid][block]) || 0, t = data.timers && data.timers[kid];
    if (t && t.screen === block && t.day === key && t.start) ms += Date.now() - t.start;
    return ms;
  }
  function minutesLeft(block, kid, name, key) { return Math.max(0, Math.ceil((block * 60000 - usedMs(kid, name, key)) / 60000)); }
  function nextBlock() { return new Date().getHours() < 17 ? 'after' : 'evening'; }

  /* ---------- TV rendering ---------- */
  function fitTv() {
    // Keep a 16:9 layout inside whatever the TV browser actually leaves, including its toolbars.
    var w = window.innerWidth, h = window.innerHeight;
    document.documentElement.style.fontSize = (Math.min(w / 160, h / 90)) + 'px';
    fitChips();
  }
  function fitChips() {
    // TV fonts vary and parents can type anything, so each label shrinks until it really fits its chip.
    var labels = document.querySelectorAll('.chip-text'), rem = parseFloat(getComputedStyle(document.documentElement).fontSize), i;
    for (i = 0; i < labels.length; i++) {
      var el = labels[i], size;
      el.style.fontSize = '';
      size = parseFloat(getComputedStyle(el).fontSize) / rem;
      while (size > .9 && (el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight + 1)) {
        size -= .05;
        el.style.fontSize = size * rem + 'px';
      }
    }
  }
  function tick() {
    updateTimers();
    if ($('tv').className.indexOf('hide') >= 0) return;
    var now = new Date(), h = now.getHours(), dayNow = dateKey(now);
    if (lastDay && lastDay !== dayNow) {
      // A new day: checks and minutes reset even if no one has changed anything.
      lastDay = dayNow; lastChecks = null; lastMins = null;
      renderAll();
      return;
    }
    lastDay = dayNow;
    var part = checkPart();
    if (lastPart && lastPart !== part) {
      lastPart = part; lastChecks = null;
      renderAll();
      return;
    }
    lastPart = part;
    $('tvDate').innerHTML = esc(DAY_NAMES[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate());
    $('tvClock').innerHTML = (h % 12 || 12) + '<span style="opacity:' + (now.getSeconds() % 2 ? '.35' : '1') + '">:</span>' + pad(now.getMinutes()) + (h < 12 ? ' am' : ' pm');

    var today = stopsFor(now), next = null, tomorrow = false, i;
    for (i = 0; i < today.length; i++) if (atTime(now, today[i].at) > now) { next = today[i]; break; }
    var target;
    if (next) target = atTime(now, next.at);
    else {
      var t = addDays(now, 1), list = stopsFor(t);
      next = list[0]; tomorrow = true;
      target = next ? atTime(t, next.at) : null;
    }
    var hero = $('hero'), level = '';
    urgent = false;
    if (target) {
      var left = Math.floor((target - now) / 1000);
      var H = Math.floor(left / 3600), M = Math.floor(left % 3600 / 60), S = left % 60;
      if (left <= 60) level = 'now'; else if (left <= 300) level = 'soon';
      urgent = left <= 300;
      $('heroLabel').innerHTML = esc(next.label) + ' <small>' + time12(next.at) + (tomorrow ? ' tomorrow' : '') + '</small>';
      $('heroCount').innerHTML = (H ? H + ':' + pad(M) : M) + ':' + pad(S);
      var then = tomorrow ? null : today[i + 1];
      $('heroSub').innerHTML = then ? 'Then ' + esc(then.label.toLowerCase()) + ' at ' + time12(then.at) : '';
    } else {
      $('heroLabel').innerHTML = ''; $('heroCount').innerHTML = ''; $('heroSub').innerHTML = '';
    }
    var targetMs = target ? target.getTime() : 0;
    if (lastTarget && lastTarget.ms !== targetMs && lastTarget.ms <= now.getTime()) fxTimeUp(lastTarget.label);
    lastTarget = target ? { ms: targetMs, label: next.label } : null;
    hero.classList[level === 'now' ? 'add' : 'remove']('now');
    hero.classList[level === 'soon' ? 'add' : 'remove']('soon');
    renderQuote(now);
    renderStops(today, now, tomorrow ? null : next);
    var stamp = pad(now.getMonth() + 1) + '/' + pad(now.getDate()) + ' ' + pad(h) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    var stamps = document.querySelectorAll('.feed-time');
    for (i = 0; i < stamps.length; i++) stamps[i].innerHTML = stamp;
    renderBanner(now);
    tourTick();
    fxTick();
  }

  /* ---------- A new line under the countdown every 45 seconds ---------- */
  // Only add a name to a line it can really be traced to. Plenty of famous quotes online were never said.
  var QUOTES = [
    // Seize the day
    ['Carpe diem. Seize the day.', 'Horace'],
    ['Begin, be bold, and venture to be wise.', 'Horace'],
    ['Never leave that till tomorrow which you can do today.', 'Benjamin Franklin'],

    testFinale: function () { closeTvEditor(); fxFinale(); },
    syncNow: syncNow,
    syncKeySave: function () {
      var key = (ed.syncKeyDraft || '').replace(/\s/g, '');

    },
    syncKeyRemove: function () { put('syncKey', null); forceEditor(); },
    timerWho: function (a) { ed.timerWho = a; forceEditor(); },
    screenGo: function (a) { startScreen(a); forceEditor(); },
    timerGo: function (a) { var p = TIMER_PRESETS[+a]; startTimer(p.label, p.min); forceEditor(); },
    timerStep: function (a) { ed.timerMins = Math.max(5, Math.min(180, ed.timerMins + +a)); forceEditor(); },
    timerCustom: function () { startTimer('', ed.timerMins); forceEditor(); },
    timerAdd: function (a) {
      var t = JSON.parse(JSON.stringify(liveTimer(a)));

    timerPause: function (a) {

      if (t.screen) {
        next.screen = t.screen; next.kid = t.kid; next.day = t.day;

    timerStop: function (a) { bankScreenTime(a); put('timers/' + a, null); forceEditor(); },
    check: function (a) {
      var parts = a.split('-'), kid = +parts[0], item = parts[1], part = item.charAt(0) === 'p' ? 'pm' : 'am', key = dateKey(new Date());
      put('checks/' + key + '/' + kid + '/' + item, isChecked(kid, item, key) ? null : true);

    giveToggle: function () { ed.giveOpen = !ed.giveOpen; forceEditor(); },
    give: function (a) {
      // Only what was actually taken can come back, so a block never goes above its full time.
      var key = dateKey(new Date()), block = ed.block || nextBlock(), taken = kidMinutes(ed.kid, key).taken[block], min = Math.min(+a, taken), id = newId();

      put('log/' + key + '/' + id, { kid: ed.kid, block: block, min: -min, reason: 'Minutes given back', at: Date.now() });

      forceEditor();
    },
    homework: function (a) { put('homework/' + dateKey(new Date()), a || null); forceEditor(); },
    syncSetup: function () { ed.syncSetup = !ed.syncSetup; forceEditor(); },
    evOpen: function () { ed.evOpen = true; forceEditor(); },
    evClose: function () { ed.evOpen = false; forceEditor(); },
    evNav: function (a) { var d = new Date(ed.evView.y, ed.evView.m + +a, 1); ed.evView = { y: d.getFullYear(), m: d.getMonth() }; forceEditor(); },
    evPick: function (a) { ed.evPick = a; forceEditor(); },
    evHour: function (a) { ed.evHour = a; forceEditor(); },
    evMin: function (a) { ed.evMin = a; forceEditor(); },
    evNoSchool: function () { ed.evNoSchool = !ed.evNoSchool; forceEditor(); },
    addEvent: function () {
      var title = (ed.evTitle || '').replace(/^\s+|\s+$/g, '');

      put('events/' + newId(), { title: title, date: ed.evPick || dateKey(new Date()), time: ed.evHour ? ed.evHour + ':' + ed.evMin : '', noSchool: !!ed.evNoSchool });
      ed.evTitle = ''; ed.evHour = ''; ed.evMin = '00'; ed.evNoSchool = false; ed.evPick = ''; ed.evView = null; ed.evOpen = false;
      toast('Added');
      forceEditor();
    },
    delEvent: function (a) { put('events/' + a, null); forceEditor(); },
    music: function (a) {
      if (a === 'off') put('music/source', 'off');
      else put('music', { source: 'lofi', video: a });
      forceEditor();
    },
    chanSave: function () {
      var list = copyChannels(), i;
      for (i = 0; i < list.length; i++) {
        var name = ed.chanNames[i] !== undefined ? ed.chanNames[i].replace(/^\s+|\s+$/g, '') : list[i].text;
        if (!name) { toast('Every channel needs a name', true); return; }
        list[i].text = name;
      }
      ed.chanNames = {};
      put('channels', list);
      toast('Saved');
      forceEditor();
    },
    chanDefault: function (a) {
      var list = copyChannels(), moved = list.splice(+a, 1)[0];
      list.unshift(moved);
      ed.chanNames = {};
      put('channels', list);
      toast(moved.text + ' is now the default');
      forceEditor();
    },
    chanRemove: function (a) {
      var list = copyChannels(), gone = list.splice(+a, 1)[0];
      ed.chanNames = {};
      put('channels', list);
      if (musicSource() === 'lofi' && lofiId() === gone.id) put('music', { source: 'lofi', video: list[0].id });
      toast('Removed ' + gone.text);
      forceEditor();
    },
    chanAdd: function () {
      var name = (ed.chanName || '').replace(/^\s+|\s+$/g, ''), id = youtubeId((ed.ytLink || '').replace(/\s/g, ''));
      if (!name) { toast('Give the channel a name', true); return; }
      if (!id) { toast("That doesn't look like a YouTube link", true); return; }
      var list = copyChannels();
      list.push({ id: id, text: name });
      put('channels', list);
      put('music', { source: 'lofi', video: id });
      ed.chanName = ''; ed.ytLink = '';
      toast('Added ' + name);
      forceEditor();
    },
    saveSetup: function () {
      var d = ed.draft;
      if (d.pin && !/^\d{4}$/.test(d.pin)) { toast('The PIN needs 4 digits', true); return; }
      d.blockMinutes = Math.max(15, parseInt(d.blockMinutes, 10) || 45);
      d.floor = Math.min(d.blockMinutes, Math.max(0, parseInt(d.floor, 10) || 0));
      if (d.checklistText !== undefined) {
        d.checklist = d.checklistText.split('\n').map(function (t) { return t.replace(/^\s+|\s+$/g, ''); }).filter(Boolean).slice(0, 6);
        delete d.checklistText;
      }
      if (d.checklistText2 !== undefined) {
        d.checklist2 = d.checklistText2.split('\n').map(function (t) { return t.replace(/^\s+|\s+$/g, ''); }).filter(Boolean).slice(0, 6);

  };
  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
    if (!el || el === document) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.getAttribute('data-arg'));
  });
  function onInput(e) {
    var el = e.target, v = el.type === 'checkbox' ? el.checked : el.value;
    var draft = el.getAttribute && el.getAttribute('data-draft');
    if (draft) { ed[draft] = v; return; }
    var pick = el.getAttribute && el.getAttribute('data-pick');
    if (pick) { if (e.type === 'change') ACTIONS[pick](v); return; }
    var chan = el.getAttribute && el.getAttribute('data-chan');
    if (chan !== null && chan !== undefined) { ed.chanNames[chan] = v; return; }
    var key = el.getAttribute && el.getAttribute('data-setup');
    if (key && ed.draft) {
      if (key === 'kid0') ed.draft.kids[0] = v;
      else if (key === 'kid1') ed.draft.kids[1] = v;
      else if (key.indexOf('ready-') === 0) ed.draft.schedule[key.slice(6)].ready = v;
      else if (key.indexOf('out-') === 0) ed.draft.schedule[key.slice(4)].out = v;
      else if (key.indexOf('car-') === 0) { var cp = key.split('-'); ed.draft.cars[+cp[1]][cp[2]] = v; }
      else ed.draft[key] = v;
      return;
    }
  }
  document.addEventListener('input', onInput);
  document.addEventListener('change', onInput);

  /* ---------- Remote control: arrows move between buttons, Back leaves the editor ---------- */
  function focusables() {
    var root = tvEditing ? $('editor') : ($('gate').className.indexOf('hide') < 0 ? $('gate') : $('editor').className.indexOf('hide') < 0 ? $('editor') : $('tv'));
    var all = root.querySelectorAll('button, input, select, textarea'), out = [], i;
    for (i = 0; i < all.length; i++) if (all[i].offsetWidth > 0 && !all[i].disabled) out.push(all[i]);
    return out;
  }
  function moveFocus(dir) {
    var list = focusables(), cur = document.activeElement, i;
    if (list.indexOf(cur) < 0) { if (list.length) list[0].focus(); return; }
    var a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2, best = null, bestScore = 1e12;
    for (i = 0; i < list.length; i++) {
      if (list[i] === cur) continue;
      var b = list[i].getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
      var main = dir === 'left' ? a.left - b.right : dir === 'right' ? b.left - a.right : dir === 'up' ? a.top - b.bottom : b.top - a.bottom;
      if (main < -2) continue;
      var cross = dir === 'left' || dir === 'right' ? Math.abs(by - ay) : Math.abs(bx - ax);
      var score = main + cross * 2;

    if (tvEditing && !typing && isBack) {
      e.preventDefault();
      closeTvEditor();
    } else if (!tvEditing && camIndex >= 0 && isBack) {
      e.preventDefault();
      showCam(-1);
    }
  });

  /* ---------- Start up ---------- */
  function renderAll() {
    if ($('tv').className.indexOf('hide') < 0) { applyTheme(); renderKids(); renderCal(); renderMusic(); tick(); }
    renderEditor();
  }
  function showGate(message) {
    var g = $('gate');
    g.className = '';
    g.innerHTML = '<h1>Family Board</h1><p>' + esc(message) + '</p>' +
      '<label class="lab" for="codeBox">Family code</label><input id="codeBox" autocapitalize="off" autocomplete="off" spellcheck="false">' +
      '<button class="go" id="codeGo">Open board</button>';
    $('codeGo').onclick = function () {
      var v = $('codeBox').value.replace(/\s/g, '').toLowerCase();
      if (v) { store('code', v); code = v; g.className = 'hide'; begin(); }
    };
    $('codeBox').focus();
  }
  function badCode() {
    store('code', '');
    $('tv').className = 'hide'; $('editor').className = 'hide';
    clearInterval(pollTimer);
    showGate("That family code didn't work. Check it and try again.");
  }
  function checkForUpdate() {
    // The TV stays open for days, so it picks up new versions by itself. A reload can stop the music until someone presses Music.
    if (tvEditing || urgent) return;
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', location.pathname + '?check=' + Date.now(), true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      var stamp = xhr.status === 200 && xhr.getResponseHeader('Last-Modified');

      var search = location.search.replace(/[?&]r=\d+/, '').replace(/^&/, '?');
      location.replace(location.pathname + search + (search ? '&' : '?') + 'r=' + Date.now() + location.hash);
    };
    xhr.send();
  }
  var pollTimer = null;
  if (DEMO) window.boardFx = { pigFinale: playPigFinale, pigSkip: endPigFinale, pigScenes: PIG_SCENES, pitPlan: pitPlan, pitState: pitState, race: function (k) { queueRace(k, true); }, skipRace: endRace, check: function (kid, item, on) { put('checks/' + dateKey(new Date()) + '/' + kid + '/' + item, on ? true : null); }, checkUpdate: checkForUpdate, quotes: QUOTES, play: playFx, scenes: FX_SCENES, timeUp: fxTimeUp, celebrate: fxCelebrate, intro: playIntro, finale: fxFinale };
  function begin() {
    if (EDIT_ONLY) { $('editor').className = ''; pruneLater = true; }
    else { $('tv').className = ''; fitTv(); window.addEventListener('resize', fitTv); $('btnMusic').focus(); setInterval(checkForUpdate, 300000); if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitChips); }
    if (!DEMO) { try { data = JSON.parse(store('cache') || '{}') || {}; } catch (e) { data = {}; } }
    renderAll();
    poll();
    pollTimer = setInterval(poll, POLL_MS);
    setInterval(pollTimers, 4000);
    if (pruneLater) setTimeout(pruneOld, 5000);
  }
  var pruneLater = false;
  function start() {
    setInterval(tick, 1000);
    if (DEMO) { begin(); return; }
    if (!DB) { $('gate').className = ''; $('gate').innerHTML = '<h1>Family Board</h1><p>The shared database is not connected yet.</p>'; return; }
    var hash = location.hash.replace(/^#/, '').replace(/\s/g, '').toLowerCase();

  }

})();
